      <button class="ghost" data-a="ev">evaluation</button>
      <button class="ghost" data-a="next">next →</button>`,
    feeling:`<span class="cl">tap any phrase above</span><button class="ghost" data-a="reset">clear</button>`,
    request:`<button class="ghost" data-s="0">too much work</button><button class="ghost" data-s="1">let me be me</button>
      <button class="ghost" data-s="2">stop drinking</button><button class="ghost" data-s="3">be honest with me</button>
      <button class="ghost" data-a="fix">rewrite it →</button>`,
    translate:`<button class="ghost" data-s="0">the mosque</button><button class="ghost" data-s="1">the arrogant speaker</button>
      <button class="ghost" data-s="2">you never listen</button><button class="ghost" data-s="3">I want to die</button>
      <button class="ghost" data-s="4">the knife</button>`,
    fourdoors:`<button class="ghost act" data-s="0">said to you</button><button class="ghost" data-s="1">said by you, to you</button>`
  };
  return `<figure class="frame" data-sim="${kind}">
    <style>
    figure.frame .nvcs{padding:15px 15px 3px; font-size:14.5px; line-height:1.62; color:var(--ink-muted);}
    figure.frame .nvcs b{color:var(--ink); font-weight:600;}
    figure.frame .nvcs .q{color:var(--ink); font-size:16px; line-height:1.5; margin-bottom:11px;}
    figure.frame .nvcs .row{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px;}
    figure.frame .nvcs .out{border-left:2px solid var(--accent-dim); padding:9px 13px;
      background:var(--accent-wash); border-radius:3px;}
    figure.frame .nvcs .lbl{font-size:10.5px; letter-spacing:.13em; text-transform:uppercase;
      color:var(--ink-faint); display:block; margin-bottom:.4em;}
    figure.frame .nvcs .verdict{font-weight:600; color:var(--ink);}
    figure.frame .nvcs .no{color:#8a5c5c;} figure.frame .nvcs .ok{color:#4f7050;}
    figure.frame .nvcs .foot{font-size:12.5px; color:var(--ink-faint); margin:11px 0 4px;}
    figure.frame .nvcs .meter{height:6px; background:var(--surface-sunk); border:1px solid var(--border);
      border-radius:3px; overflow:hidden; margin:0 0 13px;}
    figure.frame .nvcs .meter i{display:block; height:100%; background:var(--accent); transition:width .12s;}
    figure.frame .nvcs .checks{display:flex; flex-wrap:wrap; gap:14px; font-size:12.5px; margin:0 0 12px;}
    figure.frame .nvcs .checks span{color:var(--ink-faint);}
    figure.frame .ghost.act{color:var(--accent); border-color:var(--accent-dim); background:var(--accent-wash);}
    </style>
    ${body[kind]}
    <div class="controls">${ctl[kind]}</div>
    <figcaption>${caps[kind]}</figcaption>
  </figure>`;
}
const SIMS = {};

function nvcPick(fig, btn, sel){
  fig.querySelectorAll(sel).forEach(b=>b.classList.remove('act'));
  if(btn) btn.classList.add('act');
}

SIMS.judgment = fig=>{
  const q=fig.querySelector('[data-q]'), bar=fig.querySelector('[data-bar]'),
        lab=fig.querySelector('[data-lab]'), tr=fig.querySelector('[data-tr]'),
        foot=fig.querySelector('[data-foot]'), sl=fig.querySelector('input[type=range]');
  const T={
    affection:{who:'my partner', what:'wants',
      lo:['&ldquo;She is aloof and insensitive.&rdquo;','I am wanting more closeness than I am getting.'],
      hi:['&ldquo;She is needy and dependent.&rdquo;','I am wanting more space than I am getting.'],
      mid:['No label comes to mind at all.','Nothing of mine is unmet, so there is nothing to name.']},
    detail:{who:'my colleague', what:'cares about detail',
      lo:['&ldquo;He is sloppy and disorganised.&rdquo;','I am wanting more care and order than I am getting.'],
      hi:['&ldquo;He is picky and compulsive.&rdquo;','I am wanting more ease and speed than I am getting.'],
      mid:['No label comes to mind at all.','Nothing of mine is unmet, so there is nothing to name.']}};
  let topic='affection';
  function draw(){
    const v=+sl.value, t=T[topic];
    bar.style.width=v+'%';
    q.innerHTML=`Compared with me, <b>${t.who}</b> ${t.what} ` +
      (v<45?'<b>less</b> than I do.':v>55?'<b>more</b> than I do.':'<b>about the same</b> as I do.');
    const k=v<45?'lo':v>55?'hi':'mid';
    lab.innerHTML=t[k][0]; tr.innerHTML=t[k][1];
    foot.textContent = k==='mid'
      ? 'Notice what happens to the label the moment a gap opens in either direction.'
      : 'The label moved. The person did not. Only my unmet need changed direction.';
  }
  sl.oninput=draw;
  fig.querySelectorAll('.ghost[data-t]').forEach(b=>b.onclick=()=>{
    topic=b.dataset.t; nvcPick(fig,b,'.ghost[data-t]'); draw();});
  draw();
  return ()=>{};
};

SIMS.observe = fig=>{
  const Q=[
    ["John was angry with me yesterday for no reason.", false,
      "&ldquo;For no reason&rdquo; is an evaluation - and so is deciding he was angry.",
      "&ldquo;John told me he was angry,&rdquo; or &ldquo;John pounded his fist on the table.&rdquo;"],
    ["Yesterday evening Nancy bit her fingernails while watching television.", true,
      "Time, place, behaviour - and no verdict anywhere in it.", ""],
    ["Sam didn't ask for my opinion during the meeting.", true,
      "It reports an absence of a specific act, not a verdict about Sam.", ""],
    ["My father is a good man.", false,
      "The verb <b>to be</b> plus an evaluation, with no sign it is the speaker's evaluation.",
      "&ldquo;For the last twenty-five years, my father has given one-tenth of his salary to charity.&rdquo;"],
    ["Janice works too much.", false,
      "&ldquo;Too much&rdquo; is a judgment about quantity, not a quantity.",
      "&ldquo;Janice spent more than sixty hours at the office this week.&rdquo;"],
    ["Henry is aggressive.", false,
      "An adjective turned into an identity. Nothing here happened at a time or place.",
      "&ldquo;Henry hit his sister when she switched the television channel.&rdquo;"],
    ["Pam was first in line every day this week.", true,
      "&ldquo;Every day this week&rdquo; is countable here - a frequency word used as a count, not an exaggeration.", ""],
    ["My son often doesn't brush his teeth.", false,
      "&ldquo;Often&rdquo; carries an evaluation of frequency rather than reporting one.",
      "&ldquo;Twice this week my son didn't brush his teeth before going to bed.&rdquo;"],
    ["Luke told me I didn't look good in yellow.", true,
      "It reports what Luke said. The evaluation inside it is his, and it is marked as his.", ""],
    ["My aunt complains when I talk with her.", false,
      "&ldquo;Complains&rdquo; is a verb with an evaluative connotation baked in.",
      "&ldquo;My aunt called me three times this week, and each time talked about people who treated her in ways she didn't like.&rdquo;"]];
  let i=0, score=0, answered=false;
  const stmt=fig.querySelector('[data-stmt]'), v=fig.querySelector('[data-v]'),
        sc=fig.querySelector('[data-score]');
  function show(){
    answered=false;
    stmt.textContent='“'+Q[i][0]+'”';
    sc.textContent=`statement ${i+1} of ${Q.length}` + (i?` · ${score} right so far`:'');
    v.innerHTML='Observation, or evaluation?';
  }
  function answer(isObs){
    if(answered) return; answered=true;
    const right = isObs===Q[i][1];
    if(right) score++;
    v.innerHTML=`<span class="${right?'ok':'no'}">${right?'Yes':'No'} - this is an ${Q[i][1]?'observation':'evaluation'}.</span> ${Q[i][2]}`
      + (Q[i][3]?`<div style="margin-top:.5em"><span class="lbl">Rosenberg's rewrite</span>${Q[i][3]}</div>`:'');
    sc.textContent=`statement ${i+1} of ${Q.length} · ${score} right`;
  }
  fig.querySelectorAll('.ghost').forEach(b=>b.onclick=()=>{
    if(b.dataset.a==='obs') answer(true);
    else if(b.dataset.a==='ev') answer(false);
    else { i=(i+1)%Q.length; if(i===0) score=0; show(); }});
  show();
  return ()=>{};
};

SIMS.feeling = fig=>{
  const P=[
    ["I feel that you should know better.", false, "After <b>I feel</b> comes <b>that</b> - an opinion is arriving, not a feeling.", "Underneath, perhaps: irritated, or disappointed."],
    ["I feel like a failure.", false, "<b>I feel like</b> introduces a self-assessment.", "Underneath: &ldquo;I feel disappointed in myself.&rdquo;"],
    ["I feel misunderstood.", false, "This rates <i>their</i> level of understanding, not your state.", "Underneath: anxious, or annoyed."],
    ["I feel ignored.", false, "An interpretation of what others are doing.", "Underneath: relieved, if you wanted to be left alone - hurt, if you wanted to be involved."],
    ["I feel manipulated.", false, "On Rosenberg's list of words that describe how we think others are behaving toward us.", "Underneath: perhaps distrustful, or angry, or scared."],
    ["I feel inadequate as a guitar player.", false, "An assessment of your ability has replaced the emotion.", "Underneath: disappointed, impatient, or frustrated with yourself."],
    ["I feel it is useless.", false, "<b>I feel</b> followed by <b>it</b> - a thought.", "Underneath: discouraged, or hopeless."],
    ["I feel unimportant to the people I work with.", false, "This describes how you think others are evaluating you.", "Underneath: &ldquo;I feel sad,&rdquo; or &ldquo;I feel discouraged.&rdquo;"],
    ["I'm feeling irritated.", true, "A named emotion, owned, with nobody else inside the sentence.", ""],
    ["I feel anguished.", true, "A feeling - and note the word <b>feel</b> is doing no work; &ldquo;I'm anguished&rdquo; is the same.", ""],
    ["I feel good about that.", true, "Technically a feeling, but too vague to connect with.", "&ldquo;Good could mean happy, excited, relieved, or a number of other emotions.&rdquo;"]];
  const chips=fig.querySelector('[data-chips]'), v=fig.querySelector('[data-v]'), why=fig.querySelector('[data-why]');
  chips.innerHTML=P.map((p,i)=>`<button class="ghost" data-i="${i}">${p[0]}</button>`).join('');
  chips.querySelectorAll('.ghost').forEach(b=>b.onclick=()=>{
    nvcPick(fig,b,'[data-chips] .ghost');
    const p=P[+b.dataset.i];
    v.innerHTML=`<span class="${p[1]?'ok':'no'}">${p[1]?'A feeling.':'Not a feeling.'}</span> ${p[2]}`;
    why.innerHTML=p[3];});
  fig.querySelector('.ghost[data-a=reset]').onclick=()=>{
    nvcPick(fig,null,'[data-chips] .ghost');
    v.innerHTML='Tap a phrase above.'; why.innerHTML='';};
  return ()=>{};
};

SIMS.request = fig=>{
  const S=[
    {bad:"“I'd like you not to spend so much time at work.”",
     bc:[0,1,1,1],
     out:"Three weeks later he announced he had signed up for a golf tournament.",
     good:"“I would like you to spend at least one evening a week at home with the children and me.”",
     gc:[1,1,1,1],
     note:"He now knows exactly what would meet the need - and can say yes or no to it."},
    {bad:"“I want you to let me be me.”",
     bc:[1,0,0,1],
     out:"“I do!” - “No, you don't!” The argument had nowhere to land.",
     good:"“I want you to smile and say that anything I do is okay.”",
     gc:[1,1,0,0],
     note:"Concreteness cuts both ways. Said plainly, this one turns out to be a demand - which is exactly why Rosenberg wants it said plainly."},
    {bad:"“I want you to stop drinking.”",
     bc:[0,1,0,0],
     out:"A request to stop is a request for an absence - and it arrives as a verdict on the person.",
     good:"“Tell me what needs of yours are met by drinking, and discuss with me other ways of meeting those needs.”",
     gc:[1,1,1,1],
     note:"Doable today, and it goes at the need rather than the strategy."},
    {bad:"“I want you to be honest with me.”",
     bc:[1,0,0,1],
     out:"Honest about what? Vague enough that no answer can satisfy it, and none can be refused either.",
     good:"“Tell me how you feel about what I did, and what you'd like me to do differently.”",
     gc:[1,1,1,1],
     note:"Two named actions. Both can be done in the next five minutes."}];
  const LBL=["positive","concrete","doable now","a request, not a demand"];
  const stmt=fig.querySelector('[data-stmt]'), ck=fig.querySelector('[data-checks]'), v=fig.querySelector('[data-v]');
  let cur=null, fixed=false;
  function marks(a){ck.innerHTML=a.map((x,i)=>`<span class="${x?'ok':'no'}">${x?'✓':'✗'} ${LBL[i]}</span>`).join('');}
  function show(){
    const s=S[cur];
    stmt.innerHTML=fixed?s.good:s.bad;
    marks(fixed?s.gc:s.bc);
    v.innerHTML=fixed?s.note:s.out;
    fig.querySelector('.ghost[data-a=fix]').textContent = fixed?'← back to the original':'rewrite it →';
  }
  fig.querySelectorAll('.ghost[data-s]').forEach(b=>b.onclick=()=>{
    nvcPick(fig,b,'.ghost[data-s]'); cur=+b.dataset.s; fixed=false; show();});
  fig.querySelector('.ghost[data-a=fix]').onclick=()=>{ if(cur===null) return; fixed=!fixed; show();};
  fig.querySelector('.ghost[data-s="0"]').click();
  return ()=>{};
};

SIMS.translate = fig=>{
  const S=[
    {ctx:"A mosque at Dheisheh refugee camp, Bethlehem. About 170 men. Outside, spent tear-gas canisters marked Made in U.S.A.",
     line:"“Murderer!” - and a dozen voices join in. “Assassin!” “Child-killer!”",
     opts:[["“I'm not responsible for my government's policy.”","Defence. True, and it answers a question nobody asked. The shouting has more to say."],
       ["“Let's all calm down and discuss this civilly.”","A correction. It tells a man in pain that his pain is the problem."],
       ["“Are you angry because you would like my government to use its resources differently?”","Rosenberg's actual reply - a guess he had no way of knowing was right. The man talked for twenty more minutes. An hour later he invited Rosenberg home for Ramadan dinner."]]},
    {ctx:"Half an hour into a workshop.",
     line:"“You're the most arrogant speaker we've ever had!”",
     opts:[["Grovel, defend, explain.","Taking it personally. Rosenberg knows the sign: “a strong urge to either grovel, defend myself, or make excuses.”"],
       ["“You're being unfair - you've barely heard me out.”","Counterattack. Well-rehearsed, and it ends the exchange."],
       ["“Are you reacting to my not having said that the process can be difficult for me at times?”","Third guess, after two wrong ones. “That's right.” He then admitted the process is often a struggle for him too - and said what keeps him in it."]]},
    {ctx:"A husband, mid-argument.",
     line:"“What good does talking to you do? You never listen.”",
     opts:[["“I do listen - I listened yesterday.”","Now you are arguing about the evidence rather than hearing the person."],
       ["“You're unhappy with me because you feel I don't understand you?”","Closer, but this hears what he is <i>thinking about you</i>. “People are less threatening if you hear what they're needing rather than what they're thinking about you.”"],
       ["“Are you feeling unhappy because you are needing to be heard?”","The need, with nothing about you inside it. “I see what's going on for him without hearing that I had done anything wrong.”"]]},
    {ctx:"An elderly patient who has repeated one sentence for weeks. Staff have tried everything.",
     line:"“I want to die. I want to die.”",
     opts:[["“You don't mean that. You have so much to live for.”","Reassurance as correction. The chant continues, because nothing has been received."],
       ["“Why do you feel that way? When did this start?”","Interrogation - the most common response Rosenberg found among professionals, and one of the least useful."],
       ["“So you would like to die.”","She broke off, looked relieved, and began to talk. She had needed “connection with another human being who could hear her profound despair.” Afterwards she ate, and took her medicine."]]},
    {ctx:"A Toronto detox centre, 11 p.m. A man on drugs has thrown the night worker to the floor with a knife at her throat.",
     line:"“Don't lie to me! You do too have a room!”",
     opts:[["“I'm sorry, but there really are no rooms.”","Her mother's warning: “I could kill you when you answer <i>but</i> to everything I say!” Never put your <i>but</i> in the face of an angry person."],
       ["Say nothing and hope.","Silence here reads as refusal. Nothing in him has been met."],
       ["“It sounds like you're really angry and you want to be given a room.”","He answered: “I may be an addict, but by God, I deserve respect.” Thirty-five minutes of hearing the need behind each sentence. Then he put the knife away, and she helped him find a room."]]}];
  const ctx=fig.querySelector('[data-ctx]'), line=fig.querySelector('[data-line]'),
        opts=fig.querySelector('[data-opts]'), v=fig.querySelector('[data-v]');
  function load(i){
    const s=S[i];
    ctx.textContent=s.ctx; line.innerHTML=s.line; v.innerHTML='Choose a reply.';
    opts.innerHTML=s.opts.map((o,j)=>`<button class="ghost" data-o="${j}">${o[0]}</button>`).join('');
    opts.querySelectorAll('.ghost').forEach(b=>b.onclick=()=>{
      nvcPick(fig,b,'[data-opts] .ghost');
      const j=+b.dataset.o;
      v.innerHTML=`<span class="${j===2?'ok':'no'}">${j===2?'The empathic guess.':'A block.'}</span> ${s.opts[j][1]}`;});
  }
  fig.querySelectorAll('.ghost[data-s]').forEach(b=>b.onclick=()=>{
    nvcPick(fig,b,'.ghost[data-s]'); load(+b.dataset.s);});
  fig.querySelector('.ghost[data-s="0"]').click();
  return ()=>{};
};

SIMS.fourdoors = fig=>{
  const S=[
    {line:"“You're the most self-centred person I've ever met!”",
     doors:[
      ["blame yourself","“Oh, I should've been more sensitive!”","Guilt, shame, depression - and, in Rosenberg's words, “at great cost to our self-esteem.” You have accepted the other person's judgment as a verdict."],
      ["blame them","“You have no right to say that! You're the one who is really self-centred.”","Anger. This is the door where anger is manufactured - not by their sentence, but by the fault you find in return."],
      ["your feelings and needs","“When I hear you say that, I feel hurt, because I need some recognition of my efforts to be considerate of your preferences.”","The sentence becomes information about you. Nothing has been conceded and nothing has been thrown back."],
      ["their feelings and needs","“Are you feeling hurt because you need more consideration for your preferences?”","A connection. You have not agreed with them; you have found out what the sentence was for."]]},
    {line:"“Look, you just messed up again.” - your own voice, to you.",
     doors:[
      ["blame yourself","“What's wrong with you? You're always messing up.”","Shame, which Rosenberg calls a form of self-hatred. Even when it changes the behaviour, the change is not a free act."],
      ["blame them","“Well, they gave me no time and terrible instructions.”","Anger, and the mistake stays unexamined. The energy goes outward instead of into learning."],
      ["your feelings and needs","“What unmet need of mine is being expressed through this judgment?”","Sadness, frustration or disappointment instead of shame - feelings that “mobilize us to pursue and fulfill what we need,” rather than shutting us down."],
      ["their feelings and needs","“And what were they needing, in the part of this that was theirs?”","The same move, pointed outward - which is what makes repair possible rather than only regret."]]}];
  const line=fig.querySelector('[data-line]'), doors=fig.querySelector('[data-doors]'),
        say=fig.querySelector('[data-say]'), res=fig.querySelector('[data-res]');
  function load(i){
    const s=S[i]; line.innerHTML=s.line;
    say.textContent='Choose a door.'; res.innerHTML='';
    doors.innerHTML=s.doors.map((d,j)=>`<button class="ghost" data-d2="${j}">${j+1}. ${d[0]}</button>`).join('');
    doors.querySelectorAll('.ghost').forEach(b=>b.onclick=()=>{
      nvcPick(fig,b,'[data-doors] .ghost');
      const d=s.doors[+b.dataset.d2];
      say.innerHTML=d[1]; res.innerHTML=`<span class="lbl">where it lands</span>${d[2]}`;});
  }
  fig.querySelectorAll('.ghost[data-s]').forEach(b=>b.onclick=()=>{
    nvcPick(fig,b,'.ghost[data-s]'); load(+b.dataset.s);});
  load(0);
  return ()=>{};
};/* ============================================================
