function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
function setActive(fig, btn){
  fig.querySelectorAll('.ghost').forEach(b=>{ if(b.dataset.d!==undefined||b.dataset.m!==undefined) b.classList.remove('active');});
  if (btn) btn.classList.add('active');
}
function simHTML(kind){
  const caps = {
    wanting:"Two systems over repeated exposure. Gray is liking, amber is wanting. Pick a regime and watch whether they travel together.",
    treadmill:"An event at the marker. Amber is the charge, gray is the level. The charge always returns to zero; the level is up to you.",
    mediation:"Two spheres of possibility. Slide them apart and the same imitation becomes discipleship instead of rivalry. Supply is a red herring.",
    mix:"One desire, three contributions. Move the sliders so the needle stays put and the verdict changes — that is the whole diagnostic."
  };
  const ctl = {
    wanting:`<span class="cl">regime</span>
      <button class="ghost" data-m="A">ordinary pleasure</button>
      <button class="ghost active" data-m="B">sensitising cue</button>
      <button class="ghost" data-m="C">anhedonia</button>`,
    treadmill:`<span class="cl">adapts</span><input type="range" min="0" max="1" step="0.01" value="0.34">
      <button class="ghost" data-m="buy">new purchase</button>
      <button class="ghost active" data-m="lotto">lottery win</button>
      <button class="ghost" data-m="job">job loss</button>`,
    mediation:`<span class="cl">internal</span><input type="range" min="0" max="1" step="0.01" value="0.15"><span class="cl">external</span>
      <button class="ghost active" data-m="scarce">one of them</button>
      <button class="ghost" data-m="plenty">plenty to go round</button>`,
    mix:`<span class="cl">forecast</span><input type="range" min="0" max="100" step="1" value="55">
      <span class="cl">gap</span><input type="range" min="0" max="100" step="1" value="45">
      <span class="cl">model</span><input type="range" min="0" max="100" step="1" value="90">
      <button class="ghost" data-m="promo">promotion</button>
      <button class="ghost" data-m="feed">the feed</button>
      <button class="ghost" data-m="rest">restlessness</button>`
  };
  return `<figure class="frame" data-sim="${kind}">
    <canvas></canvas>
    <div class="controls">${ctl[kind]}</div>
    <figcaption>${caps[kind]}</figcaption>
  </figure>`;
}
/* Canvas backing store follows the device pixel ratio, so canvas text stays
   crisp in the ~570px reader column. Sims still draw in logical 700-wide units. */
const _DPR = Math.max(1, Math.min(2, (typeof devicePixelRatio === 'number' ? devicePixelRatio : 1) || 1));
function fitCanvas(cv, w, h){
  cv.width = Math.round(w*_DPR); cv.height = Math.round(h*_DPR);
  const ctx = cv.getContext('2d');
  if (ctx.setTransform) ctx.setTransform(_DPR,0,0,_DPR,0,0);
  return ctx;
}
const SIMS = {};

SIMS.wanting = fig=>{
  const cv=fig.querySelector('canvas');
    const ctx=fitCanvas(cv,700,390);
  const W=700,H=390,L=68,R=W-96,T=34,B=H-62;
  const C={
    A:{lk:x=>0.86*Math.exp(-1.9*x)+0.08, wt:x=>0.90*Math.exp(-2.1*x)+0.06,
       note:'ordinary pleasure — the two fade together, and nothing comes apart'},
    B:{lk:x=>0.62-0.10*x, wt:x=>0.22+0.72*(1-Math.exp(-3.2*x)),
       note:'sensitisation — wanting climbs straight past liking'},
    C:{lk:x=>0.70+0.02*Math.sin(6*x), wt:x=>0.74*Math.exp(-3.4*x)+0.04,
       note:'anhedonia — liking intact, wanting collapses'}
  };
  let mode='B', t=0, raf;
  const px=u=>L+u*(R-L), py=v=>B-Math.max(0,Math.min(1,v))*(B-T);
  function draw(){
    t=Math.min(1,t+0.006);
    ctx.fillStyle=SUNK; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle=BRD; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(L,T); ctx.lineTo(L,B); ctx.lineTo(R,B); ctx.stroke();
    ctx.fillStyle=FAINT; ctx.font='12px Inter, sans-serif';
    ctx.fillText('repeated exposure to the cue', L+4, B+34);
    ctx.save(); ctx.translate(20,(T+B)/2); ctx.rotate(-Math.PI/2);
    ctx.textAlign='center'; ctx.fillText('strength',0,0); ctx.restore();
    const c=C[mode];
    const line=(f,col,w)=>{ ctx.beginPath();
      for(let i=0;i<=240;i++){ const u=i/240*t; const X=px(u), Y=py(f(u));
        i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); }
      ctx.strokeStyle=col; ctx.lineWidth=w; ctx.stroke(); };
    line(c.lk,GRAY,2.2); line(c.wt,AMBER,2.9);
    const lk=Math.max(0,Math.min(1,c.lk(t))), wt=Math.max(0,Math.min(1,c.wt(t)));
    ctx.font='12.5px Inter, sans-serif';
    ctx.fillStyle=GRAY; ctx.beginPath(); ctx.arc(px(t),py(lk),4.5,0,7); ctx.fill();
    ctx.fillText('liking', px(t)+9, py(lk)+4);
    ctx.fillStyle=AMBER; ctx.beginPath(); ctx.arc(px(t),py(wt),4.5,0,7); ctx.fill();
    ctx.fillText('wanting', px(t)+9, py(wt)+4);
    ctx.fillStyle=INKC; ctx.font='13px Inter, sans-serif';
    ctx.fillText(c.note, L+4, T-12);
    ctx.fillStyle=GRAY; ctx.font='12.5px Inter, sans-serif';
    ctx.fillText('wanting '+wt.toFixed(2)+'   ·   liking '+lk.toFixed(2)+'   ·   gap '+(wt-lk).toFixed(2), L+4, B+52);
    raf=requestAnimationFrame(draw);
  }
  raf=requestAnimationFrame(draw);
  fig.querySelectorAll('.ghost').forEach(b=>b.onclick=()=>{
    setActive(fig,b); mode=b.dataset.m; t=0; });
  return ()=>cancelAnimationFrame(raf);
};

SIMS.treadmill = fig=>{
  const cv=fig.querySelector('canvas');
    const ctx=fitCanvas(cv,700,400);
  const W=700,H=400,L=62,R=W-116,T=36,B=H-64,EV=0.18;
  const sl=fig.querySelector('input[type=range]');
  const P={ buy:{a:1.00,g:0.85,l:'a new thing you bought — the level comes all the way back'},
            lotto:{a:0.34,g:0.52,l:'lottery, done properly — a small gain that does not decay (Lindqvist 2020)'},
            job:{a:0.14,g:-0.86,l:'job loss — little recovery, even after re-employment (Lucas 2004)'} };
  let adapt=0.34, gain=0.52, lab=P.lotto.l, t=0, raf;
  const px=u=>L+u*(R-L);
  const mid=(T+B)/2, amp=(B-T)/2*0.82;
  const py=v=>mid-Math.max(-1.15,Math.min(1.15,v))*amp;
  const level=u=>{ if(u<EV) return 0; const d=(u-EV)/(1-EV);
    return gain*(1-adapt*(1-Math.exp(-4.2*d))); };
  const charge=u=>{ if(u<EV) return 0; const d=(u-EV)/(1-EV);
    return gain*1.12*Math.exp(-7.0*d); };
  function draw(){
    t=Math.min(1,t+0.005);
    ctx.fillStyle=SUNK; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle=BRD; ctx.lineWidth=1; ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.moveTo(L,py(0)); ctx.lineTo(R,py(0)); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(L,T); ctx.lineTo(L,B); ctx.stroke();
    ctx.strokeStyle=FAINT; ctx.setLineDash([3,4]);
    ctx.beginPath(); ctx.moveTo(px(EV),T); ctx.lineTo(px(EV),B); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=FAINT; ctx.font='12px Inter, sans-serif';
    ctx.fillText('the event', px(EV)+6, T+12);
    ctx.fillText('baseline', L+4, py(0)-7);
    ctx.fillText('time', R-30, B+34);
    const line=(f,col,w)=>{ ctx.beginPath();
      for(let i=0;i<=260;i++){ const u=i/260*t; const X=px(u), Y=py(f(u));
        i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); }
      ctx.strokeStyle=col; ctx.lineWidth=w; ctx.stroke(); };
    line(charge,AMBER,2.6); line(level,GRAY,2.6);
    const lv=level(t), ch=charge(t);
    ctx.font='12.5px Inter, sans-serif';
    const sep=Math.abs(py(ch)-py(lv))<15?9:0;
    ctx.fillStyle=AMBER; ctx.beginPath(); ctx.arc(px(t),py(ch),4.5,0,7); ctx.fill();
    ctx.fillText('the charge', px(t)+9, py(ch)+4-sep);
    ctx.fillStyle=GRAY; ctx.beginPath(); ctx.arc(px(t),py(lv),4.5,0,7); ctx.fill();
    ctx.fillText('the level', px(t)+9, py(lv)+4+sep);
    ctx.fillStyle=INKC; ctx.font='13px Inter, sans-serif';
    ctx.fillText(lab, L+4, T-14);
    ctx.fillStyle=GRAY; ctx.font='12.5px Inter, sans-serif';
    ctx.fillText('charge '+ch.toFixed(2)+'   ·   level '+lv.toFixed(2)+'   ·   adapts '+Math.round(adapt*100)+'%', L+4, B+52);
    raf=requestAnimationFrame(draw);
  }
  raf=requestAnimationFrame(draw);
  if(sl) sl.oninput=()=>{ adapt=parseFloat(sl.value); lab='your own setting'; t=0; };
  fig.querySelectorAll('.ghost').forEach(b=>b.onclick=()=>{
    setActive(fig,b); const p=P[b.dataset.m];
    adapt=p.a; gain=p.g; lab=p.l; if(sl) sl.value=p.a; t=0; });
  return ()=>cancelAnimationFrame(raf);
};

SIMS.mediation = fig=>{
  const cv=fig.querySelector('canvas');
    const ctx=fitCanvas(cv,700,400);
  const W=700,H=400,L=42,R=W-42;
  const sl=fig.querySelector('input[type=range]');
  const BT=118, BB=250, OY=184;          // band top / bottom, object axis
  let dist=0.15, supply='scarce', ph=0, raf;
  function draw(){
    ph+=0.05;
    ctx.fillStyle=SUNK; ctx.fillRect(0,0,W,H);
    const span=R-L, rad=span*0.215;
    const myC=L+span*0.29, moC=myC+0.42*rad+2.35*rad*dist;
    const overlap=Math.max(0,Math.min(1,1-(moC-myC)/(2*rad)));
    const rel=-0.45;                      // where the object sits inside a sphere
    const moP=moC+rel*rad;                // the model's object
    const inMine=(moP-myC)<=rad;          // can you contest it at all?
    const myP=inMine?moP:myC+rel*rad;     // else you copy the form onto your own
    // spheres
    const band=(cx,col,al)=>{
      ctx.globalAlpha=al; ctx.fillStyle=col; ctx.fillRect(cx-rad,BT,rad*2,BB-BT);
      ctx.globalAlpha=0.5; ctx.strokeStyle=col; ctx.lineWidth=1.2;
      ctx.strokeRect(cx-rad,BT,rad*2,BB-BT); ctx.globalAlpha=1; };
    band(myC,AMBER,0.13); band(moC,GRAY,0.13);
    // the intersection
    const ia=Math.max(myC-rad,moC-rad), ib=Math.min(myC+rad,moC+rad);
    if(ib>ia){
      ctx.globalAlpha=0.14; ctx.fillStyle=INKC; ctx.fillRect(ia,BT,ib-ia,BB-BT); ctx.globalAlpha=1;
      ctx.strokeStyle=INKC; ctx.globalAlpha=0.35; ctx.setLineDash([4,4]);
      ctx.strokeRect(ia,BT,ib-ia,BB-BT); ctx.setLineDash([]); ctx.globalAlpha=1;
      if(ib-ia>110){ ctx.fillStyle=INKC; ctx.font='12px Inter, sans-serif'; ctx.textAlign='center';
        ctx.fillText('contestable by both',(ia+ib)/2,BB-12); ctx.textAlign='left'; }
    }
    ctx.font='12.5px Inter, sans-serif'; ctx.textAlign='center';
    ctx.fillStyle=GRAY;  ctx.fillText('the model — their sphere of possibility',moC,BT-46);
    ctx.fillStyle=AMBER; ctx.fillText('you — your sphere of possibility',myC,BB+40);
    ctx.textAlign='left';
    // agents reaching for objects
    ctx.strokeStyle=GRAY; ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.moveTo(moC,BT-30); ctx.lineTo(moP,OY-13); ctx.stroke();
    ctx.fillStyle=GRAY; ctx.beginPath(); ctx.arc(moC,BT-34,6,0,7); ctx.fill();
    ctx.strokeStyle=AMBER; ctx.lineWidth=2.2;
    ctx.beginPath(); ctx.moveTo(myC,BB+24); ctx.lineTo(myP,OY+13); ctx.stroke();
    ctx.fillStyle=AMBER; ctx.beginPath(); ctx.arc(myC,BB+28,6,0,7); ctx.fill();
    // spare supply
    if(supply==='plenty'){
      ctx.fillStyle=FAINT;
      for(let i=0;i<8;i++){ const x=L+span*(0.05+i*0.129);
        if(Math.abs(x-moP)<14||Math.abs(x-myP)<14) continue;
        ctx.beginPath(); ctx.arc(x,OY,5,0,7); ctx.fill(); }
    }
    // objects
    ctx.fillStyle=INKC; ctx.beginPath(); ctx.arc(moP,OY,8,0,7); ctx.fill();
    if(!inMine){ ctx.strokeStyle=AMBER; ctx.lineWidth=2.4;
      ctx.beginPath(); ctx.arc(myP,OY,8,0,7); ctx.stroke(); }
    let verdict,rival;
    if(inMine){ rival=overlap;
      ctx.strokeStyle=AMBER; ctx.globalAlpha=0.8; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(moP,OY,15+4*Math.sin(ph),0,7); ctx.stroke(); ctx.globalAlpha=1;
      verdict='internal mediation — you landed on their object; the model is now an obstacle';
    } else { rival=0;
      verdict='external mediation — you copied the desire onto your own object; discipleship, no rivalry'; }
    ctx.fillStyle=INKC; ctx.font='600 13.5px Inter, sans-serif';
    ctx.fillText(verdict,L,34);
    // rivalry meter
    const bx=L,by=316,bw=span*0.44,bh=10;
    ctx.globalAlpha=0.3; ctx.fillStyle=FAINT; ctx.fillRect(bx,by,bw,bh); ctx.globalAlpha=1;
    ctx.fillStyle=AMBER; ctx.fillRect(bx,by,bw*rival,bh);
    ctx.fillStyle=GRAY; ctx.font='12.5px Inter, sans-serif';
    ctx.fillText('rivalry',bx,by-7);
    ctx.fillText('overlap '+Math.round(overlap*100)+'%   ·   supply '+(supply==='plenty'?'plentiful':'a single one')+
      '   ·   rivalry '+Math.round(rival*100)+'%',bx,by+30);
    ctx.fillStyle=FAINT; ctx.font='12px Inter, sans-serif';
    ctx.fillText('add supply: nothing moves.',bx+bw+22,by+2);
    ctx.fillText('move the spheres: everything moves.',bx+bw+22,by+18);
    raf=requestAnimationFrame(draw);
  }
  raf=requestAnimationFrame(draw);
  if(sl) sl.oninput=()=>{ dist=parseFloat(sl.value); };
  fig.querySelectorAll('.ghost').forEach(b=>b.onclick=()=>{
    setActive(fig,b); supply=b.dataset.m; });
  return ()=>cancelAnimationFrame(raf);
};

    else { ctx.fillStyle=INKC; ctx.fillText(String(felt), L+bw*felt/100+12, 73); }
    ctx.fillStyle=FAINT; ctx.font='12.5px Inter, sans-serif';
    ctx.fillText('what it is made of', L, 126);
    const parts=[['forecast',f,GRAY],['gap',g,FAINT],['model',m,AMBER]];
    let x=L;
    parts.forEach(p=>{ const w=bw*p[1]/tot, pale=p[2]===FAINT;
      ctx.fillStyle=p[2]; ctx.globalAlpha=pale?0.55:1; ctx.fillRect(x,138,Math.max(0,w-2),30);
      ctx.globalAlpha=1;
      if(w>62){ ctx.fillStyle=pale?INKC:SUNK; ctx.font='12.5px Inter, sans-serif';
        ctx.fillText(p[0]+' '+Math.round(p[1]/tot*100)+'%', x+8, 158); }
      x+=w; });
    const rank=parts.slice().sort((a,b)=>b[1]-a[1]);
    const lead=rank[0], second=rank[1];
    const mixed=(lead[1]-second[1])/tot<0.10;
    const V={ forecast:['sensitised forecast','change the cue environment — remove the trigger, not the temptation','resolve. the signal is generated upstream of any decision you make'],
              gap:['structural gap','retarget from arrival to the quality of the striving','a better object. there is not one, and that is the finding'],
              model:['borrowed vector','change your models, or increase mediation distance','willpower. you cannot out-discipline a desire that is not yours'] };
    const a=V[lead[0]];
    ctx.fillStyle=FAINT; ctx.font='12.5px Inter, sans-serif';
    ctx.fillText('the read', L, 214);
    ctx.fillStyle=INKC; ctx.font='600 16px Inter, sans-serif';
    ctx.fillText(mixed?(a[0]+', shading into '+V[second[0]][0]):a[0], L, 240);
    ctx.font='13.5px Inter, sans-serif'; ctx.fillStyle=INKC;
    ctx.fillText('what works:  '+a[1], L, 274);
    ctx.fillStyle=GRAY;
    ctx.fillText('what fails:  '+a[2], L, 300);
    if(mixed){ ctx.fillStyle=FAINT; ctx.font='12.5px Inter, sans-serif';
      ctx.fillText('two layers within ten points — treat it as a mixture and pull both levers.', L, 328); }
    ctx.fillStyle=FAINT; ctx.font='12px Inter, sans-serif';
    ctx.fillText('hold the needle steady and change the composition: the verdict moves, the feeling does not.', L, 366);
    raf=requestAnimationFrame(draw);
  }
  raf=requestAnimationFrame(draw);
  fig.querySelectorAll('.ghost').forEach(b=>b.onclick=()=>{
    setActive(fig,b); const p=P[b.dataset.m];
    rs.forEach((r,i)=>{ r.value=p[i]; }); });
  return ()=>cancelAnimationFrame(raf);
};
