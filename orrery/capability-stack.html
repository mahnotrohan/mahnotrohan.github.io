<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
/* Theme is shared with the main site: same origin, same localStorage key. */
(function(){try{var t=localStorage.getItem('theme');
if(!t)t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t);}
catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<title>The Capability Stack - Orrery</title>
<style>
:root{
  /* site parity: --ground/--surface-* mirror the main site's --bg/--bg-2/--chip */
  --ground:#fbf8f3; --surface-sunk:#f2ede4; --surface-raised:#fdfcf9;
  --border:#e3dccf; --border-strong:#d2c8b5;
  --ink:#211f1c; --ink-strong:#14120f; --ink-muted:#5c5751; --ink-faint:#8c867f;
  --accent:#8f6220; --accent-dim:#c2a47c; --accent-wash:rgba(143,98,32,0.08);
  --accent-rgb:143,98,32;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --r:4px; --reader-w:min(760px, 58vw); --move-fast:150ms ease;
  --ink-body:#2b2823; --ink-soft:#332f29;
  --hdr-fade:linear-gradient(180deg, rgba(251,248,243,.96), rgba(251,248,243,.75), transparent);
  --vp-bg:radial-gradient(ellipse at 50% 40%, #fdfbf7 0%, #fbf8f3 55%, #f2ede4 100%);
  --btn-bg:rgba(253,252,249,.92);
  --line-soft:rgba(33,31,28,0.10); --line-flow:rgba(143,98,32,0.45);
  --sim-ink:#3a352e; --sim-gray:#8c867f; --sim-faint:#b3ac9f;
  --sim-amber:#8f6220; --sim-sunk:#f2ede4; --sim-brd:#ddd4c3;
  --grid-1:rgba(110,95,65,.13); --grid-2:rgba(110,95,65,.07);
  --shadow:rgba(90,75,50,.16);
}

/* Night sky, sharing the main site's dark surfaces exactly. */
html[data-theme="dark"]{
  --ground:#1a1a1a; --surface-sunk:#232322; --surface-raised:#262523;
  --border:#2e2e2e; --border-strong:#3e3e3b;
  --ink:#e8e6e3; --ink-strong:#f5f3f0; --ink-muted:#a5a09a; --ink-faint:#7d7873;
  --accent:#d9a25e; --accent-dim:#8b6c41; --accent-wash:rgba(217,162,94,0.10);
  --accent-rgb:217,162,94;
  --ink-body:#dddad5; --ink-soft:#d3cfc9;
  --hdr-fade:linear-gradient(180deg, rgba(26,26,26,.96), rgba(26,26,26,.75), transparent);
  --vp-bg:radial-gradient(ellipse at 50% 40%, #202020 0%, #1a1a1a 55%, #141414 100%);
  --btn-bg:rgba(38,37,35,.92);
  --line-soft:rgba(232,230,227,0.10); --line-flow:rgba(217,162,94,0.45);
  --sim-ink:#e8e6e3; --sim-gray:#9d988f; --sim-faint:#6b6660;
  --sim-amber:#d9a25e; --sim-sunk:#232322; --sim-brd:#393936;
  --grid-1:rgba(210,203,190,.09); --grid-2:rgba(210,203,190,.045);
  --shadow:rgba(0,0,0,.5);
}
html{color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%; overflow:hidden; background:var(--ground); color:var(--ink);
  font-family:var(--font); font-size:15.5px; line-height:1.75; overscroll-behavior:none;}
h1,h2,h3{color:var(--ink-strong); font-weight:600; line-height:1.3;}
.kicker{font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-muted); font-weight:500;}

/* header - all navigation lives top right */
#hdr{position:fixed; top:0; left:0; right:0; z-index:40; height:56px;
  display:flex; align-items:center; gap:1.1rem; padding:0 1.4rem;
  background:var(--hdr-fade);
  pointer-events:none; transition:right .3s cubic-bezier(.25,.7,.3,1);}
body.reader-open #hdr{right:var(--reader-w);}
#hdr>*{pointer-events:auto;}
#hdr .t{font-size:15px; font-weight:600; color:var(--ink-strong);}
#hdr .sub{font-size:11.5px; color:var(--ink-muted);}
#hdr .spacer{flex:1;}
#count{font-size:12px; color:var(--ink-faint); white-space:nowrap;}
.hbtn{background:var(--btn-bg); border:1px solid var(--border-strong); color:var(--ink-muted);
  font-family:var(--font); font-size:12.5px; padding:6px 13px; border-radius:var(--r); cursor:pointer;
  transition:all var(--move-fast); white-space:nowrap;}
.hbtn:hover{color:var(--ink); border-color:var(--ink-muted);}
.hbtn:disabled{opacity:.35; cursor:default;}
#navcluster{display:flex; align-items:center; gap:2px; opacity:0; pointer-events:none;
  transition:opacity .2s ease;}
#navcluster.on{opacity:1; pointer-events:auto;}
#navcluster .hbtn{background:none; border:none; font-size:19px; font-weight:300;
  color:var(--ink-faint); padding:1px 8px; line-height:1.2; border-radius:5px;}
#navcluster .hbtn:hover{color:var(--ink); background:var(--accent-wash);}
#navcluster .hbtn:disabled{opacity:.28; background:none;}

/* viewport & sky */
#vp{position:fixed; inset:0; cursor:grab; touch-action:none;
  background:var(--vp-bg);}
#vp.dragging{cursor:grabbing;}
#vp.dragging, #vp.dragging *{user-select:none;}
#world{position:absolute; top:0; left:0; width:2750px; height:1750px;
  transform-origin:0 0; will-change:transform;}
#world::before{content:''; position:absolute; inset:0; pointer-events:none;
  background-image:radial-gradient(circle, var(--grid-1) 1.2px, transparent 1.2px),
                   radial-gradient(circle, var(--grid-2) 1px, transparent 1px);
  background-size:380px 380px, 150px 150px;
  background-position:0 0, 70px 100px; opacity:.8;}

/* constellation names */
.tlab{position:absolute; pointer-events:auto; cursor:pointer; user-select:none; text-align:center;}
.tlab .big{font-size:40px; font-weight:500; letter-spacing:.5em; line-height:1.3;
  text-transform:uppercase; white-space:nowrap;}
.tlab .sum{text-shadow:0 0 5px var(--ground),0 0 5px var(--ground),0 0 3px var(--ground);
  font-size:19px; color:var(--ink-muted); margin-top:.5em; letter-spacing:.18em; text-transform:uppercase;}
.tlab:hover .big{filter:brightness(1.35);}

/* stars */
.mk{position:absolute; cursor:pointer; user-select:none;
  display:flex; gap:14px; width:330px; align-items:flex-start;}
.mk .dot{border-radius:50%; flex-shrink:0;
  transition:transform .2s ease, box-shadow .4s ease, opacity .4s ease, background .4s ease;}
.mk:hover .dot{transform:scale(1.3);}
.mk .dtext{min-width:0; padding-top:1px;}
.mk .lbl{text-shadow:0 0 5px var(--ground),0 0 5px var(--ground),0 0 3px var(--ground),0 0 3px var(--ground);
  font-size:19px; color:var(--ink); font-weight:500; line-height:1.3;}
.mk .lbl .seq{font-size:12px; color:var(--ink-faint); font-weight:400; margin-right:.5em;}
.mk .ess{text-shadow:0 0 5px var(--ground),0 0 5px var(--ground),0 0 3px var(--ground),0 0 3px var(--ground);
  font-size:14px; color:var(--ink-muted); line-height:1.45; margin-top:4px; max-width:290px;
  opacity:0; transition:opacity .3s ease;}
.mk.showess .ess{opacity:1;}
.mk .sims-badge{font-size:12px; color:var(--accent-dim); margin-top:3px; display:none;}
.mk.hasim .sims-badge{display:block;}
.mk.focused .dot{transform:scale(1.35);}
.mk.focused .lbl{color:var(--ink-strong);}
.mk.neighbor .lbl{color:var(--ink-strong);}
.mk.dimmed{opacity:.35;}

/* connection overlay - few, directional, labeled plainly */
#tsvg, #astsvg, #flowsvg{position:absolute; top:0; left:0; pointer-events:none; overflow:visible;}
@keyframes dashdrift{to{stroke-dashoffset:-64;}}
.tline{animation:dashdrift 6s linear infinite;}
.tlabel{position:absolute; transform:translate(-50%,-50%); background:var(--ground);
  border:1px solid var(--accent-dim); color:var(--accent); border-radius:12px;
  font-size:12px; letter-spacing:.06em; padding:2px 11px; white-space:nowrap; cursor:pointer;
  pointer-events:auto; transition:background var(--move-fast); text-transform:uppercase;}
.tlabel:hover{background:var(--accent-wash);}

/* ---------- READER ---------- */
#reader{position:fixed; top:0; right:calc(-1 * var(--reader-w) - 20px); width:var(--reader-w);
  height:100%; z-index:45; background:var(--surface-raised);
  border-left:1px solid var(--border); display:flex; flex-direction:column;
  transition:right .3s cubic-bezier(.25,.7,.3,1);
  box-shadow:-24px 0 70px var(--shadow);}
#reader.open{right:0;}
#reader .top{padding:1.5em 2.2em 1em; border-bottom:1px solid var(--border); position:relative;}
#reader .rtools{position:absolute; top:13px; right:15px; display:flex; align-items:center; gap:9px;}
#reader .top .typechip{max-width:calc(100% - 108px);}
#reader .close{background:none; border:none; padding:0 2px; line-height:1;
  color:var(--ink-faint); font-size:17px; cursor:pointer;}
#reader .close:hover{color:var(--ink);}
#reader h2{font-size:24px; margin:.45em 0 .3em;}
#reader .terrline{font-size:11.5px; color:var(--ink-faint); margin-top:2px;}
#rbody{flex:1; overflow-y:auto; padding:1.6em 2.2em 2.5em;}
#rbody::-webkit-scrollbar{width:6px;}
#rbody::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:3px;}
#rbody>*{max-width:66ch;}
/* block-level children span the column; the reader width holds the measure */
#rbody>.ideablock, #rbody>.linkrow{max-width:none;}
.hook{font-size:18.5px; color:var(--ink-strong); line-height:1.65;
  padding-left:1em; border-left:2px solid var(--accent-dim); margin-bottom:1.1em;}
.story{font-size:15.5px; color:var(--ink-body); margin-top:.9em;}
/* the idea block — the idea / how it works / failure mode / description */
.ideablock{border:1px solid var(--border); border-radius:10px;
  background:var(--surface-sunk); overflow:hidden;}
.ideablock .ib{padding:1.15em 1.35em; border-top:1px solid var(--border);}
.ideablock .ib:first-child{border-top:none;}
.ideablock .kicker{display:block; margin-bottom:.45em; color:var(--accent);}
.ideablock .term{color:var(--ink-strong); font-weight:600; font-size:17px; display:block;}
.ideablock .def{font-size:14.5px; color:var(--ink-soft); margin-top:.25em;}
.ideablock .txt{font-size:15px; color:var(--ink-body);}
.ideablock .hook{margin-bottom:0;}
.ideablock figure.frame{background:var(--surface-raised);}
.typechip{display:inline-block; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-muted); border:1px solid var(--border-strong); border-radius:3px; padding:1px 8px;}
details.fold{margin:1.2em 0 0; border:1px solid var(--border); border-radius:var(--r); background:var(--surface-sunk);}
details.fold summary{cursor:pointer; padding:.6em 1.05em; color:var(--ink-muted);
  font-size:13px; list-style:none; user-select:none;}
details.fold summary::-webkit-details-marker{display:none;}
details.fold summary::before{content:'+  '; color:var(--accent); font-weight:500;}
details.fold[open] summary::before{content:'−  ';}
details.fold summary:hover{color:var(--ink);}
details.fold .inner{padding:0 1.05em .9em; font-size:14.5px; color:var(--ink-soft);}
.named{margin-top:1.5em; background:var(--surface-sunk); border:1px solid var(--border);
  border-radius:8px; padding:1em 1.3em;}
.named .kicker{display:block; margin-bottom:.35em;}
.named b{color:var(--ink-strong); font-weight:600; font-size:16px;}
.named .def{font-size:14.5px; color:var(--ink-soft); margin-top:.2em;}
.sowhat{margin-top:1.4em; font-size:15px; color:var(--ink-body);}
.sowhat .kicker{display:block; margin-bottom:.3em;}
.closure{margin-top:1.5em; border:1px solid var(--accent-dim); border-radius:8px;
  background:var(--accent-wash); padding:1em 1.3em;}
.closure .kicker{color:var(--accent); display:block; margin-bottom:.3em;}
.closure .txt{font-size:14.5px; color:var(--ink-body); line-height:1.65;}
.linkrow{margin-top:1.6em; border-top:1px solid var(--border); padding-top:1em;
  display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:.6em 2em;}
.lgroup .kicker{display:block; margin-bottom:.25em;}
.lgroup a{display:block; font-size:14px; padding:.2em 0 .45em; color:var(--ink-soft); cursor:pointer; text-decoration:none;}
.lgroup .kicker .ar{font-size:19px; line-height:1; color:var(--accent); letter-spacing:0;}
.lgroup a .t{border-bottom:1px dotted transparent; transition:border-color var(--move-fast); color:var(--ink);}
.lgroup a:hover .t{border-bottom-color:var(--accent);}
.lgroup a .why{display:block; font-size:12px; color:var(--ink-faint); line-height:1.5;}
.nextbtn{margin-top:1.8em; width:100%; max-width:66ch; text-align:left;
  background:var(--surface-sunk); border:1px solid var(--border-strong); border-radius:8px;
  color:var(--ink); font-family:var(--font); font-size:14.5px; padding:.9em 1.3em; cursor:pointer;
  transition:all var(--move-fast);}
.nextbtn:hover{border-color:var(--accent-dim); background:var(--accent-wash);}
.nextbtn .k{color:var(--ink-faint); font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  display:block; margin-bottom:.15em;}
.nextbtn .arr{color:var(--accent); float:right;}

/* sim figure */
figure.frame{background:var(--surface-sunk); border:1px solid var(--border); border-radius:var(--r);
  margin:1.3em 0 0; overflow:hidden;}
figure.frame canvas{width:100%; display:block;}
figure.frame .controls{display:flex; gap:8px; padding:8px 12px; border-top:1px solid var(--border);
  align-items:center; flex-wrap:wrap;}
figure.frame .controls .cl{font-size:11.5px; color:var(--ink-faint);}
figure.frame figcaption{padding:7px 13px 10px; font-size:12.5px; color:var(--ink-muted); line-height:1.55;}
.ghost{background:none; border:1px solid var(--border-strong); color:var(--ink-muted);
  font-family:var(--font); font-size:12px; padding:3px 11px; border-radius:var(--r); cursor:pointer;
  transition:all var(--move-fast);}
.ghost:hover{color:var(--ink); border-color:var(--ink-muted);}
.ghost.active{color:var(--accent); border-color:var(--accent-dim); background:var(--accent-wash);}
figure.frame input[type=range]{flex:1; min-width:100px; accent-color:var(--accent);}

@media(max-width:760px){ :root{--reader-w:100vw;} }

/* ---- site exits (present on every chart) ---- */
#hdr .sub a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
#hdr .sub a:hover{border-bottom-color:var(--accent)}
#hdr .sub s{text-decoration:none;color:var(--ink-faint);opacity:.75;margin:0 4px}

/* ---- reader footer: step nav lives bottom-right, inside the panel ---- */
#rfoot{display:flex;align-items:center;justify-content:flex-end;gap:.75rem;
  padding:.5rem 2.2em .6rem;border-top:1px solid var(--border);
  background:var(--surface-raised);flex:none;border-top-color:transparent}
#rfoot:has(#navcluster.on){border-top-color:var(--border)}
#reader #navcluster{background:var(--surface-sunk);border:1px solid var(--border-strong);
  border-radius:7px;padding:1px 2px}
/* Forward affordance sits on the right edge, where the thumb already is.
   Needs #rbody> to beat the (1,0,0) of `#rbody > *`. */
#rbody>.nextbtn{width:auto;min-width:min(100%,24ch);max-width:min(100%,44ch);
  margin-left:auto;margin-right:0;display:block}
@media (max-width:700px){
  #rfoot{padding:.45rem 1.2em .55rem}
  #rbody>.nextbtn{max-width:100%}
}

/* ---- theming: lines, marker, toggle ---- */
.lnk-base{stroke:var(--line-soft)}
.lnk-flow{stroke:var(--line-flow)}
#tsvg marker path{fill:var(--accent)}
/* band hues are mid-tone and kept in both themes; lift them on dark ground */
html[data-theme="dark"] #tsvg line,
html[data-theme="dark"] #astsvg line{stroke-opacity:.55}
#themeBtn{font-size:14px;line-height:1;padding:5px 11px}
</style>
</head>
<body>

<div id="hdr">
  <div>
    <div class="t">Capability</div>
    <div class="sub"><a href="/">Rohan's space</a><s>/</s><a href="/orrery">Orrery</a></div>
  </div>
  <div class="spacer"></div>
  <button class="hbtn" id="themeBtn" type="button" title="Light / dark" aria-label="Toggle light or dark">◐</button>
  <button class="hbtn" id="overviewBtn">Overview&nbsp;·&nbsp;Esc</button>
</div>

<div id="vp"><div id="world"></div></div>

<div id="reader">
  <div class="top">
    <div class="rtools">
      <div id="navcluster">
        <button class="hbtn" id="navPrev" title="previous idea">‹</button>
        <button class="hbtn" id="navNext" title="next idea">›</button>
      </div>
      <button class="close" id="rClose" title="close">✕</button>
    </div>
    <span class="typechip" id="rChip"></span>
    <h2 id="rTitle"></h2>
    <div class="terrline" id="rTerr"></div>
  </div>
  <div id="rbody"></div>
</div>

<script>
'use strict';

let INKC, GRAY, FAINT, AMBER, SUNK, BRD;
let RGB_INK, RGB_GRAY, RGB_FAINT, RGB_AMBER;
/* Canvas takes no var(), so pull the resolved values and refresh on theme flip.
   Animated sims pick these up on their next frame; static ones are remounted. */
function syncSimColours(){
  const cs = getComputedStyle(document.documentElement);
  const v = n => cs.getPropertyValue(n).trim();
  const trip = h => { h = h.replace('#','').trim();
    if (h.length === 3) h = h.split('').map(c=>c+c).join('');
    return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)).join(','); };
  INKC=v('--sim-ink'); GRAY=v('--sim-gray'); FAINT=v('--sim-faint');
  AMBER=v('--sim-amber'); SUNK=v('--sim-sunk'); BRD=v('--sim-brd');
  RGB_INK=trip(INKC); RGB_GRAY=trip(GRAY); RGB_FAINT=trip(FAINT); RGB_AMBER=trip(AMBER);
}
syncSimColours();

/* ============================================================
   CONTENT v2 - the reader shows one block per idea, definition-first:
   the idea (term+def) → how it works (mech) → failure mode (sowhat) →
   description (hook → story → sim).
   Connections: ≤4 per idea, as arrows — ← builds on, → leads to, ▶ see it live.
   ============================================================ */
const N = {

a1:{type:"axiom", title:"These are skills, not traits", x:1259, y:512,
  ess:"The parts that feel like personality are the trainable ones.",
  hook:"Which of your weaknesses have you quietly filed under “that is just who I am”?",
  story:"Whatever is on that list has stopped being examined. The framework's claim about the very bottom of the stack is that it does not belong there. Of emotional regulation: “It’s trainable, not a fixed trait — and it sits upstream of all the thinking.” The same goes for the two capabilities that feel most like temperament, taste and communication.",
  mech:"A map of capabilities is only worth drawing if its entries move. If regulation, follow-through, taste and empathy were fixed endowments, the honest advice would be to find work that suits your endowment and stop reading. The framework says the opposite, and says it about exactly the zones that feel least movable — the “feels-like-personality-not-skill” zones. “These feel fixed but aren't.”",
  term:"Trainable capability", def:"a capacity that responds to deliberate practice, however innate it feels from the inside.",
  sowhat:"Filing a capability under identity ends the inquiry. You stop looking for the practice, and the weakness becomes permanent by assumption rather than by nature.",
  explain:"why the whole map is pointless unless the things on it can actually change.",
  builds:[], leads:[["b1-sensitive","the capability that feels most like temperament"],["b4-danger","the zones this axiom is aimed at"]], live:[]},

a2:{type:"axiom", title:"Lower layers gate higher ones", x:1057, y:627,
  ess:"A weakness low down caps everything above it, however strong that is.",
  hook:"If your judgment is excellent and you cannot act on it, what is your judgment worth?",
  story:"Nothing yet. That is the structural claim the whole map rests on: “Lower layers gate the ones above them: a weakness low down caps everything higher, no matter how strong it is.” The layers are not three equal thirds of a pie. They are stacked, and the bottom one sets the ceiling.",
  mech:"Gating is a different arithmetic from adding. If capabilities summed, a large surplus anywhere would offset a deficit elsewhere, and the stack would not matter. Because they gate, the binding constraint is whichever layer is lowest — so the same improvement is worth different amounts depending on where you apply it.",
  term:"Gating", def:"a lower capability sets a ceiling on how much a higher one can be worth.",
  sowhat:"Invest in the layer you enjoy rather than the one that binds, and the return is close to zero. You get better at something that was never the constraint.",
  explain:"the one structural idea that makes this a stack rather than a list.",
  builds:[], leads:[["b1-laplace","what sits at the bottom"],["b4-principle","the whole practical consequence"]], live:[["b1-pendulum","see the cap bind"]]},

a3:{type:"axiom", title:"A lens, not a map of the mind", x:1462, y:627,
  ess:"The categories bleed. Their value is diagnostic, not taxonomic.",
  hook:"Is empathy a separate capability, or is it perception aimed at people?",
  story:"Both, and the framework says so rather than pretending otherwise: “These categories bleed into each other (empathy is a kind of perception; taste is compressed knowledge).” The instruction that follows is the important one — “Treat this as a lens, not a literal map of the mind.”",
  mech:"The boundaries are drawn where they are useful, not where they are real. Empathy is filed under Direction because relationships are where it pays, though mechanically it is perception. Taste is filed there too, though it is knowledge that has been compressed to the point of feeling like instinct. Any argument about which box something truly belongs in has left the purpose behind.",
  term:"Lens", def:"a set of distinctions kept because they help you find a bottleneck, not because they carve the mind at its joints.",
  sowhat:"Treated as a taxonomy, the map invites debates about classification and rewards none of them. The question it can answer is where you are weakest.",
  explain:"why the overlaps between these categories are a feature rather than a flaw.",
  builds:[], leads:[["b3-contingency","empathy, filed where it pays"],["b4-domains","the same lens, different weights"]], live:[]},

a4:{type:"axiom", title:"Outcomes are not capability", x:1259, y:771,
  ess:"Luck and timing shape results. This map is only the trainable slice.",
  hook:"Two people run the same play with the same skill and one of them wins. What was the difference?",
  story:"Often nothing either of them controlled. The framework puts this caveat on the map rather than in a footnote: “Outcomes are also shaped by luck and timing — things no skill controls. This map is the slice you can actually train, not the whole of how a life turns out.”",
  mech:"Capability and outcome are different variables, and the second is a noisy function of the first. That has two consequences. Reading your capability off your results is unreliable in both directions — a good run flatters a weakness, a bad one indicts a strength. And a map of trainable capability is not a theory of a good life; the framework is explicit that some of the best parts arrive by other means entirely.",
  term:"The trainable slice", def:"the portion of an outcome that responds to skill, as against luck, timing and circumstance.",
  sowhat:"Score yourself on outcomes and you will train the wrong things — chasing whatever happened to work and abandoning whatever happened not to.",
  explain:"why a capability map has to state, out loud, what it does not cover.",
  builds:[], leads:[["b4-coinflip","how wide the spread can be"],["b4-ergodicity","what does not arrive by decision"]], live:[["b4-coinflip","see the spread"]]},

"b1-laplace":{type:"story · phenomenon", title:"The floor", x:404, y:355,
  ess:"When the bottom cracks, nothing above it works.",
  hook:"Think of the last time you performed far below your own standard. Was it because you did not know enough?",
  story:"Almost certainly not. You knew what to do and could not deploy it — because you were exhausted, or frightened, or defending something. The framework's word for this layer is deliberately unglamorous: “This is the floor. When it cracks, nothing above it works.” The question it answers is the most basic one on the map — “Can I function and act at all?”",
  mech:"Everything above the foundation is conditional on it. Knowledge is retrievable only if you can retrieve it; perception narrows under threat; a decision you cannot execute is a thought. The floor does not make you good at anything. It determines whether your existing goodness is available to you at the moment you need it.",
  term:"The floor", def:"the two capabilities that determine whether any of your others can be brought to bear.",
  sowhat:"Diagnosing a bad performance as a knowledge gap sends you to read more, when the failure was that nothing you already knew was reachable.",
  explain:"why the least sophisticated layer is the one that decides what the others are worth.",
  builds:[["a2","the stack has to start somewhere"]], leads:[["b1-sensitive","the first of the two"],["b1-lorenz-story","the second"]], live:[["b1-pendulum","see the cap bind"]]},

"b1-pendulum":{type:"simulation", title:"Where a 20% gain goes furthest", sim:"gating", x:884, y:309,
  ess:"The same improvement, applied at different heights, is worth different amounts.",
  hook:"You have one unit of improvement to spend. Spend it on your strongest layer or your weakest — does it matter which?",
  story:"It matters enormously, and the direction is counter-intuitive for anyone who enjoys the top of the stack. The framework states it flatly: “Highest leverage is usually lowest in the stack.” Move the three levers below and watch which one the output is actually waiting on.",
  mech:"Because lower layers gate higher ones, the output tracks whichever layer is lowest. Improve a layer that is not binding and almost nothing happens; improve the one that is, and everything above it is released at once. The framework's example: “A 20% gain in emotional regulation or follow-through unlocks more than a 20% gain in knowledge, because the foundation gates everything above it.”",
  term:"Leverage", def:"the return on improving one capability, which depends on whether it is the binding one.",
  sowhat:"Effort spent on a non-binding layer feels productive and changes nothing. It is the most common way to work hard on a capability map and get no return from it.",
  explain:"why the same 20% is worth much more at the bottom of the stack than the top.",
  builds:[["b1-laplace","the layer with the most leverage"]], leads:[["b1-principle","what this means under pressure"],["b4-principle","how to spend the next unit"]], live:[]},

"b1-sensitive":{type:"mechanism", title:"Emotional regulation", x:520, y:522,
  ess:"Staying clear under stress, fear, ego, and fatigue.",
  hook:"What happens to your reasoning in the ninety seconds after someone criticises your work in public?",
  story:"It narrows, and it narrows exactly when you need it wide. The framework defines the capability as “Staying clear under stress, fear, ego, and fatigue” — and notes the four separately, because they arrive by different doors. Fatigue is not fear, and ego is not stress, but each takes the same thing away.",
  mech:"This is the base because “every capability above degrades when you're rattled.” The degradation is not uniform, either. Perception narrows first, so options stop appearing; then judgment defaults to whatever is most practised; then execution turns brittle. Nothing is lost from your repertoire — it is all temporarily out of reach, which is why the recovery can be so fast.",
  term:"Emotional regulation", def:"the capacity to keep thinking clearly while under stress, fear, ego or fatigue.",
  sowhat:"You will lose the arguments and the decisions that matter most, because the moments that matter most are the ones carrying the most heat.",
  explain:"why the capability that looks like temperament is the one gating all the thinking.",
  builds:[["a1","the clearest case of a trainable trait"],["b1-laplace","one of the two floor capabilities"]], leads:[["b1-principle","the comparison that follows"]], live:[["b1-pendulum","see the cap bind"]]},

"b1-lorenz-story":{type:"story", title:"Agency and execution", x:254, y:656,
  ess:"Actually doing the thing. Shipping. Acting under uncertainty.",
  hook:"How many of your good decisions from last year were actually carried out?",
  story:"The gap between the two numbers is this capability. The framework is blunt about where work dies: “the gap between deciding and doing is where most work dies.” And it prices the failure exactly — “Perfect judgment + no follow-through = nothing produced.”",
  mech:"Execution is a separate skill from judgment, not its automatic consequence, which is why strong deciders can have thin output. Two things make it hard. Acting requires committing before the information is complete, so every action is taken at a moment when waiting still feels defensible. And the cost of not acting is invisible, while the cost of acting wrongly is not.",
  term:"Agency", def:"the capacity to convert a decision into action under conditions that remain uncertain.",
  sowhat:"An excellent thinker with no follow-through produces nothing, and — worse for the diagnosis — feels productive throughout, because deciding feels like working.",
  explain:"why deciding and doing are two capabilities rather than one.",
  builds:[["b1-laplace","the other floor capability"]], leads:[["b1-principle","what the floor adds up to"]], live:[]},

"b1-principle":{type:"principle", title:"Clear beats smart", x:716, y:679,
  ess:"Clear-when-it-is-hard beats smarter-but-rattled, every time.",
  hook:"Would you rather face a hard decision with 20% more knowledge, or with your composure intact?",
  story:"The framework does not treat this as close: “Clear-when-it's-hard beats smarter-but-rattled, every time.” The claim is not that intelligence is unimportant. It is that intelligence is a stock and composure is the access road, and a stock you cannot reach is not an asset in the moment you need it.",
  mech:"Both floor capabilities converge on the same point. Regulation determines whether your capability is available; agency determines whether it ever reaches the world. Neither adds anything to what you know or how well you think. They govern the conversion of both into anything that counts, which is why they gate rather than contribute.",
  term:"The floor principle", def:"composure and follow-through set the ceiling on what your intelligence can be worth.",
  sowhat:"Optimise the engine while the floor stays cracked and you accumulate capability you cannot deploy — the specific failure of the very well-read.",
  explain:"why the least intellectual layer wins the comparison against the most.",
  builds:[["b1-sensitive","composure, the access road"],["b1-lorenz-story","follow-through, the exit"]], leads:[["b2-attractors","with the floor holding, what does the engine do?"]], live:[["b1-pendulum","see the cap bind"]]},

"b2-attractors":{type:"mechanism", title:"Knowledge", x:2069, y:401,
  ess:"What you know: facts, models, hard-won experience. The raw material.",
  hook:"What is the difference between knowing a field and having read about it?",
  story:"Experience that has been paid for. The framework's definition keeps all three sources in view — “What you know — facts, models, hard-won experience” — and its verdict on the role is a single phrase: “The raw material.”",
  mech:"Knowledge is the input the rest of the engine works on, and calling it raw material is a demotion with a purpose. Material does not decide anything. Two people holding the same facts routinely reach different conclusions, so whatever produces the difference is downstream. That is why this is the first station in the loop rather than the whole of it.",
  term:"Knowledge", def:"the accumulated facts, models and experience available to be applied.",
  sowhat:"Knowledge is the easiest layer to add to and the easiest to mistake for capability, which is why it absorbs effort that other layers needed.",
  explain:"why what you know is the input to judgment rather than judgment itself.",
  builds:[["b1-principle","only reachable if the floor holds"]], leads:[["b2-lorenz-attractor","and what you actually notice of it"]], live:[]},

"b2-lorenz-attractor":{type:"mechanism", title:"Perception", x:2300, y:282,
  ess:"What you actually notice: risks, options, what is really there.",
  hook:"Two people are handed the same situation and the same facts, and they decide differently. Where did they diverge?",
  story:"Before the decision. The framework's answer to that question is the whole reason perception is a separate station: it is “Why two people facing the same choice decide differently.” What reached them differed, so what they chose between differed.",
  mech:"Perception sets the option set, and the option set bounds the decision. A risk you do not see cannot be weighed; an alternative you do not notice cannot be chosen; the situation you respond to is the one you registered, not the one in front of you. This is also why the framework files empathy as a kind of perception — the same capability, aimed at people.",
  term:"Perception", def:"what you actually register of a situation — the risks and options that make it into consideration.",
  sowhat:"An unnoticed option costs you silently. The decision feels well-made because you weighed everything you saw, and nothing tells you what you did not.",
  explain:"why two people with identical information reliably reach different conclusions.",
  builds:[["b2-attractors","the material it filters"]], leads:[["b2-tension-random","and then the choosing"]], live:[]},

"b2-tension-random":{type:"tension", title:"Decision-making", x:2392, y:470,
  ess:"What you choose, under uncertainty and tradeoffs. Hard to delegate.",
  hook:"Which parts of your work could you hand to someone excellent tomorrow — and which could you not?",
  story:"The choosing is the part that stays. The framework marks it “High-leverage; hard to delegate” and defines it by its conditions rather than its method: “What you choose, under uncertainty and tradeoffs.” Both conditions are permanent features, not signs that you have prepared badly.",
  mech:"The tension is that this is simultaneously the highest-leverage station and the least transferable. Knowledge can be looked up and perception can be supplemented by other people, but the choice under real tradeoffs sits with whoever holds the consequences. So it improves slowly, through your own repetitions, and only if the next two stations are working.",
  term:"Decision-making", def:"choosing among options when the information is incomplete and the goods conflict.",
  sowhat:"Because it cannot be delegated, a weakness here is not compensable by hiring or reading. It shows up as a pattern in your choices that everyone else can see before you can.",
  explain:"why the highest-leverage part of the engine is the part nobody can do for you.",
  builds:[["b2-lorenz-attractor","it can only choose among what was noticed"]], leads:[["b2-logistic","and how you find out whether it was right"]], live:[]},

"b2-logistic":{type:"simulation", title:"Feedback loops", sim:"loop", x:1837, y:233,
  ess:"Catching what reality says back about your choices.",
  hook:"How would you find out, this year, that one of your standing beliefs about your work is wrong?",
  story:"If there is no ready answer, the loop is open, and an open loop has a specific signature. The framework names it exactly: “No feedback = no improvement, just confident repetition.” Not visible failure — confidence, repeated. Turn the feedback off below and watch what the error does.",
  mech:"Feedback is what closes the engine into a loop rather than a list. Its absence does not announce itself, because the felt experience of an open loop is identical to competence: you act, nothing contradicts you, and confidence accumulates. Two things break the closure — outcomes that arrive too late to attribute, and environments where nobody tells you.",
  term:"Feedback loop", def:"the return path by which reality corrects the model that produced your choice.",
  sowhat:"Without it you do not stop improving in a way you would notice. You keep repeating the same move with rising confidence and no idea the loop is open.",
  explain:"why an open feedback loop feels exactly like being right.",
  builds:[["b2-tension-random","it corrects what the choosing assumed"]], leads:[["b2-principle","and how fast you convert what comes back"]], live:[]},

"b2-principle":{type:"principle", title:"Learning rate is the multiplier", x:1895, y:598,
  ess:"How fast you convert feedback into better models.",
  hook:"Two people get identical feedback. One is different next month, the other is not. What separates them?",
  story:"The conversion step — and the framework gives this station a status none of the others have. It is “The multiplier on the entire loop.” Not another component but the rate at which the whole cycle compounds.",
  mech:"Every other station is a level; this one is a rate. Knowledge, perception and judgment describe where you are, and learning rate describes how fast that changes given what reality returns. Because it multiplies the loop rather than adding to it, a small difference here separates two people with identical starting capability after enough cycles — which is also why it is worth more than any single station's level.",
  term:"Learning rate", def:"the speed at which feedback is converted into a revised model.",
  sowhat:"A low learning rate wastes feedback you have already paid for. The information arrived, the correction did not, and the same error is available to make again.",
  explain:"why the last station in the loop is worth more than any of the levels.",
  builds:[["b2-logistic","it needs something coming back to convert"]], leads:[["b3-kokura","a fast engine, aimed at what?"]], live:[["b2-logistic","see the loop close"]]},

"b3-kokura":{type:"simulation", title:"Taste and values", sim:"aim", x:271, y:962,
  ess:"Knowing what is worth doing, and what good even means in your field.",
  hook:"You have a superb engine and a year. What should you point it at?",
  story:"The engine cannot answer that, and this is the framework's sharpest line about the middle layer: “the engine optimises — but toward what?” The consequence is stated without cushioning — “Without this you become highly effective at the wrong things.”",
  mech:"The engine is a machine for getting efficiently to answers, and efficiency is indifferent to direction. Taste is the capability that supplies the target: knowing what counts as good work here, which problems are worth the year, and which impressive things are beside the point. The framework's own caution applies — the engine “only makes you efficient, not necessarily right about what to pursue.”",
  term:"Taste", def:"the judgment of what is worth doing, and of what counts as good in your particular field.",
  sowhat:"Strong engine, weak taste, and you become fast and rigorous in the wrong direction — the most expensive failure on the map, because nothing about it feels like failing.",
  explain:"why an excellent engine aimed badly is worse than a mediocre one aimed well.",
  builds:[["b2-principle","the engine that needs a target"]], leads:[["b3-contingency","and the people you are aimed with"],["b3-plan","how to test whether an aim is yours"]], live:[]},

"b3-contingency":{type:"tension", title:"Empathy", x:601, y:1008,
  ess:"Sensing what others feel, need, and mean. The input side.",
  hook:"When someone tells you what they want, how often is that the thing they actually need?",
  story:"Often enough that the gap is a capability. The framework defines empathy as “Sensing what others feel, need, and mean” — three separate objects — and then places it precisely: it is “the input side of every relationship — really perception, pointed at people.”",
  mech:"The tension is that empathy is mechanically perception and is nonetheless filed under Direction, because that is where it pays. It obeys perception's rules: it sets the option set for everything you then say, and what you fail to register never enters the exchange. It also degrades with the floor, which is why it deserts you in exactly the arguments where it would matter most.",
  term:"Empathy", def:"perception aimed at people — registering what they feel, need and mean, as against what they said.",
  sowhat:"Miss the input and everything downstream is well-executed and off-target: a persuasive answer to a question nobody asked.",
  explain:"why the framework calls empathy perception rather than a feeling.",
  builds:[["a3","the clearest case of the categories bleeding"],["b3-kokura","direction, now with other people in it"]], leads:[["b3-timeline","and the output side"]], live:[]},

"b3-timeline":{type:"mechanism", title:"Communication", x:312, y:1210,
  ess:"Conveying, persuading, making others feel understood. The output side.",
  hook:"You understood them completely and they still felt unheard. What was missing?",
  story:"The delivery. The framework splits the pair cleanly — “Empathy senses; communication delivers” — and refuses to treat the second as a soft extra: “Half of every collaboration and relationship lives here.”",
  mech:"Communication is the output channel, and the framework's definition includes something people leave out of it: “Conveying, persuading, making others feel understood.” The third is not a by-product of the first two. Understanding someone and their feeling understood are separate accomplishments, and only the second is visible to them — which is why comprehension without delivery reads as indifference.",
  term:"Communication", def:"the output side of a relationship — conveying, persuading, and making the other person feel understood.",
  sowhat:"Sensed but undelivered is indistinguishable, from the outside, from not having noticed at all. You get no credit and, worse, they get no benefit.",
  explain:"why making someone feel understood is a separate skill from understanding them.",
  builds:[["b3-contingency","the input it delivers"]], leads:[["b3-principle","the pair, taken together"]], live:[]},

"b3-principle":{type:"principle", title:"An aim you cannot state is an aim you cannot share", x:774, y:1152,
  ess:"Direction is not a capability you can exercise alone.",
  hook:"Can you say, in one sentence, what good work looks like in your field — so that someone else could aim at it?",
  story:"If not, the taste may still be real, but it stops at you. This layer holds both the aim and the channel, and the framework's own structure suggests why they sit together: taste supplies the target, and communication is what lets anyone else hit it.",
  mech:"Taste held privately still guides your own choices, which is most of its value for solitary work. The moment work is shared, an unstated standard becomes a bottleneck: people cannot aim at a target they cannot see, and the corrections arrive too late, at review. Stating it converts a private capability into a shared one — which is also the fastest way to discover it was vaguer than it felt.",
  term:"Shared direction", def:"an aim made explicit enough that other people can act on it without you present.",
  sowhat:"An unstated standard is enforced by rejection after the fact. The work comes back wrong, repeatedly, and the cause looks like other people's judgment.",
  explain:"why taste and communication belong in the same layer.",
  builds:[["b3-kokura","the aim"],["b3-timeline","the channel"]], leads:[["b3-plan","so: whose aim is it?"]], live:[]},

"b3-plan":{type:"tension", title:"Is this aim yours, or inherited?", x:543, y:1326,
  ess:"Most of what feels like taste arrived from somewhere without being examined.",
  hook:"Pick something you are certain is excellent work. Where did that certainty come from?",
  story:"Usually from an environment rather than an examination — a first employer, a field's prestige ladder, whoever you most wanted to impress at twenty-five. That is not a reason to discard it. Inherited taste is how anyone starts, and the framework's own definition is field-relative: “what good even means in your field.”",
  mech:"The tension is that taste has to be absorbed before it can be examined, so the same mechanism that trains it also installs things you never chose. Two questions separate them. Would this still count as good if the people who taught it to you were not watching? And is it good for the work, or good for standing among the people who do the work? The two answers come apart more often than is comfortable.",
  term:"Inherited taste", def:"a standard of good absorbed from an environment rather than arrived at deliberately.",
  sowhat:"Optimising an inherited standard is the quietest version of being effective at the wrong things, because the aim is not obviously wrong — merely someone else's.",
  explain:"how to tell a standard you chose from one you absorbed.",
  builds:[["b3-kokura","the capability being examined"]], leads:[["b4-coinflip","and now, the limits of the whole map"]], live:[]},

"b4-coinflip":{type:"simulation", title:"One run of the tape", sim:"luck", x:1583, y:979,
  ess:"The same capability, run many times, produces a wide spread of outcomes.",
  hook:"How much of your best result was you?",
  story:"Unanswerable from the result alone, which is the point. Below, one fixed level of capability is run repeatedly. The spread is not noise around a truth you could otherwise read — it is the reason the framework insists that “Outcomes are also shaped by luck and timing — things no skill controls.”",
  mech:"Capability shifts the distribution of outcomes; it does not select a point in it. So a single outcome is a sample, and any inference from one sample to the underlying capability carries the whole variance with it. This cuts both ways, which is what makes it hard to use: your worst result overstates your weakness exactly as much as your best overstates your strength.",
  term:"Outcome variance", def:"the spread of results a single fixed level of capability can produce.",
  sowhat:"Judging your capability by your last outcome trains you on noise — dropping what happened to fail and doubling down on whatever happened to land.",
  explain:"why one result, good or bad, tells you so little about the capability behind it.",
  builds:[["a4","the caveat, made visible"]], leads:[["b4-ergodicity","and what does not arrive by decision at all"]], live:[]},

"b4-ergodicity":{type:"mechanism", title:"What showing up does", x:1901, y:945,
  ess:"Some of the best things come from sustained attention, not decisions.",
  hook:"Which of the good things in your life arrived because you decided well?",
  story:"Some. Not the largest ones, on the framework's account: “Some of the best things (love, friendship, meaning) come more from sustained attention and showing up than from any discrete decision.”",
  mech:"A capability map is built around decisions and their execution, so it is best at goods that a decision can produce. The goods named here accumulate differently — from repeated presence over long periods, where no individual instance is the cause and no decision is identifiable as the one that worked. Optimising them as decisions tends to damage them, because the thing that produces them is duration.",
  term:"Sustained attention", def:"a good that accrues from repeated showing up rather than from any identifiable decision.",
  sowhat:"Treat a relationship as a decision problem and you will optimise the wrong variable, then wonder why the returns are poor while every individual choice looked defensible.",
  explain:"why the best things on the list are the ones this map handles worst.",
  builds:[["a4","the second half of the caveat"]], leads:[["b4-domains","where the map does apply, and how differently"]], live:[]},

"b4-domains":{type:"mechanism", title:"Same stack, different weights", x:2219, y:979,
  ess:"The layers are universal. Which one binds is not.",
  hook:"Would you diagnose a surgeon, a novelist and a founder against the same profile of strengths?",
  story:"Against the same layers, yes — but not the same weights. The stack describes what any capable performance requires; it does not claim every domain demands the layers equally, and the framework's own definition of taste is explicitly field-relative: “what good even means in your field.”",
  mech:"Gating means the binding layer is whichever is lowest relative to what the domain demands. So the same profile is strong in one field and bottlenecked in another, and the diagnosis has to be run against a particular kind of work rather than in the abstract. Work that is mostly execution under pressure binds on the floor; work that is mostly direction-setting binds on taste.",
  term:"Domain weighting", def:"how much a particular kind of work demands of each layer, which sets where your constraint falls.",
  sowhat:"Diagnosing yourself in general rather than against the work you actually do produces a profile that is true and useless.",
  explain:"why the same capability profile is strong in one field and stuck in another.",
  builds:[["a3","the lens, applied situationally"]], leads:[["b4-survive","what to protect when the load rises"],["b4-danger","the pattern this most often hides"]], live:[]},

"b4-survive":{type:"principle", title:"Under load, defend the floor", x:2438, y:1094,
  ess:"Pressure takes the bottom layer first, and the bottom layer gates the rest.",
  hook:"When the week goes badly, which of your habits is first to go?",
  story:"Typically sleep, then exercise, then the reflection that closed your feedback loops — which is to say, the floor and the loop, in that order. The framework's structure predicts the cost: these are the layers everything else is conditional on.",
  mech:"Under load the instinct is to protect output by cutting maintenance, and the arithmetic of gating makes that exactly backwards. Cutting the floor lowers the ceiling on every capability you were trying to protect, so the visible output holds for a short period and then falls further than the original pressure warranted. The reason the trade looks attractive is that the floor's contribution is invisible while it is intact.",
  term:"Load discipline", def:"protecting the gating layers first when capacity is short, rather than protecting visible output.",
  sowhat:"Cut the floor to protect output and you get a few good days followed by a broad collapse — and the collapse looks like the pressure rather than the trade you made.",
  explain:"why the first thing to cut under pressure should be the last.",
  builds:[["a2","the arithmetic that makes this backwards"]], leads:[["b4-explore","and what you cannot see about yourself"]], live:[]},

"b4-signal":{type:"simulation", title:"The analytical blind spot", sim:"profile", x:1612, y:1181,
  ess:"Strong Engine, weak Foundation and taste — the common shape.",
  hook:"If your strengths are all in one layer, is that a profile or a bottleneck?",
  story:"A bottleneck, and the framework names the specific version most likely to apply to people who enjoy frameworks: “strength concentrated in the Engine, weakness in the Foundation and in taste/communication — the “feels-like-personality-not-skill” zones. These feel fixed but aren't.”",
  mech:"The pattern is self-reinforcing because the engine is the most legible layer and the most rewarding to improve. Progress there is visible and measurable; progress in regulation or taste is neither. So effort flows to the layer already strongest, the profile sharpens, and the constraint stays exactly where it was. Compare the shapes below and note that the binding layer is never the tall one.",
  term:"Concentrated profile", def:"capability massed in one layer while the gating layers stay weak.",
  sowhat:"The hours go to the layer that is already strong, because that is the one where effort shows. The bottleneck is untouched and the profile looks more impressive each year.",
  explain:"why analytical people reliably invest in the layer that is not their constraint.",
  builds:[["a2","the reason a spike does not compensate"]], leads:[["b4-danger","why those zones feel unmovable"]], live:[]},

"b4-danger":{type:"mechanism", title:"The feels-like-personality zone", x:1959, y:1152,
  ess:"The capabilities that feel innate are the ones treated as unchangeable.",
  hook:"Why is it easier to admit you lack a piece of knowledge than to admit you handle pressure badly?",
  story:"Because one is a gap and the other feels like a description of you. The framework's phrase for these capabilities is precise — the “feels-like-personality-not-skill” zones — and its correction is four words: “These feel fixed but aren't.”",
  mech:"Regulation, taste, empathy and communication are experienced from the inside as dispositions rather than skills, for a structural reason: you have never observed yourself without them, so there is no contrast to reveal them as learned. That makes them the least likely to be worked on and, because two of the four sit in the floor, the most costly to leave alone.",
  term:"The fixed-feeling zone", def:"capabilities experienced as temperament, and therefore exempted from practice.",
  sowhat:"These get described rather than trained — “I'm just not a people person”, “I'm bad under pressure” — and the description quietly becomes the ceiling.",
  explain:"why the most trainable capabilities are the ones nobody trains.",
  builds:[["a1","the axiom aimed exactly here"],["b4-signal","the profile it produces"]], leads:[["b4-process","so how should the map be used?"]], live:[]},

"b4-process":{type:"mechanism", title:"A diagnostic, not a scoreboard", x:1650, y:1330,
  ess:"Use it to find one bottleneck, not to rate yourself on twelve axes.",
  hook:"Having read a list of capabilities, what is the first thing you want to do with it?",
  story:"Score yourself on each — which is the one use the framework rules out: “Use it as a diagnostic, not a scoreboard.” The instruction that replaces it is deliberately narrow: “Periodically ask: which single layer is my current bottleneck? Work there.”",
  mech:"A scoreboard produces a rating on every axis at once, which is both unactionable and mildly punishing. A diagnostic asks one question with one answer, and gating is what makes the single answer legitimate: if the lowest layer caps the rest, then at any moment there is one place where work pays. The map's purpose is to narrow attention, not to broaden self-assessment.",
  term:"Diagnostic use", def:"reading the map to locate the single binding constraint, rather than to score every capability.",
  sowhat:"Used as a scoreboard it yields twelve ratings and no action, and the twelve ratings feel like a verdict on you rather than a description of a constraint.",
  explain:"why the right output of this map is one sentence, not a profile.",
  builds:[["b4-danger","and the honesty this requires"]], leads:[["b4-destination","how often to re-run it"]], live:[]},

"b4-destination":{type:"mechanism", title:"The bottleneck moves", x:2330, y:1255,
  ess:"Fix the binding layer and the constraint relocates. Re-run the diagnosis.",
  hook:"You have spent a year on your weakest layer and it is no longer your weakest. Now what?",
  story:"A new layer is binding, and the work that paid for the last year is now the work that pays least. That is why the framework's instruction is periodic rather than once: “Periodically ask: which single layer is my current bottleneck?”",

const vp = document.getElementById('vp');
const world = document.getElementById('world');
const reader = document.getElementById('reader');
const WW = 2750, WH = 1750;
let cam = {s:0.12, tx:0, ty:0};
let anim = null;
function apply(){
  world.style.transform = `translate(${cam.tx}px, ${cam.ty}px) scale(${cam.s})`;
  lod();
}
function readerW(){ return reader.classList.contains('open') ? (reader.getBoundingClientRect().width||430) : 0; }
function visW(){ return innerWidth - readerW(); }
function centerOn(cx, cy, s){
  cam.s = s;
  cam.tx = visW()/2 - cx*s;
  cam.ty = innerHeight/2 - cy*s;
  apply();
}
function flyTo(cx, cy, s, dur=700){
  if (anim) cancelAnimationFrame(anim);
  const s0=cam.s, cx0=(visW()/2-cam.tx)/s0, cy0=(innerHeight/2-cam.ty)/s0;
  const ls0=Math.log(s0), ls1=Math.log(s);
  const t0=performance.now();
  function step(t){
    let p=Math.min(1,(t-t0)/dur);
    p = p<.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2;
    centerOn(cx0+(cx-cx0)*p, cy0+(cy-cy0)*p, Math.exp(ls0+(ls1-ls0)*p));
    if (p<1) anim=requestAnimationFrame(step);
  }
  anim=requestAnimationFrame(step);
}
function overviewCam(fly=true){
  const s = Math.min(visW()/WW, innerHeight/WH)*0.92;
  if (fly) flyTo(WW/2, WH/2, s, 800); else centerOn(WW/2, WH/2, s);
}
vp.addEventListener('wheel', e=>{
  e.preventDefault();
  if (anim) cancelAnimationFrame(anim);
  const f = Math.exp(-e.deltaY*0.0016);
  const s2 = Math.min(2.2, Math.max(0.06, cam.s*f));
  const wx=(e.clientX-cam.tx)/cam.s, wy=(e.clientY-cam.ty)/cam.s;
  cam.s=s2; cam.tx=e.clientX-wx*s2; cam.ty=e.clientY-wy*s2;
  apply();
}, {passive:false});
const ptrs = new Map();
let panStart=null, pinchStart=null, moved=0;
vp.addEventListener('pointerdown', e=>{
  if (e.target.closest('.tlabel')) return;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size===1){
    moved=0;
    panStart={mx:e.clientX, my:e.clientY, tx:cam.tx, ty:cam.ty};
    vp.classList.add('dragging');
  } else if (ptrs.size===2){
    const [p1,p2]=[...ptrs.values()];
    pinchStart={d:Math.hypot(p1.x-p2.x,p1.y-p2.y), s:cam.s,
      wx:((p1.x+p2.x)/2-cam.tx)/cam.s, wy:((p1.y+p2.y)/2-cam.ty)/cam.s};
    panStart=null;
  }
});
addEventListener('pointermove', e=>{
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size===1 && panStart){
    if (anim) cancelAnimationFrame(anim);
    moved += Math.abs(e.movementX||0)+Math.abs(e.movementY||0);
    cam.tx = panStart.tx + (e.clientX-panStart.mx);
    cam.ty = panStart.ty + (e.clientY-panStart.my);
    apply();
  } else if (ptrs.size===2 && pinchStart){
    if (anim) cancelAnimationFrame(anim);
    const [p1,p2]=[...ptrs.values()];
    const d=Math.hypot(p1.x-p2.x,p1.y-p2.y);
    const s2=Math.min(2.2, Math.max(0.06, pinchStart.s*d/pinchStart.d));
    const cx=(p1.x+p2.x)/2, cy=(p1.y+p2.y)/2;
    cam.s=s2; cam.tx=cx-pinchStart.wx*s2; cam.ty=cy-pinchStart.wy*s2;
    apply();
  }
});
function ptrUp(e){ ptrs.delete(e.pointerId);
  if (ptrs.size<2) pinchStart=null;
  if (ptrs.size===0){ panStart=null; vp.classList.remove('dragging'); } }
addEventListener('pointerup', ptrUp);

function highlight(id){
  clearHighlight();
  const n = N[id];
  const nb = new Set([id]);
  const conns = [
    ...n.builds.map(([t])=>({t, lab:REL.builds.glyph, title:REL.builds.label, into:true})),
    ...n.leads.map(([t])=>({t, lab:REL.leads.glyph, title:REL.leads.label, into:false})),
    ...n.live.map(([t])=>({t, lab:REL.live.glyph, title:REL.live.label, into:false}))
  ];
  conns.forEach(c=>nb.add(c.t));
  ALL.forEach(x=>{
    mkEls[x].classList.toggle('dimmed', !nb.has(x));
    mkEls[x].classList.toggle('neighbor', nb.has(x) && x!==id);
    mkEls[x].classList.toggle('focused', x===id);
  });
  const here = dotCenter(id);
  conns.forEach(c=>{
    const there = dotCenter(c.t);
    let from = c.into ? {...there} : {...here};
    let to   = c.into ? {...here} : {...there};
    {
      const ddx=to.x-from.x, ddy=to.y-from.y, LL=Math.hypot(ddx,ddy)||1;
      const ux=ddx/LL, uy=ddy/LL, off=30;
      from = {x:from.x+ux*off, y:from.y+uy*off};
      to   = {x:to.x-ux*off,   y:to.y-uy*off};
    }
    const dx=to.x-from.x, dy=to.y-from.y, dist=Math.hypot(dx,dy)||1;
    const cx=(from.x+to.x)/2 - dy/dist*dist*0.12, cy=(from.y+to.y)/2 + dx/dist*dist*0.12;
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',`M ${from.x} ${from.y} Q ${cx} ${cy} ${to.x} ${to.y}`);
    p.setAttribute('fill','none');
    p.setAttribute('class','lnk-flow'); p.setAttribute('stroke',`rgba(${RGB_AMBER},0.45)`);
    p.setAttribute('stroke-width','2.5');
    p.setAttribute('stroke-dasharray','9,8');
    p.setAttribute('class','tline');
    p.setAttribute('marker-end','url(#arr)');
    tsvg.appendChild(p);
    const lbl = document.createElement('div');
    lbl.className='tlabel';
    lbl.style.left = (.25*from.x+.5*cx+.25*to.x)+'px';
    lbl.style.top = (.25*from.y+.5*cy+.25*to.y)+'px';
    lbl.textContent = c.lab;
    lbl.title = c.title;
    lbl.addEventListener('click', e=>{ e.stopPropagation(); openIdea(c.t); });
    world.appendChild(lbl);
    tlabels.push(lbl);
  });
}
function clearHighlight(){
  ALL.forEach(x=>mkEls[x].classList.remove('dimmed','neighbor','focused'));
  [...tsvg.querySelectorAll('path')].forEach(p=>p.remove());
  tlabels.forEach(l=>l.remove()); tlabels.length=0;
}

/* ============================================================
   NAV - top-right cluster drives the default flow
   ============================================================ */
function syncNav(){
  const i = focusId ? TOUR.indexOf(focusId) : -1;
  document.getElementById('navcluster').classList.toggle('on', !!focusId);
  document.getElementById('navPrev').disabled = i===0;
  document.getElementById('navNext').disabled = i===TOUR.length-1;
}
function navStep(dir){
  const i = focusId ? TOUR.indexOf(focusId) : -1;
  if (i<0){ openIdea(TOUR[0]); return; }
  const j = i+dir;
  if (j>=0 && j<TOUR.length) openIdea(TOUR[j]);
}
document.getElementById('navPrev').onclick = ()=>navStep(-1);
document.getElementById('navNext').onclick = ()=>navStep(1);

/* ============================================================
   SIMULATIONS
   ============================================================ */

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
function setActive(fig, btn){
  fig.querySelectorAll('.ghost').forEach(b=>{ if(b.dataset.d!==undefined||b.dataset.m!==undefined) b.classList.remove('active');});
  if (btn) btn.classList.add('active');
}
function simHTML(kind){
  const caps = {
    gating:"Set each layer, then choose where to spend a 20% gain. The bars and the arithmetic are illustrative — the framework gives one figure, not a formula. What is being shown is the shape of gating: the output waits on the lowest layer, so the gain only moves it when spent there.",
    loop:"Watch a model's error over repeated cycles, illustratively. Turn feedback off and it flattens — the framework's “confident repetition”. Turn it on and the learning-rate slider sets how fast the correction compounds. No value here is measured; the curve shows a direction, not a rate.",
    aim:"One engine, two possible targets. Effort accumulates toward whichever you pick, and the readout is how much of it lands on work worth doing. Illustrative: the point is that efficiency is indifferent to direction.",
    profile:"Four illustrative profiles across the three layers. In each, the binding layer is marked — and it is never the tall one. The shapes are schematic; the framework names only the analytical pattern.",
    luck:"One fixed level of capability, run many times, with a slider for how much luck the domain carries. Seeded, so the same run repeats. The spread is illustrative — the framework gives no numbers here, only the claim that outcomes are not capability."
  };
  const ctl = {
    gating:`<span class="cl">foundation</span><input type="range" min="10" max="100" step="5" value="45">
      <span class="cl">engine</span><input type="range" min="10" max="100" step="5" value="85">
      <span class="cl">direction</span><input type="range" min="10" max="100" step="5" value="70">
      <button class="ghost active" data-m="none">no gain</button>
      <button class="ghost" data-m="found">+20% foundation</button>
      <button class="ghost" data-m="eng">+20% engine</button>
      <button class="ghost" data-m="dir">+20% direction</button>`,
    loop:`<span class="cl">learning rate</span><input type="range" min="5" max="95" step="5" value="45">
      <button class="ghost active" data-m="on">feedback on</button>
      <button class="ghost" data-m="off">feedback off</button>`,
    aim:`<button class="ghost active" data-m="good">aimed at good work</button>
      <button class="ghost" data-m="near">aimed nearby</button>
      <button class="ghost" data-m="wrong">aimed at the wrong thing</button>`,
    profile:`<button class="ghost active" data-m="analytic">analytical</button>
      <button class="ghost" data-m="operator">operator</button>
      <button class="ghost" data-m="connector">connector</button>
      <button class="ghost" data-m="even">even</button>`,
    luck:`<span class="cl">how much luck this domain carries</span><input type="range" min="0" max="90" step="10" value="50">
      <button class="ghost" data-a="run">run again ↻</button>`
  };
  return `<figure class="frame" data-sim="${kind}">
    <canvas></canvas>
    <div class="controls">${ctl[kind]}</div>
    <figcaption>${caps[kind]}</figcaption>
  </figure>`;
}
/* Canvas backing store follows the device pixel ratio, so canvas text stays
   crisp in the ~570px reader column. Sims still draw in logical 700-wide units. */
const _DPR = Math.max(1, Math.min(2, (typeof devicePixelRatio === 'number' ? devicePixelRatio : 1) || 1));
function fitCanvas(cv, w, h){
  cv.width = Math.round(w*_DPR); cv.height = Math.round(h*_DPR);
  const ctx = cv.getContext('2d');
  if (ctx.setTransform) ctx.setTransform(_DPR,0,0,_DPR,0,0);
  return ctx;
}
const SIMS = {};

/* ---------- I · gating: the output waits on the lowest layer ------------ */
SIMS.gating = fig=>{
  const cv=fig.querySelector('canvas');
  const ctx=fitCanvas(cv,700,400);
  const W=700,H=400,L=150,R=W-150,rowH=54,T=52;
  const rs=[].slice.call(fig.querySelectorAll('input[type=range]'));
  const NAMES=['foundation','engine','direction'];
  let gain='none';
  const GK={found:0,eng:1,dir:2};
  function vals(){
    const v=rs.map(r=>parseInt(r.value,10));
    if(gain!=='none'){ const i=GK[gain]; v[i]=Math.min(100, Math.round(v[i]*1.2)); }
    return v;
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    const base=rs.map(r=>parseInt(r.value,10)), v=vals();
    const cap=Math.min.apply(null,v), capBase=Math.min.apply(null,base);
    const bw=R-L;
    ctx.font='12px Inter, sans-serif'; ctx.textAlign='right';
    for(let i=0;i<3;i++){
      const y=T+i*rowH, val=v[i], b=base[i];
      ctx.fillStyle=GRAY; ctx.fillText(NAMES[i], L-14, y+13);
      ctx.fillStyle=`rgba(${RGB_FAINT},0.45)`; ctx.fillRect(L,y,bw,18);
      ctx.fillStyle=`rgba(${RGB_GRAY},0.55)`; ctx.fillRect(L,y,bw*b/100,18);
      if(val>b){ ctx.fillStyle=`rgba(${RGB_AMBER},0.75)`; ctx.fillRect(L+bw*b/100,y,bw*(val-b)/100,18); }
      const binding = val===cap;
      ctx.textAlign='left'; ctx.fillStyle= binding?AMBER:FAINT;
      ctx.fillText(binding?'binding':'', R+12, y+13); ctx.textAlign='right';
    }
    /* the cap line */
    const cy=T+3*rowH+34;
    ctx.strokeStyle=BRD; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(L,cy-10); ctx.lineTo(R,cy-10); ctx.stroke();
    ctx.fillStyle=GRAY; ctx.textAlign='right';
    ctx.fillText('what the stack delivers', L-14, cy+27);
    ctx.fillStyle=`rgba(${RGB_FAINT},0.45)`; ctx.fillRect(L,cy+14,bw,20);
    ctx.fillStyle=`rgba(${RGB_GRAY},0.55)`; ctx.fillRect(L,cy+14,bw*capBase/100,20);
    if(cap>capBase){ ctx.fillStyle=AMBER; ctx.fillRect(L+bw*capBase/100,cy+14,bw*(cap-capBase)/100,20); }
    ctx.textAlign='left'; ctx.font='12px Inter, sans-serif';
    const moved = cap-capBase;
    ctx.fillStyle= moved>0?AMBER:FAINT;
    ctx.fillText(moved>0?('+'+moved+' — the gain landed on the binding layer'):'unchanged — the gain missed the binding layer', L, cy+62);
    ctx.fillStyle=SUNK; ctx.font='12px Inter, sans-serif';
    ctx.fillText('the output tracks the lowest layer, not the average', L, H-14);
    ctx.textAlign='right'; ctx.fillStyle=INKC; ctx.font='13px Inter, sans-serif';
    ctx.fillText('a weakness low down caps everything higher', R, 28);
    ctx.textAlign='left';
  }
  rs.forEach(r=>r.oninput=draw);
  fig.querySelectorAll('.ghost').forEach(b=>b.onclick=()=>{ setActive(fig,b); gain=b.dataset.m; draw(); });
  draw();
  return ()=>{};
};

/* ---------- II · loop: feedback closes it, learning rate compounds ------ */
SIMS.loop = fig=>{
  const cv=fig.querySelector('canvas');
  const ctx=fitCanvas(cv,700,400);
  const W=700,H=400,L=64,R=W-150,T=40,B=H-58,N=48;
  const sl=fig.querySelector('input[type=range]');
  let mode='on', k=0, raf=0;
  function series(){
    const rate=parseInt(sl.value,10)/100, out=[];
    let err=1;
    for(let i=0;i<N;i++){
      out.push(err);
      err = mode==='off' ? err : err*(1-0.62*rate);
    }
    return out;
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    const s=series();
    const x=i=>L+(R-L)*i/(N-1), y=e=>B-(B-T)*e;
    ctx.strokeStyle=BRD; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(L,T); ctx.lineTo(L,B); ctx.lineTo(R,B); ctx.stroke();
    ctx.font='12px Inter, sans-serif'; ctx.fillStyle=GRAY; ctx.textAlign='right';
    ctx.fillText('error in your model', L-10, T+10);
    ctx.textAlign='left'; ctx.fillText('cycles of acting and finding out', L, H-16);
    /* the open-loop reference */
    ctx.strokeStyle=`rgba(${RGB_GRAY},0.45)`; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(L,y(1)); ctx.lineTo(R,y(1)); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=FAINT; ctx.fillText('where an open loop leaves you', L+8, y(1)-8);
    /* the curve, drawn up to k */
    ctx.strokeStyle=AMBER; ctx.lineWidth=2; ctx.beginPath();
    for(let i=0;i<=k;i++){ const px=x(i),py=y(s[i]); i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
    ctx.stroke();
    if(k>0){ ctx.fillStyle=AMBER; ctx.beginPath(); ctx.arc(x(k),y(s[k]),3.5,0,7); ctx.fill(); }
    ctx.fillStyle= mode==='off'?INKC:GRAY; ctx.font='13px Inter, sans-serif';
    ctx.fillText(mode==='off'?'no feedback: the error does not move, and confidence still accumulates'
                             :'feedback on: each cycle corrects the model that produced the choice', L, T-14);
    ctx.fillStyle=SUNK; ctx.font='12px Inter, sans-serif';
    ctx.fillText('illustrative — the shape, not a rate', R+12, B);
  }
  function frame(){ if(k<N-1) k++; draw(); raf=requestAnimationFrame(()=>setTimeout(frame,55)); }
  sl.oninput=()=>{k=0;draw();};
  fig.querySelectorAll('.ghost').forEach(b=>b.onclick=()=>{ setActive(fig,b); mode=b.dataset.m; k=0; draw(); });
  frame();
  return ()=>cancelAnimationFrame(raf);
};

/* ---------- III · aim: efficiency is indifferent to direction ----------- */
SIMS.aim = fig=>{
  const cv=fig.querySelector('canvas');
  const ctx=fitCanvas(cv,700,400);
  const W=700,H=400,cx=150,cy=H/2,len=380;
  const A={good:{deg:0,  label:'work worth doing'},
           near:{deg:22, label:'adjacent, plausible work'},
           wrong:{deg:58,label:'the wrong thing, done well'}};
  let key='good';
  function draw(){
    ctx.clearRect(0,0,W,H);
    const a=A[key], th=a.deg*Math.PI/180;
    const tx=cx+len, ty=cy;
    /* the target */
    ctx.strokeStyle=`rgba(${RGB_GRAY},0.5)`; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(tx,ty,26,0,7); ctx.stroke();
    ctx.beginPath(); ctx.arc(tx,ty,10,0,7); ctx.stroke();
    ctx.fillStyle=GRAY; ctx.font='12px Inter, sans-serif'; ctx.textAlign='center';
    ctx.fillText('work worth doing', tx, ty-40);
    /* the engine, and where it points */
    ctx.fillStyle=INKC; ctx.beginPath(); ctx.arc(cx,cy,6,0,7); ctx.fill();
    ctx.textAlign='right'; ctx.font='12px Inter, sans-serif'; ctx.fillStyle=GRAY;
    ctx.fillText('the engine', cx-14, cy+4);
    const ex=cx+len*Math.cos(th), ey=cy+len*Math.sin(th);
    ctx.strokeStyle=AMBER; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.fillStyle=AMBER; ctx.beginPath(); ctx.arc(ex,ey,4,0,7); ctx.fill();
    /* the shortfall */
    const miss=Math.hypot(ex-tx,ey-ty);
    ctx.strokeStyle=`rgba(${RGB_INK},0.35)`; ctx.setLineDash([3,3]); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(ex,ey); ctx.lineTo(tx,ty); ctx.stroke(); ctx.setLineDash([]);
    const landed=Math.max(0, Math.round(100*Math.cos(th)));
    ctx.textAlign='left'; ctx.font='13px Inter, sans-serif'; ctx.fillStyle=INKC;
    ctx.fillText(a.label, 40, 42);
    ctx.font='12px Inter, sans-serif'; ctx.fillStyle= landed>90?GRAY:AMBER;
    ctx.fillText('effort spent: the same in every case', 40, 66);
    ctx.fillStyle=SUNK;
    ctx.fillText(miss<8?'the effort lands on the target'
                       :'the same effort, and it does not arrive — nothing about this felt like failing', 40, H-30);
    ctx.fillStyle=FAINT; ctx.fillText('illustrative geometry, not a measurement', 40, H-12);
  }
  fig.querySelectorAll('.ghost').forEach(b=>b.onclick=()=>{ setActive(fig,b); key=b.dataset.m; draw(); });
  draw();
  return ()=>{};
};

/* ---------- IV · profile: the binding layer is never the tall one ------- */
SIMS.profile = fig=>{
  const cv=fig.querySelector('canvas');
  const ctx=fitCanvas(cv,700,400);
  const W=700,H=400,L=120,BW=110,GAP=64,B=H-84;
  const P={analytic:{v:[38,88,44], note:'the pattern the framework names: the Engine carries it, and the gating layers do not'},
           operator:{v:[82,58,36], note:'a firm floor and a thin aim — highly effective, and the direction goes unexamined'},
           connector:{v:[64,40,80], note:'aim and relationship are strong; the engine is what the work waits on'},
           even:{v:[66,64,68], note:'no spike, and the highest floor of the four — the ceiling is the highest here'}};
  const NAMES=['foundation','engine','direction'];
  let key='analytic';
  function draw(){
    ctx.clearRect(0,0,W,H);
    const p=P[key], cap=Math.min.apply(null,p.v);
    const scale=(B-70)/100;
    /* the ceiling the lowest layer sets */
    const cyy=B-cap*scale;
    ctx.strokeStyle=`rgba(${RGB_AMBER},0.55)`; ctx.setLineDash([5,4]); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(L-40,cyy); ctx.lineTo(W-40,cyy); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=AMBER; ctx.font='12px Inter, sans-serif'; ctx.textAlign='left';
    ctx.fillText('the ceiling this profile sets', W-238, cyy-9);
    for(let i=0;i<3;i++){
      const x=L+i*(BW+GAP), v=p.v[i], h=v*scale, binding=(v===cap);
      ctx.fillStyle= binding?`rgba(${RGB_AMBER},0.30)`:`rgba(${RGB_GRAY},0.30)`;
      ctx.fillRect(x,B-h,BW,h);
      ctx.strokeStyle= binding?AMBER:BRD; ctx.lineWidth=1; ctx.strokeRect(x,B-h,BW,h);
      ctx.textAlign='center'; ctx.font='12px Inter, sans-serif';
      ctx.fillStyle= binding?AMBER:GRAY; ctx.fillText(NAMES[i], x+BW/2, B+20);
      if(binding){ ctx.fillText('binding', x+BW/2, B+38); }
    }
    ctx.textAlign='left'; ctx.font='13px Inter, sans-serif'; ctx.fillStyle=INKC;
    ctx.fillText(p.note, 40, 34);
    ctx.font='12px Inter, sans-serif'; ctx.fillStyle=SUNK;
    ctx.fillText('schematic profiles — the framework names only the analytical one', 40, H-14);
  }
  fig.querySelectorAll('.ghost').forEach(b=>b.onclick=()=>{ setActive(fig,b); key=b.dataset.m; draw(); });
  draw();
  return ()=>{};
};

/* ---------- IV · luck: one capability, many runs ------------------------ */
SIMS.luck = fig=>{
  const cv=fig.querySelector('canvas');
  const ctx=fitCanvas(cv,700,400);
  const W=700,H=400,L=70,R=W-70,T=70,B=H-70,RUNS=160;
  const sl=fig.querySelector('input[type=range]');
  let seed=7;
  function draw(){
    ctx.clearRect(0,0,W,H);
    const luck=parseInt(sl.value,10)/100, rnd=mulberry32(seed), skill=0.62;
    const pts=[];
    for(let i=0;i<RUNS;i++){
      const noise=(rnd()+rnd()+rnd()+rnd()-2)/2;      /* smooth, seeded */
      pts.push(Math.max(0,Math.min(1, skill*(1-luck) + luck*(0.5+noise*0.5))));
    }
    ctx.strokeStyle=BRD; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(L,B); ctx.lineTo(R,B); ctx.stroke();
    /* capability, as a fixed line */
    const sx=L+(R-L)*skill;
    ctx.strokeStyle=`rgba(${RGB_GRAY},0.7)`; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(sx,T-18); ctx.lineTo(sx,B); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=GRAY; ctx.font='12px Inter, sans-serif'; ctx.textAlign='center';
    ctx.fillText('capability — fixed, all runs', sx, T-26);
    /* the outcomes */
    pts.forEach((p,i)=>{
      const x=L+(R-L)*p, y=T+((i*37)%(B-T-14))+7;
      ctx.fillStyle=`rgba(${RGB_AMBER},0.42)`;
      ctx.beginPath(); ctx.arc(x,y,2.6,0,7); ctx.fill();
    });
    const lo=Math.min.apply(null,pts), hi=Math.max.apply(null,pts);
    ctx.strokeStyle=AMBER; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(L+(R-L)*lo,B+12); ctx.lineTo(L+(R-L)*hi,B+12); ctx.stroke();
    ctx.textAlign='left'; ctx.font='12px Inter, sans-serif'; ctx.fillStyle=GRAY;
    ctx.fillText('worse', L, B+34); ctx.textAlign='right'; ctx.fillText('better', R, B+34);
    ctx.textAlign='left'; ctx.font='13px Inter, sans-serif'; ctx.fillStyle=INKC;
    ctx.fillText(luck<0.15?'a domain that returns your capability fairly directly'
                          :'the same capability — and this is the range of outcomes it produces', 40, 34);
    ctx.font='12px Inter, sans-serif'; ctx.fillStyle=SUNK;
    ctx.fillText('illustrative spread — the framework gives no numbers here', 40, H-14);
  }
  sl.oninput=draw;
  const rb=fig.querySelector('[data-a="run"]');
  if(rb) rb.onclick=()=>{ seed=(seed*1664525+1013904223)>>>0; draw(); };
  draw();
  return ()=>{};
};
