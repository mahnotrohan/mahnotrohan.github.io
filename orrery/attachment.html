const vp = document.getElementById('vp');
const world = document.getElementById('world');
const reader = document.getElementById('reader');
const WW = 2750, WH = 1750;
let cam = {s:0.12, tx:0, ty:0};
let anim = null;
function apply(){
  world.style.transform = `translate(${cam.tx}px, ${cam.ty}px) scale(${cam.s})`;
  lod();
}
function readerW(){ return reader.classList.contains('open') ? (reader.getBoundingClientRect().width||430) : 0; }
function visW(){ return innerWidth - readerW(); }
function centerOn(cx, cy, s){
  cam.s = s;
  cam.tx = visW()/2 - cx*s;
  cam.ty = innerHeight/2 - cy*s;
  apply();
}
function flyTo(cx, cy, s, dur=700){
  if (anim) cancelAnimationFrame(anim);
  const s0=cam.s, cx0=(visW()/2-cam.tx)/s0, cy0=(innerHeight/2-cam.ty)/s0;
  const ls0=Math.log(s0), ls1=Math.log(s);
  const t0=performance.now();
  function step(t){
    let p=Math.min(1,(t-t0)/dur);
    p = p<.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2;
    centerOn(cx0+(cx-cx0)*p, cy0+(cy-cy0)*p, Math.exp(ls0+(ls1-ls0)*p));
    if (p<1) anim=requestAnimationFrame(step);
  }
  anim=requestAnimationFrame(step);
}
function overviewCam(fly=true){
  const s = Math.min(visW()/WW, innerHeight/WH)*0.92;
  if (fly) flyTo(WW/2, WH/2, s, 800); else centerOn(WW/2, WH/2, s);
}
vp.addEventListener('wheel', e=>{
  e.preventDefault();
  if (anim) cancelAnimationFrame(anim);
  const f = Math.exp(-e.deltaY*0.0016);
  const s2 = Math.min(2.2, Math.max(0.06, cam.s*f));
  const wx=(e.clientX-cam.tx)/cam.s, wy=(e.clientY-cam.ty)/cam.s;
  cam.s=s2; cam.tx=e.clientX-wx*s2; cam.ty=e.clientY-wy*s2;
  apply();
}, {passive:false});
const ptrs = new Map();
let panStart=null, pinchStart=null, moved=0;
vp.addEventListener('pointerdown', e=>{
  if (e.target.closest('.tlabel')) return;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size===1){
    moved=0;
    panStart={mx:e.clientX, my:e.clientY, tx:cam.tx, ty:cam.ty};
    vp.classList.add('dragging');
  } else if (ptrs.size===2){
    const [p1,p2]=[...ptrs.values()];
    pinchStart={d:Math.hypot(p1.x-p2.x,p1.y-p2.y), s:cam.s,
      wx:((p1.x+p2.x)/2-cam.tx)/cam.s, wy:((p1.y+p2.y)/2-cam.ty)/cam.s};
    panStart=null;
  }
});
addEventListener('pointermove', e=>{
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size===1 && panStart){
    if (anim) cancelAnimationFrame(anim);
    moved += Math.abs(e.movementX||0)+Math.abs(e.movementY||0);
    cam.tx = panStart.tx + (e.clientX-panStart.mx);
    cam.ty = panStart.ty + (e.clientY-panStart.my);
    apply();
  } else if (ptrs.size===2 && pinchStart){
    if (anim) cancelAnimationFrame(anim);
    const [p1,p2]=[...ptrs.values()];
    const d=Math.hypot(p1.x-p2.x,p1.y-p2.y);
    const s2=Math.min(2.2, Math.max(0.06, pinchStart.s*d/pinchStart.d));
    const cx=(p1.x+p2.x)/2, cy=(p1.y+p2.y)/2;
    cam.s=s2; cam.tx=cx-pinchStart.wx*s2; cam.ty=cy-pinchStart.wy*s2;
    apply();
  }
});
function ptrUp(e){ ptrs.delete(e.pointerId);
  if (ptrs.size<2) pinchStart=null;
  if (ptrs.size===0){ panStart=null; vp.classList.remove('dragging'); } }
addEventListener('pointerup', ptrUp);
addEventListener('pointercancel', ptrUp);
vp.addEventListener('dblclick', e=>{
  if (!e.target.closest('.mk')){ closeReader(); overviewCam(); }
});
addEventListener('keydown', e=>{
  if (e.key==='Escape'){ closeReader(); overviewCam(); }
  if (e.key==='ArrowRight') navStep(1);
  if (e.key==='ArrowLeft') navStep(-1);
});

/* Canvas backing store follows the device pixel ratio, so canvas text stays
   crisp in the ~570px reader column. Sims still draw in logical 700-wide units. */
const _DPR = Math.max(1, Math.min(2, (typeof devicePixelRatio === 'number' ? devicePixelRatio : 1) || 1));
function fitCanvas(cv, w, h){
  cv.width = Math.round(w*_DPR); cv.height = Math.round(h*_DPR);
  const ctx = cv.getContext('2d');
  if (ctx.setTransform) ctx.setTransform(_DPR,0,0,_DPR,0,0);
  return ctx;
}
const SIMS = {};

SIMS.leash = fig=>{
  const cv=fig.querySelector('canvas');
    const ctx=fitCanvas(cv,700,360);
  const W=700,H=360,cx=250,cy=178,Dmax=205,Rmax=0.8*Dmax,sq=0.60;
  const rnd=mulberry32(11);
  let q=0.85,T=0.12,av=0,d=30,th=0.4,trail=[],raf,steps=0,far=0;
  const Rof=()=>Math.max(3, Rmax*q/(1+3*T));
  function frame(){
    const R=Rof(), beta=8/Rmax;
    const A=1/(1+Math.exp(-beta*(d-R)));
    d=Math.max(0,Math.min(Dmax, d + 0.05*Dmax*(1-A)*rnd() - 0.08*Dmax*A*(1-2*av)));
    th += 0.008 + 0.020*(1-A);
    const x=cx+d*Math.cos(th), y=cy+d*Math.sin(th)*sq;
    trail.push([x,y]); if(trail.length>300) trail.shift();
    steps++; if(d>0.5*Rmax) far++;
    ctx.fillStyle=SUNK; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle=BRD; ctx.lineWidth=1; ctx.beginPath();
    ctx.ellipse(cx,cy,Dmax,Dmax*sq,0,0,7); ctx.stroke();
    ctx.fillStyle=AMBER; ctx.globalAlpha=.06; ctx.beginPath();
    ctx.ellipse(cx,cy,R,R*sq,0,0,7); ctx.fill(); ctx.globalAlpha=1;
    ctx.strokeStyle=FAINT; ctx.setLineDash([4,5]); ctx.lineWidth=1.3; ctx.beginPath();
    ctx.ellipse(cx,cy,R,R*sq,0,0,7); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle=GRAY; ctx.globalAlpha=.30; ctx.lineWidth=1.2; ctx.beginPath();
    trail.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    ctx.stroke(); ctx.globalAlpha=1;
    ctx.fillStyle=INKC; ctx.beginPath(); ctx.arc(cx,cy,8,0,7); ctx.fill();
    ctx.fillStyle=GRAY; ctx.font='13px Inter, sans-serif';
    ctx.fillText('caregiver',cx-27,cy+24);
    ctx.fillStyle=AMBER; ctx.beginPath(); ctx.arc(x,y,6.5,0,7); ctx.fill();
    const pct=steps?Math.round(100*far/steps):0;
    ctx.fillStyle=GRAY; ctx.font='15px Inter, sans-serif';
    ctx.fillText('set-goal radius '+Math.round(R)+' of '+Math.round(Rmax)+'  ·  system activation '+A.toFixed(2),480,28);
    ctx.fillText('time spent out in the world: '+pct+'%',480,52);
    ctx.fillStyle=INKC;
    ctx.fillText(av>0.5?'contact aversive — displaced, not freed':'contact soothes',480,H-22);
    raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
  const reset=()=>{trail=[];steps=0;far=0;};
  fig.querySelectorAll('input').forEach(s=>s.oninput=()=>{
    const p=s.dataset.p, v=parseFloat(s.value);
    if(p==='q')q=v; else T=v; reset();});
  fig.querySelectorAll('.ghost').forEach(b=>b.onclick=()=>{
    setActive(fig,b); av=parseFloat(b.dataset.m); d=30; reset();});
  return ()=>cancelAnimationFrame(raf);
};

SIMS.loop = fig=>{
  const cv=fig.querySelector('canvas');
    const ctx=fitCanvas(cv,700,420);
  const W=700,H=420,PH=250,a=0.9,q=0.82,gEff=1.0,SW=0.15,xmax=2.2;
  const rnd=mulberry32(29);
  const gauss=()=>{let u=0,v=0;while(u===0)u=rnd();while(v===0)v=rnd();
    return Math.sqrt(-2*Math.log(u))*Math.cos(6.283185*v);};
  let K=0.7,th=0.30,tau=1;
  let x=0.5,ubuf=[0,0,0,0],hx=[],hu=[],n=0,sx=0,sx2=0,su=0,raf;
  const plateau=(SW*0.7979)/(1-a);
  function step(){
    const u=K*Math.max(0,x-th);
    ubuf.push(u); const del=ubuf.shift();
    const r=(rnd()<q? gEff*ubuf[Math.max(0,ubuf.length-1-tau)] : 0);
    const w=Math.abs(gauss())*SW;
    x=Math.max(0,Math.min(xmax, a*x + w - r));
    hx.push(x); hu.push(u); if(hx.length>330){hx.shift();hu.shift();}
    n++; sx+=x; sx2+=x*x; su+=u;
    void del;
  }
  function draw(){
    for(let i=0;i<2;i++) step();
    ctx.fillStyle=SUNK; ctx.fillRect(0,0,W,H);
    const y=v=>PH-4-(v/xmax)*(PH-30);
    ctx.strokeStyle=BRD; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,PH); ctx.lineTo(W,PH); ctx.stroke();
    ctx.strokeStyle=FAINT; ctx.setLineDash([3,4]);
    ctx.beginPath(); ctx.moveTo(0,y(plateau)); ctx.lineTo(W,y(plateau)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=FAINT; ctx.font='12px Inter, sans-serif';
    ctx.fillText('unbuffered plateau '+plateau.toFixed(2),8,y(plateau)-6);
    const line=(arr,col,al)=>{ctx.strokeStyle=col;ctx.globalAlpha=al;ctx.lineWidth=1.6;
      ctx.beginPath(); arr.forEach((v,i)=>{const X=i/330*W,Y=y(v);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);});
      ctx.stroke();ctx.globalAlpha=1;};
    line(hu,GRAY,.55); line(hx,AMBER,1);
    const mean=n?sx/n:0, sd=n?Math.sqrt(Math.max(0,sx2/n-mean*mean)):0, eff=n?su/n:0;
    const L=K*gEff*q;
    const divg = tau===0 ? 1+a : 1, ring = tau===0 ? a : 0.75;
    let verdict='damped — settles back quickly';
    if(L>=divg) verdict='diverging — escalating protest';
    else if(L>ring) verdict='ringing — overshoots before it settles';
    if(K<0.35||th>0.7) verdict='quiet — but parked high';
    ctx.fillStyle=INKC; ctx.font='15px Inter, sans-serif';
    ctx.fillText('mean distress '+mean.toFixed(2)+'      volatility '+sd.toFixed(2)+'      signalling effort '+eff.toFixed(2),14,PH+34);
    ctx.fillStyle=AMBER;
    ctx.fillText('loop gain '+L.toFixed(2)+' with delay '+tau+'  ·  '+verdict,14,PH+62);
    ctx.fillStyle=GRAY; ctx.font='13.5px Inter, sans-serif';
    ctx.fillText('amber = distress actually carried    gray = distress actually signalled',14,PH+92);
    ctx.fillText('anxious pays in volatility and effort. avoidant pays in a quiet, permanently elevated baseline.',14,PH+116);
    ctx.fillText('drag caregiver delay to zero without touching gain — the ringing stops.',14,PH+140);
    raf=requestAnimationFrame(draw);
  }
  raf=requestAnimationFrame(draw);
  const reset=()=>{hx=[];hu=[];n=0;sx=0;sx2=0;su=0;x=0.5;ubuf=[0,0,0,0];};
  const setS=(k,v)=>{const s=fig.querySelector('input[data-p="'+k+'"]'); if(s)s.value=v;};
  fig.querySelectorAll('input').forEach(s=>s.oninput=()=>{
    const p=s.dataset.p, v=parseFloat(s.value);
    if(p==='K')K=v; else if(p==='th')th=v; else tau=Math.round(v);
    reset();});
  fig.querySelectorAll('.ghost').forEach(b=>b.onclick=()=>{
    setActive(fig,b);
    const m=b.dataset.m;
    if(m==='secure'){K=0.7;th=0.30;tau=1;}
    if(m==='anx'){K=3.1;th=0.04;tau=2;}
    if(m==='avo'){K=0.18;th=0.82;tau=1;}
    setS('K',K); setS('th',th); setS('tau',tau); reset();});
  return ()=>cancelAnimationFrame(raf);
};

SIMS.chase = fig=>{
  const cv=fig.querySelector('canvas');
    const ctx=fitCanvas(cv,700,430);
  const W=700,H=430,PH=280,GAM=0.61,w3=1.0,K=10;
  let al=0.18,g=0,adapt=true,opp=false;
  function run(){
    let V=0,b=0,R=1,hist=[],recent=[],Rs=[],Vs=[],Hs=[],hsum=0;
    for(let t=0;t<220;t++){
      R=Math.pow(1+g,t);
      const dl=R-V; V=V+al*dl;
      recent.push(R); if(recent.length>K) recent.shift();
      const mu=recent.reduce((s,v)=>s+v,0)/recent.length;
      const sd=Math.sqrt(recent.reduce((s,v)=>s+(v-mu)*(v-mu),0)/recent.length);
      const dt=adapt? dl/(sd+0.35) : dl;
      hsum=GAM*hsum+dt;
      if(opp){ b=b+0.055*Math.max(0,dt)-0.030*b; }
      Rs.push(R); Vs.push(V); Hs.push(w3*hsum-(opp?b:0));
      hist.push(dt);
    }
    return {Rs,Vs,Hs};
  }
  function draw(){
    const {Rs,Vs,Hs}=run();
    ctx.fillStyle=SUNK; ctx.fillRect(0,0,W,H);
    const rmax=Math.max(1.2,Rs[Rs.length-1]);
    const yR=v=>PH*0.52-4-(v/rmax)*(PH*0.52-26);
    const hlo=Math.min(-0.6,...Hs), hhi=Math.max(1.2,...Hs);
    const yH=v=>PH-8-((v-hlo)/(hhi-hlo))*(PH*0.42);
    ctx.strokeStyle=BRD; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,PH*0.54); ctx.lineTo(W,PH*0.54); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,yH(0)); ctx.lineTo(W,yH(0)); ctx.stroke();
    const line=(arr,f,col,al2,dash)=>{ctx.strokeStyle=col;ctx.globalAlpha=al2;ctx.lineWidth=1.8;
      if(dash)ctx.setLineDash([3,4]);
      ctx.beginPath(); arr.forEach((v,i)=>{const X=i/219*W,Y=f(v);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);});
      ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha=1;};
    line(Rs,yR,GRAY,.85); line(Vs,yR,FAINT,.95,true); line(Hs,yH,AMBER,1);
    ctx.font='13px Inter, sans-serif';
    ctx.fillStyle=GRAY; ctx.fillText('what you get',10,16);
    ctx.fillStyle=FAINT; ctx.fillText('what you expect',108,16);
    ctx.fillStyle=AMBER; ctx.fillText('what you feel',10,yH(0)+18);
    const grew=Rs[Rs.length-1]/Rs[0];
    const hEnd=Hs[Hs.length-1], hPk=Math.max(...Hs);
    ctx.fillStyle=INKC; ctx.font='15px Inter, sans-serif';
    ctx.fillText('reward grew x'+grew.toFixed(1)+'   ·   feeling peaked at '+hPk.toFixed(2)+' and now reads '+hEnd.toFixed(2),14,PH+30);
    const need=(al*1.0/w3);
    ctx.fillStyle=AMBER;
    ctx.fillText('to hold the feeling steady, reward must keep rising by '+need.toFixed(3)+' per step — forever',14,PH+58);
    ctx.fillStyle=GRAY; ctx.font='13.5px Inter, sans-serif';
    ctx.fillText(adapt?'adaptive gain ON — gain rescales to the range you have been getting, so escalation must go geometric':'adaptive gain off — the trap is milder than reality',14,PH+88);
    ctx.fillText(opp?'opponent process ON — the baseline itself is sinking; back to normal is now below zero':'opponent process off — no baseline shift',14,PH+112);
    ctx.fillStyle=INKC;
    ctx.fillText('raise the learning rate: satisfaction gets shorter — and so would grief. Same machinery.',14,PH+140);
  }
  draw();
  fig.querySelectorAll('input').forEach(s=>s.oninput=()=>{
    const p=s.dataset.p, v=parseFloat(s.value);
    if(p==='al')al=v; else g=v; draw();});
  fig.querySelectorAll('.ghost').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;
    if(k==='adapt'){adapt=!adapt; b.classList.toggle('active',adapt);}
    else {opp=!opp; b.classList.toggle('active',opp);}
    draw();});
  return ()=>{};
};

SIMS.pic = fig=>{
  const cv=fig.querySelector('canvas');
    const ctx=fitCanvas(cv,700,420);
  const W=700,H=420,LW=372,KAP=1.0,SIG=1.6,PLO=0.2,PHI=30;
  const rnd=mulberry32(53);
  const gauss=()=>{let u=0,v=0;while(u===0)u=rnd();while(v===0)v=rnd();
    return Math.sqrt(-2*Math.log(u))*Math.cos(6.283185*v);};
  let c=0.7,pi=3,tr=[],raf;
  const clp=v=>Math.max(PLO,Math.min(PHI,(Number.isFinite(v)?v:PLO)));
  const clc=v=>Math.max(0.05,Math.min(0.88,(Number.isFinite(v)?v:0.05)));
  const ES=(p,cc)=>{const e=KAP/(p*cc*cc+KAP);
    return 0.5*p*(e*e+(1-cc)*(1-cc)*SIG*SIG)-0.5*Math.log(p);};
  const best=cc=>{let bp=PLO,bv=1e9;
    for(let i=0;i<=260;i++){const p=PLO*Math.pow(PHI/PLO,i/260),v=ES(p,cc);
      if(v<bv){bv=v;bp=p;}} return bp;};
  function frame(){
    pi=clp(pi); c=clc(c);
    const u=pi*c*1/(pi*c*c+KAP);
    const y=c*u+(1-c)*gauss()*SIG;
    tr.push(y); if(tr.length>150) tr.shift();
    ctx.fillStyle=SUNK; ctx.fillRect(0,0,W,H);
    const yy=v=>150-v*44;
    ctx.strokeStyle=AMBER; ctx.globalAlpha=.5; ctx.setLineDash([4,4]); ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.moveTo(0,yy(1)); ctx.lineTo(LW,yy(1)); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha=1;
    ctx.fillStyle=AMBER; ctx.font='12px Inter, sans-serif'; ctx.fillText('the target',6,yy(1)-7);
    ctx.strokeStyle=INKC; ctx.globalAlpha=.8; ctx.lineWidth=1.5; ctx.beginPath();
    tr.forEach((v,i)=>{const X=i/149*LW,Y=Math.max(6,Math.min(258,yy(v)));i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);});
    ctx.stroke(); ctx.globalAlpha=1;
    const pb=best(c), ratio=pi/pb;
    let badge, note;
    if(ratio>2.2){ badge = c<0.4? 'over-gripped · clinging' : 'over-gripped';
      note='you are holding it far tighter than you can move it'; }
    else if(ratio<0.45){ badge='under-gripped · premature giving-up';
      note='you could move this and are not trying'; }
    else { badge = c<0.35? 'matched · equanimity' : 'matched · effective';
      note='grip and leverage agree'; }
    ctx.fillStyle=GRAY; ctx.font='14px Inter, sans-serif';
    ctx.fillText('control '+c.toFixed(2)+'   grip '+pi.toFixed(1)+'   best grip here '+pb.toFixed(1),8,196);
    ctx.fillStyle=AMBER; ctx.font='16px Inter, sans-serif'; ctx.fillText(badge,8,222);
    ctx.fillStyle=INKC; ctx.font='13.5px Inter, sans-serif'; ctx.fillText(note,8,244);
    const X0=414,X1=688,Y0=26,Y1=250;
    let lo=1e9,hi=-1e9,pts=[];
    for(let i=0;i<=140;i++){const p=PLO*Math.pow(PHI/PLO,i/140),v=ES(p,c);
      pts.push([p,v]); if(v<lo)lo=v; if(v>hi)hi=v;}
    const px=p=>X0+(Math.log(p/PLO)/Math.log(PHI/PLO))*(X1-X0);
    const py=v=>Y1-((v-lo)/(hi-lo+1e-9))*(Y1-Y0);
    ctx.strokeStyle=BRD; ctx.lineWidth=1; ctx.beginPath();
    ctx.moveTo(X0,Y1); ctx.lineTo(X1,Y1); ctx.stroke();
    ctx.strokeStyle=GRAY; ctx.lineWidth=1.8; ctx.beginPath();
    pts.forEach((p,i)=>{const X=px(p[0]),Y=py(p[1]);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);});
    ctx.stroke();
    ctx.strokeStyle=FAINT; ctx.setLineDash([3,4]); ctx.beginPath();
    ctx.moveTo(px(pb),Y0); ctx.lineTo(px(pb),Y1); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=AMBER; ctx.beginPath(); ctx.arc(px(pi),py(ES(pi,c)),5,0,7); ctx.fill();
    ctx.fillStyle=GRAY; ctx.font='12.5px Inter, sans-serif';
    ctx.fillText('accumulated surprise vs grip',X0,18);
    ctx.fillText('loose',X0,Y1+18); ctx.fillText('tight',X1-28,Y1+18);
    ctx.fillStyle=FAINT; ctx.fillText('best',px(pb)-12,Y0+12);
    ctx.fillStyle=INKC; ctx.font='13.5px Inter, sans-serif';
    ctx.fillText('Drag control toward zero and watch the best grip slide left. Loosening is the optimum, not a concession —',14,H-44);
    ctx.fillText('and the curve rises on BOTH sides, which is the failure mode nobody warns you about.',14,H-22);
    raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
  fig.querySelectorAll('input').forEach(s=>s.oninput=()=>{
    const p=s.dataset.p, v=parseFloat(s.value);
    if(p==='c')c=v; else pi=v; tr=[];});
  fig.querySelectorAll('.ghost').forEach(b=>b.onclick=()=>{
    pi=best(c); const s=fig.querySelector('input[data-p="pi"]'); if(s)s.value=pi; tr=[];});
  return ()=>cancelAnimationFrame(raf);
};

SIMS.channels = fig=>{
  const cv=fig.querySelector('canvas');
    const ctx=fitCanvas(cv,700,400);
  const W=700,H=400,X0=14,Y0=18,S=250,ri=1.0,LO=0.05,HI=3;
  let pi=1,pe=1,re=1;
  const cl=v=>Math.max(LO,Math.min(HI,(Number.isFinite(v)?v:LO)));
  const err=(a0,b0,r0)=>{const a=cl(a0),b=cl(b0),rr=Math.max(0.02,r0||0.02);
    return Math.sqrt((a*a/ri+b*b/rr))/(a+b);};
  const gx=v=>X0+((v-LO)/(HI-LO))*S, gy=v=>Y0+S-((v-LO)/(HI-LO))*S;
  function draw(){
    ctx.fillStyle=SUNK; ctx.fillRect(0,0,W,H);
    const step=5;
    let lo=1e9,hi=-1e9;
    for(let a=LO;a<=HI;a+=(HI-LO)/50) for(let b=LO;b<=HI;b+=(HI-LO)/50){
      const e=err(a,b,re); if(e<lo)lo=e; if(e>hi)hi=e;}
    for(let sx=0;sx<S;sx+=step) for(let sy=0;sy<S;sy+=step){
      const a=LO+(sx/S)*(HI-LO), b=LO+((S-sy)/S)*(HI-LO);
      const t=(err(a,b,re)-lo)/(hi-lo+1e-9);
      ctx.fillStyle=INKC; ctx.globalAlpha=0.05+0.62*t;
      ctx.fillRect(X0+sx,Y0+sy,step,step);
    }
    ctx.globalAlpha=1;
    ctx.strokeStyle=AMBER; ctx.lineWidth=2; ctx.globalAlpha=.85;
    ctx.beginPath();
    const slope=ri/Math.max(0.02,re||0.02);
    if(slope>=1){ ctx.moveTo(gx(LO),gy(LO)); ctx.lineTo(gx(Math.min(HI,HI/slope)),gy(Math.min(HI,HI/slope)*slope)); }
    else { ctx.moveTo(gx(LO),gy(LO)); ctx.lineTo(gx(HI),gy(HI*slope)); }
    ctx.stroke(); ctx.globalAlpha=1;
    ctx.strokeStyle=BRD; ctx.lineWidth=1; ctx.strokeRect(X0,Y0,S,S);
    ctx.fillStyle=AMBER; ctx.beginPath(); ctx.arc(gx(cl(pi)),gy(cl(pe)),6,0,7); ctx.fill();
    ctx.fillStyle=GRAY; ctx.font='12.5px Inter, sans-serif';
    ctx.fillText('weight on your interior',X0+56,Y0+S+18);
    ctx.save(); ctx.translate(X0-2,Y0+S-56); ctx.rotate(-1.5708);
    ctx.fillText('weight on their cues',0,0); ctx.restore();
    ctx.fillStyle=AMBER; ctx.font='12.5px Inter, sans-serif';
    ctx.fillText('the correctly-weighted ray',X0+8,Y0+14);
    const X2=306,S2=250;
    let plo=1e9,phi=-1e9,pts=[];
    for(let i=0;i<=140;i++){const b=LO+(i/140)*(HI-LO), e=err(pi,b,re);
      pts.push([b,e]); if(e<plo)plo=e; if(e>phi)phi=e;}
    const qx=b=>X2+((b-LO)/(HI-LO))*(W-X2-20), qy=e=>Y0+S2-((e-plo)/(phi-plo+1e-9))*(S2-20);
    ctx.strokeStyle=BRD; ctx.lineWidth=1; ctx.beginPath();
    ctx.moveTo(X2,Y0+S2); ctx.lineTo(W-20,Y0+S2); ctx.stroke();
    ctx.strokeStyle=GRAY; ctx.lineWidth=1.8; ctx.beginPath();
    pts.forEach((p,i)=>{const X=qx(p[0]),Y=qy(p[1]);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);});
    ctx.stroke();
    let bb=LO,bv=1e9; pts.forEach(p=>{if(p[1]<bv){bv=p[1];bb=p[0];}});
    ctx.strokeStyle=FAINT; ctx.setLineDash([3,4]); ctx.beginPath();
    ctx.moveTo(qx(bb),Y0); ctx.lineTo(qx(bb),Y0+S2); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=AMBER; ctx.beginPath(); ctx.arc(qx(cl(pe)),qy(err(pi,cl(pe),re)),5,0,7); ctx.fill();
    ctx.fillStyle=GRAY; ctx.font='12.5px Inter, sans-serif';
    ctx.fillText('error as you watch them harder',X2,Y0+10);
    ctx.fillText('best weight '+bb.toFixed(2),qx(bb)+6,Y0+26);
    ctx.fillStyle=INKC; ctx.font='14px Inter, sans-serif';
    ctx.fillText('error now '+err(pi,pe,re).toFixed(3)+'   ·   best achievable '+bv.toFixed(3),X2,Y0+S2+26);
    ctx.fillStyle=GRAY; ctx.font='13.5px Inter, sans-serif';
    ctx.fillText(re<0.5?'they are hard to read — watching harder now makes your estimate WORSE'
      :'they are readable — extra attention pays here',X2,Y0+S2+50);
    ctx.fillStyle=INKC; ctx.font='13.5px Inter, sans-serif';
    ctx.fillText('Only the ratio matters, so the valley is a ray: caring more overall cannot fix a miscalibration.',14,H-16);
  }
  draw();
  const setS=(k,v)=>{const s=fig.querySelector('input[data-p="'+k+'"]'); if(s)s.value=v;};
  fig.querySelectorAll('input').forEach(s=>s.oninput=()=>{
    const p=s.dataset.p, v=parseFloat(s.value);
    if(p==='pi')pi=v; else if(p==='pe')pe=v; else re=v; draw();});
  fig.querySelectorAll('.ghost').forEach(b=>b.onclick=()=>{
    const a=b.dataset.a;
    if(a==='A'){pi=0.22;pe=0.9;re=0.9;}
    if(a==='C'){pi=2.4;pe=2.7;re=0.22;}
    if(a==='S'){re=0.9;pi=1.0;pe=0.9;}
    setS('pi',pi); setS('pe',pe); setS('re',re); draw();});
  return ()=>{};
};
