<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
/* Theme is shared with the main site: same origin, same localStorage key. */
(function(){try{var t=localStorage.getItem('theme');
if(!t)t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t);}
catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<title>First Principles Thinking - Orrery</title>
<style>
:root{
  /* site parity: --ground/--surface-* mirror the main site's --bg/--bg-2/--chip */
  --ground:#fbf8f3; --surface-sunk:#f2ede4; --surface-raised:#fdfcf9;
  --border:#e3dccf; --border-strong:#d2c8b5;
  --ink:#211f1c; --ink-strong:#14120f; --ink-muted:#5c5751; --ink-faint:#8c867f;
  --accent:#8f6220; --accent-dim:#c2a47c; --accent-wash:rgba(143,98,32,0.08);
  --accent-rgb:143,98,32;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --r:4px; --reader-w:min(760px, 58vw); --move-fast:150ms ease;
  --ink-body:#2b2823; --ink-soft:#332f29;
  --hdr-fade:linear-gradient(180deg, rgba(251,248,243,.96), rgba(251,248,243,.75), transparent);
  --vp-bg:radial-gradient(ellipse at 50% 40%, #fdfbf7 0%, #fbf8f3 55%, #f2ede4 100%);
  --btn-bg:rgba(253,252,249,.92);
  --line-soft:rgba(33,31,28,0.10); --line-flow:rgba(143,98,32,0.45);
  --sim-ink:#3a352e; --sim-gray:#8c867f; --sim-faint:#b3ac9f;
  --sim-amber:#8f6220; --sim-sunk:#f2ede4; --sim-brd:#ddd4c3;
  --grid-1:rgba(110,95,65,.13); --grid-2:rgba(110,95,65,.07);
  --shadow:rgba(90,75,50,.16);
}

/* Night sky, sharing the main site's dark surfaces exactly. */
html[data-theme="dark"]{
  --ground:#1a1a1a; --surface-sunk:#232322; --surface-raised:#262523;
  --border:#2e2e2e; --border-strong:#3e3e3b;
  --ink:#e8e6e3; --ink-strong:#f5f3f0; --ink-muted:#a5a09a; --ink-faint:#7d7873;
  --accent:#d9a25e; --accent-dim:#8b6c41; --accent-wash:rgba(217,162,94,0.10);
  --accent-rgb:217,162,94;
  --ink-body:#dddad5; --ink-soft:#d3cfc9;
  --hdr-fade:linear-gradient(180deg, rgba(26,26,26,.96), rgba(26,26,26,.75), transparent);
  --vp-bg:radial-gradient(ellipse at 50% 40%, #202020 0%, #1a1a1a 55%, #141414 100%);
  --btn-bg:rgba(38,37,35,.92);
  --line-soft:rgba(232,230,227,0.10); --line-flow:rgba(217,162,94,0.45);
  --sim-ink:#e8e6e3; --sim-gray:#9d988f; --sim-faint:#6b6660;
  --sim-amber:#d9a25e; --sim-sunk:#232322; --sim-brd:#393936;
  --grid-1:rgba(210,203,190,.09); --grid-2:rgba(210,203,190,.045);
  --shadow:rgba(0,0,0,.5);
}
html{color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%; overflow:hidden; background:var(--ground); color:var(--ink);
  font-family:var(--font); font-size:15.5px; line-height:1.75; overscroll-behavior:none;}
h1,h2,h3{color:var(--ink-strong); font-weight:600; line-height:1.3;}
.kicker{font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-muted); font-weight:500;}

/* header - all navigation lives top right */
#hdr{position:fixed; top:0; left:0; right:0; z-index:40; height:56px;
  display:flex; align-items:center; gap:1.1rem; padding:0 1.4rem;
  background:var(--hdr-fade);
  pointer-events:none; transition:right .3s cubic-bezier(.25,.7,.3,1);}
body.reader-open #hdr{right:var(--reader-w);}
#hdr>*{pointer-events:auto;}
#hdr .t{font-size:15px; font-weight:600; color:var(--ink-strong);}
#hdr .sub{font-size:11.5px; color:var(--ink-muted);}
#hdr .spacer{flex:1;}
#count{font-size:12px; color:var(--ink-faint); white-space:nowrap;}
.hbtn{background:var(--btn-bg); border:1px solid var(--border-strong); color:var(--ink-muted);
  font-family:var(--font); font-size:12.5px; padding:6px 13px; border-radius:var(--r); cursor:pointer;
  transition:all var(--move-fast); white-space:nowrap;}
.hbtn:hover{color:var(--ink); border-color:var(--ink-muted);}
.hbtn:disabled{opacity:.35; cursor:default;}
#navcluster{display:flex; align-items:center; gap:10px; opacity:0; pointer-events:none; transition:opacity .2s ease;
  background:var(--surface-sunk); border:1px solid var(--border-strong); border-radius:8px; padding:3px 6px;}
#navcluster.on{opacity:1; pointer-events:auto;}
#navcluster .hbtn{background:none; border:none; font-size:24px; font-weight:300; color:var(--ink-faint); padding:0 6px; line-height:1;}
#navcluster .hbtn:hover{color:var(--ink-muted);}
#navcluster .hbtn:disabled{opacity:.25;}

/* viewport & sky */
#vp{position:fixed; inset:0; cursor:grab; touch-action:none;
  background:var(--vp-bg);}
#vp.dragging{cursor:grabbing;}
#vp.dragging, #vp.dragging *{user-select:none;}
#world{position:absolute; top:0; left:0; width:2750px; height:1750px;
  transform-origin:0 0; will-change:transform;}
#world::before{content:''; position:absolute; inset:0; pointer-events:none;
  background-image:radial-gradient(circle, var(--grid-1) 1.2px, transparent 1.2px),
                   radial-gradient(circle, var(--grid-2) 1px, transparent 1px);
  background-size:380px 380px, 150px 150px;
  background-position:0 0, 70px 100px; opacity:.8;}

/* constellation names */
.tlab{position:absolute; pointer-events:auto; cursor:pointer; user-select:none; text-align:center;}
.tlab .big{font-size:40px; font-weight:500; letter-spacing:.5em; line-height:1.3;
  text-transform:uppercase; white-space:nowrap;}
.tlab .sum{text-shadow:0 0 5px var(--ground),0 0 5px var(--ground),0 0 3px var(--ground);
  font-size:19px; color:var(--ink-muted); margin-top:.5em; letter-spacing:.18em; text-transform:uppercase;}
.tlab:hover .big{filter:brightness(1.35);}
.tlab.core .big{font-size:19px; letter-spacing:.26em;}
.tlab.core .sum{font-size:9px; letter-spacing:.14em;}
.tlab.core .big{text-shadow:0 0 6px var(--ground),0 0 6px var(--ground),0 0 3px var(--ground);}
.mk.coredot{width:auto; gap:0;}
.mk.coredot .dot{box-shadow:0 0 0 3px rgba(var(--accent-rgb),0.14);}

/* stars */
.mk{position:absolute; cursor:pointer; user-select:none;
  display:flex; gap:14px; width:330px; align-items:flex-start;}
.mk .dot{border-radius:50%; flex-shrink:0;
  transition:transform .2s ease, box-shadow .4s ease, opacity .4s ease, background .4s ease;}
.mk:hover .dot{transform:scale(1.3);}
.mk .dtext{min-width:0; padding-top:1px;}
.mk .lbl{text-shadow:0 0 5px var(--ground),0 0 5px var(--ground),0 0 3px var(--ground),0 0 3px var(--ground);
  font-size:19px; color:var(--ink); font-weight:500; line-height:1.3;}
.mk .lbl .seq{font-size:12px; color:var(--ink-faint); font-weight:400; margin-right:.5em;}
.mk .ess{text-shadow:0 0 5px var(--ground),0 0 5px var(--ground),0 0 3px var(--ground),0 0 3px var(--ground);
  font-size:14px; color:var(--ink-muted); line-height:1.45; margin-top:4px; max-width:290px;
  opacity:0; transition:opacity .3s ease;}
.mk.showess .ess{opacity:1;}
.mk .sims-badge{font-size:12px; color:var(--accent-dim); margin-top:3px; display:none;}
.mk.hasim .sims-badge{display:block;}
.mk.focused .dot{transform:scale(1.35);}
.mk.focused .lbl{color:var(--ink-strong);}
.mk.neighbor .lbl{color:var(--ink-strong);}
.mk.dimmed{opacity:.35;}

/* connection overlay - few, directional, labeled plainly */
#tsvg, #astsvg, #flowsvg{position:absolute; top:0; left:0; pointer-events:none; overflow:visible;}
@keyframes dashdrift{to{stroke-dashoffset:-64;}}
.tline{animation:dashdrift 6s linear infinite;}
.tlabel{position:absolute; transform:translate(-50%,-50%); background:var(--ground);
  border:1px solid var(--accent-dim); color:var(--accent); border-radius:12px;
  font-size:12px; letter-spacing:.06em; padding:2px 11px; white-space:nowrap; cursor:pointer;
  pointer-events:auto; transition:background var(--move-fast); text-transform:uppercase;}
.tlabel:hover{background:var(--accent-wash);}

/* ---------- READER ---------- */
#reader{position:fixed; top:0; right:calc(-1 * var(--reader-w) - 20px); width:var(--reader-w);
  height:100%; z-index:45; background:var(--surface-raised);
  border-left:1px solid var(--border); display:flex; flex-direction:column;
  transition:right .3s cubic-bezier(.25,.7,.3,1);
  box-shadow:-24px 0 70px var(--shadow);}
#reader.open{right:0;}
#reader .top{padding:1.5em 2.2em 1em; border-bottom:1px solid var(--border); position:relative;}
#reader .close{position:absolute; top:14px; right:16px; background:none; border:none;
  color:var(--ink-faint); font-size:18px; cursor:pointer;}
#reader .close:hover{color:var(--ink);}
#reader h2{font-size:24px; margin:.45em 0 .3em;}
#reader .terrline{font-size:11.5px; color:var(--ink-faint); margin-top:2px;}
#rbody{flex:1; overflow-y:auto; padding:1.6em 2.2em 2.5em;}
#rbody::-webkit-scrollbar{width:6px;}
#rbody::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:3px;}
#rbody>*{max-width:66ch;}
.hook{font-size:18.5px; color:var(--ink-strong); line-height:1.65;
  padding-left:1em; border-left:2px solid var(--accent-dim); margin-bottom:1.1em;}
.story{font-size:15.5px; color:var(--ink-body);}
.typechip{display:inline-block; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-muted); border:1px solid var(--border-strong); border-radius:3px; padding:1px 8px;}
details.fold{margin:1.2em 0 0; border:1px solid var(--border); border-radius:var(--r); background:var(--surface-sunk);}
details.fold summary{cursor:pointer; padding:.6em 1.05em; color:var(--ink-muted);
  font-size:13px; list-style:none; user-select:none;}
details.fold summary::-webkit-details-marker{display:none;}
details.fold summary::before{content:'+  '; color:var(--accent); font-weight:500;}
details.fold[open] summary::before{content:'−  ';}
details.fold summary:hover{color:var(--ink);}
details.fold .inner{padding:0 1.05em .9em; font-size:14.5px; color:var(--ink-soft);}
.named{margin-top:1.5em; background:var(--surface-sunk); border:1px solid var(--border);
  border-radius:8px; padding:1em 1.3em;}
.named .kicker{display:block; margin-bottom:.35em;}
.named b{color:var(--ink-strong); font-weight:600; font-size:16px;}
.named .def{font-size:14.5px; color:var(--ink-soft); margin-top:.2em;}
.sowhat{margin-top:1.4em; font-size:15px; color:var(--ink-body);}
.sowhat .kicker{display:block; margin-bottom:.3em;}
.closure{margin-top:1.5em; border:1px solid var(--accent-dim); border-radius:8px;
  background:var(--accent-wash); padding:1em 1.3em;}
.closure .kicker{color:var(--accent); display:block; margin-bottom:.3em;}
.closure .txt{font-size:14.5px; color:var(--ink-body); line-height:1.65;}
.linkrow{margin-top:1.6em; border-top:1px solid var(--border); padding-top:1em;
  display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:.6em 2em;}
.lgroup .kicker{display:block; margin-bottom:.25em;}
.lgroup a{display:block; font-size:14px; padding:.2em 0 .45em; color:var(--ink-soft); cursor:pointer; text-decoration:none;}
.lgroup a .t{border-bottom:1px dotted transparent; transition:border-color var(--move-fast); color:var(--ink);}
.lgroup a:hover .t{border-bottom-color:var(--accent);}
.lgroup a .why{display:block; font-size:12px; color:var(--ink-faint); line-height:1.5;}
.nextbtn{margin-top:1.8em; width:100%; max-width:66ch; text-align:left;
  background:var(--surface-sunk); border:1px solid var(--border-strong); border-radius:8px;
  color:var(--ink); font-family:var(--font); font-size:14.5px; padding:.9em 1.3em; cursor:pointer;
  transition:all var(--move-fast);}
.nextbtn:hover{border-color:var(--accent-dim); background:var(--accent-wash);}
.nextbtn .k{color:var(--ink-faint); font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  display:block; margin-bottom:.15em;}
.nextbtn .arr{color:var(--accent); float:right;}

/* sim figure */
figure.frame{background:var(--surface-sunk); border:1px solid var(--border); border-radius:var(--r);
  margin:1.3em 0 0; overflow:hidden;}
figure.frame canvas{width:100%; display:block;}
figure.frame .controls{display:flex; gap:8px; padding:8px 12px; border-top:1px solid var(--border);
  align-items:center; flex-wrap:wrap;}
figure.frame .controls .cl{font-size:11.5px; color:var(--ink-faint);}
figure.frame figcaption{padding:7px 13px 10px; font-size:12.5px; color:var(--ink-muted); line-height:1.55;}
.ghost{background:none; border:1px solid var(--border-strong); color:var(--ink-muted);
  font-family:var(--font); font-size:12px; padding:3px 11px; border-radius:var(--r); cursor:pointer;
  transition:all var(--move-fast);}
.ghost:hover{color:var(--ink); border-color:var(--ink-muted);}
.ghost.active{color:var(--accent); border-color:var(--accent-dim); background:var(--accent-wash);}
figure.frame input[type=range]{flex:1; min-width:100px; accent-color:var(--accent);}

@media(max-width:760px){ :root{--reader-w:100vw;} }

/* ---- site exits + chart switcher (present on every chart) ---- */
#hdr .sub a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
#hdr .sub a:hover{border-bottom-color:var(--accent)}
#hdr .sub s{text-decoration:none;color:var(--ink-faint);opacity:.75;margin:0 4px}
#chartSwitch{-webkit-appearance:none;appearance:none;padding-right:26px;max-width:190px;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-muted) 50%),
                   linear-gradient(135deg,var(--ink-muted) 50%,transparent 50%);
  background-position:calc(100% - 14px) 52%,calc(100% - 9.5px) 52%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
#chartSwitch:hover{color:var(--ink-strong);border-color:var(--accent-dim)}
@media (max-width:700px){#hdr .sub{font-size:10.5px}#chartSwitch{max-width:118px}}

/* ---- reader footer: step nav lives bottom-right, inside the panel ---- */
#rfoot{display:flex;align-items:center;justify-content:flex-end;gap:.75rem;
  padding:.5rem 2.2em .6rem;border-top:1px solid var(--border);
  background:var(--surface-raised);flex:none;border-top-color:transparent}
#rfoot:has(#navcluster.on){border-top-color:var(--border)}
#reader #navcluster{background:var(--surface-sunk);border:1px solid var(--border);
  border-radius:8px;padding:1px 5px}
/* Forward affordance sits on the right edge, where the thumb already is.
   Needs #rbody> to beat the (1,0,0) of `#rbody > *`. */
#rbody>.nextbtn{width:auto;min-width:min(100%,24ch);max-width:min(100%,44ch);
  margin-left:auto;margin-right:0;display:block}
@media (max-width:700px){
  #rfoot{padding:.45rem 1.2em .55rem}
  #rbody>.nextbtn{max-width:100%}
}

/* ---- theming: lines, discs, marker, toggle ---- */
.lnk-base{stroke:var(--line-soft)}
.lnk-flow{stroke:var(--line-flow)}
.disc-bg{fill:var(--surface-sunk)}
#tsvg marker path{fill:var(--accent)}
/* band hues are mid-tone and kept in both themes; lift them on dark ground */
html[data-theme="dark"] #tsvg line,
html[data-theme="dark"] #astsvg line{stroke-opacity:.55}
#themeBtn{font-size:14px;line-height:1;padding:5px 11px}
</style>
</head>

<script>
'use strict';

let INKC, GRAY, FAINT, AMBER, SUNK, BRD;
let RGB_INK, RGB_GRAY, RGB_FAINT, RGB_AMBER;
/* Canvas takes no var(), so pull the resolved values and refresh on theme flip.
   Animated sims pick these up on their next frame; the open one is remounted. */
function syncSimColours(){
  const cs = getComputedStyle(document.documentElement);
  const v = n => cs.getPropertyValue(n).trim();
  const trip = h => { h = h.replace('#','').trim();
    if (h.length === 3) h = h.split('').map(c=>c+c).join('');
    return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)).join(','); };
  INKC=v('--sim-ink'); GRAY=v('--sim-gray'); FAINT=v('--sim-faint');
  AMBER=v('--sim-amber'); SUNK=v('--sim-sunk'); BRD=v('--sim-brd');
  RGB_INK=trip(INKC); RGB_GRAY=trip(GRAY); RGB_FAINT=trip(FAINT); RGB_AMBER=trip(AMBER);
}
syncSimColours();

/* ============================================================
   CONTENT v2 - every idea: hook → story → (sim) → mechanism
   fold → the idea named → where it bites → you can now explain.
   Connections: ≤4 per idea, in three plain buckets.
   ============================================================ */
const N = {

a1:{type:"axiom", title:"Most thinking is borrowed", x:1259, y:512,
  ess:"You almost never reason from scratch - you pattern-match to something seen before.",
  hook:"Think of the last problem you solved. Did you actually reason it out - or recognize it and reach for a known answer?",
  story:"When you think about how to solve a problem, you're almost never reasoning from scratch. You're pattern-matching to something you've seen before - a solution someone else used, a convention that exists, an assumption you absorbed without questioning.",
  mech:"The default runs in three beats: see a problem, recall a solution, apply it. It works because most problems do resemble old ones. The cost is subtle: the answers were concluded by someone else, somewhere else, and you inherit them conclusions-first - reasoning not included.",
  term:"Borrowed thinking", def:"solving by pattern-match to inherited solutions, conventions, and absorbed assumptions.",
  sowhat:"Every default you operate on - how meetings run, what a product 'must' have, what a career path looks like - arrived this way. Knowing that is the door into everything else on this chart.",
  explain:"why 'thinking hard' and 'reasoning from scratch' are usually two different activities.",
  builds:[], leads:[["b1-laplace","the loop, caught in the act"]], live:[["b1-pendulum","trace one belief to its source"]]},

a2:{type:"axiom", title:"Assumptions are invisible", x:1057, y:627,
  ess:"Your assumptions don't feel like assumptions. They feel like reality.",
  hook:"Quick - name three assumptions you're making about your current biggest problem. Struggling? That's the point.",
  story:"Most assumptions are invisible to you: they don't announce themselves. The way a problem is framed, the options you think you have, the constraints you think are fixed - most of these are inherited, not discovered.",
  mech:"An assumption you can recognize as an assumption is already half-examined. The dangerous ones wear reality's clothes - they were absorbed, not chosen, so there's no moment of decision to remember. That's why the obstacle to this practice isn't intelligence.",
  term:"Invisible assumptions", def:"inherited beliefs that present themselves as plain reality rather than as claims.",
  sowhat:"You can't examine what you can't see. Every tool on this chart is ultimately a trick for making the invisible visible.",
  explain:"why the hard part of questioning your assumptions is finding them at all.",
  builds:[], leads:[["b3-contingency","why the obvious is the trap"]], live:[]},

a3:{type:"axiom", title:"Bedrock exists", x:1462, y:627,
  ess:"Some things are true regardless of convention, opinion, or tradition.",
  hook:"Underneath every 'that's how it's done' - is there anything that would stay true if everyone stopped believing it?",
  story:"Yes - and that's what makes the whole practice possible. Keep breaking a claim down and eventually you hit something that cannot be broken down further: true regardless of convention, opinion, or tradition. That's a first principle. A bedrock fact.",
  mech:"The test is independence: a convention holds because people keep honoring it; a bedrock fact holds whether or not anyone does. A law of physics passes the test; 'how things have always been done' fails it. Decomposition works because this floor exists - the questioning isn't infinite.",
  term:"First principle", def:"a fact that cannot be broken down further and holds independent of convention, opinion, or tradition.",
  sowhat:"This is what you're drilling toward every time you decompose. If nothing were irreducibly true, questioning everything would just be vertigo.",
  explain:"what qualifies as bedrock - and what merely feels like it.",

a4:{type:"axiom", title:"Understanding can be rebuilt", x:1259, y:771,
  ess:"You're not stuck with inherited conclusions - ground-up reconstruction is available.",
  hook:"If you cleared away everything you merely absorbed, could you actually build your understanding back?",
  story:"You can. From bedrock facts you can build back up toward your problem without reaching for the conventional solution - asking instead: given only what I know to be true, what would I actually build? First principles thinking is exactly this practice: going underneath the borrowed conclusions to find what's actually, irreducibly true, then rebuilding your understanding from there.",
  mech:"Reconstruction is a separate act from demolition - decomposing tells you what's true, not what to do. The rebuild starts from the floor the decomposition found and takes nothing else on board. That refusal to re-borrow is what makes the output yours.",
  term:"Rebuildability", def:"understanding can be reconstructed from verified ground instead of inherited whole.",
  sowhat:"This is the hopeful half of the practice: borrowed thinking isn't a life sentence. Section IV is about what the rebuilding produces.",
  explain:"why finding bedrock is only half the practice - and what the other half is.",
  builds:[], leads:[["b2-tension-random","the rebuilding move, in full"]], live:[]},

"b1-laplace":{type:"phenomenon", title:"The default loop", x:404, y:355,
  ess:"See a problem → recall a solution → apply it.",
  hook:"What actually happens in your head in the three seconds after you meet a new problem?",
  story:"Mostly this: see a problem → recall a solution → apply it. A solution someone else used, a convention that exists, an assumption absorbed without questioning - recognition doing the work that reasoning appears to do.",
  mech:"The loop starts at the solution layer: it searches memory for a matching answer rather than the problem for its actual structure. That's why it's fast - and why it can only ever return something that already exists. Everyone else starts at the solution layer too, which is why conventional answers converge.",
  term:"The recall loop", def:"see → recall → apply: solving by retrieval from the existing stock of answers.",
  sowhat:"Watch yourself in your next meeting: how many 'decisions' are actually retrievals? The loop isn't wrong - it's just the only mode most thinking ever uses.",
  explain:"what the default mode of thinking is actually doing under the hood.",
  builds:[["a1","the borrowing it runs on"]], leads:[["b1-sensitive","why brains default to it"]], live:[["b1-pendulum","trace a recalled belief back"]]},

"b1-pendulum":{type:"simulation", title:"Trace a belief back", sim:"trace", x:884, y:309,
  ess:"Follow one inherited belief upstream and count the verifications. Often: zero.",
  hook:"Pick any belief you hold about how your work must be done. Where did it actually come from?",
  story:"Trace it below. A typical belief passes to you from a person, who got it from a convention, which froze around someone's constraint years ago - a constraint that may no longer exist. Often, at no link in the chain did anyone stop and verify.",
  mech:"Transmission and verification are different operations, and chains like this run purely on transmission. Each hop felt reasonable - people repeat what worked around them. But 'plausibly repeated many times' and 'checked once' never add up to the same thing, no matter how long the chain gets.",
  term:"The inheritance chain", def:"the unverified path a belief travels before arriving in your head as 'reality'.",
  sowhat:"The older and more widely shared a practice, the longer its chain - and the more certain everyone feels. Certainty grows with repetition, not verification - the two can come entirely apart.",
  explain:"why a belief can be universally held and still never once checked.",
  builds:[["b1-laplace","where recalled answers come from"]], leads:[["b1-lorenz-story","what else arrives this way"]], live:[]},

"b1-sensitive":{type:"mechanism", title:"Efficiency, not laziness", x:520, y:522,
  ess:"Borrowing isn't a character flaw - it's how brains are efficient.",
  hook:"If pattern-matching is such a trap, why did your brain make it the default?",
  story:"Because it's not laziness - it's how brains are efficient. Reasoning everything from scratch would make crossing the street a research project; caching other people's conclusions lets you act at the speed life demands.",
  mech:"A cache is only as good as its entries, and this one stores conclusions without their justifications. So the efficiency comes with a permanent trade: speed now, in exchange for constantly operating inside other people's conclusions. The practice isn't to stop caching - it's to know when to bypass the cache.",
  term:"Cognitive caching", def:"the brain's efficiency strategy of reusing stored conclusions instead of re-deriving them.",
  sowhat:"You couldn't first-principle everything even if you tried - the cache is how you get dressed in the morning. The skill is choosing when to bypass it.",
  explain:"why the borrowed mind is a feature with a cost, not a bug to be ashamed of.",
  builds:[["b1-laplace","what the loop optimizes for"]], leads:[["b1-lorenz-story","the deepest thing in the cache"]], live:[]},

"b1-lorenz-story":{type:"story", title:"Other people's conclusions", x:254, y:656,
  ess:"Frames, options, constraints - you inherited more than answers.",
  hook:"When you 'consider your options', who decided what the options were?",
  story:"Usually not you. The way a problem is framed, the options you think you have, the constraints you think are fixed - most of these are inherited, not discovered. Borrowing doesn't just hand you answers; it hands you the entire shape of the question.",
  mech:"This is why the trap runs deeper than 'received wisdom'. A borrowed answer can be rejected; a borrowed frame decides what's visible before deliberation even starts. You can reason with perfect rigor inside a frame someone else drew and never notice the drawing.",
  term:"Inherited framing", def:"the borrowed problem-shape - frame, options, constraints - that thinking happens inside.",
  sowhat:"When every option on the table feels bad, the likeliest culprit is the table. Ask who built it.",
  explain:"how you can inherit the question itself, not just the answer.",
  builds:[["b1-sensitive","cached at the deepest layer"]], leads:[["b1-principle","the section's takeaway"]], live:[]},

"b1-principle":{type:"principle", title:"You live inside inherited conclusions", x:716, y:679,
  ess:"Until examined, your thinking runs on other people's conclusions.",
  hook:"If your answers, frames, and constraints all arrived by inheritance - how much of your thinking is yours?",
  story:"Less than it feels like. None of this is a moral failing - the borrowing is efficient and mostly serves you. But it means that by default you're constantly operating inside other people's conclusions, reasoning downstream of decisions you never saw being made.",
  mech:"Follow the chain: thinking defaults to recall (the loop), recall runs on a cache (efficiency), and the cache stores frames as well as answers (inherited framing). The conclusion isn't that borrowed thinking is bad - it's that it's invisible, ubiquitous, and yours to interrupt deliberately.",
  term:"Operating inside conclusions", def:"the default condition: reasoning within frames and answers concluded by others.",
  sowhat:"The practice begins with one interrupt: noticing, on a decision that matters, that you're standing in someone else's conclusion - and choosing to go underneath it.",
  explain:"the honest starting position: what your mind is doing before any method is applied.",
  builds:[["b1-lorenz-story","the deepest borrowing"]], leads:[["b2-attractors","the move that goes underneath"]], live:[]},

"b2-logistic":{type:"simulation", title:"The drill, live", sim:"drill", x:1837, y:233,

"b2-attractors":{type:"mechanism", title:"Move 1: Decompose", x:2069, y:401,
  ess:"Ask 'what am I assuming that I haven't verified?' - then ask it of the answer.",
  hook:"What happens if you ask 'what am I assuming here?' - and then ask it again about your own answer, and again?",
  story:"You descend. Take whatever you're looking at and ask: what am I assuming here that I haven't verified? Then ask it again about the answer. Keep going until you hit something that cannot be broken down further.",
  mech:"The recursion is the whole trick - one round of questioning just swaps an assumption for a slightly deeper one. Repetition is what turns doubting into drilling. And the stop condition is precise: you halt only at something true regardless of convention, opinion, or tradition.",

  sowhat:"On your next real decision, run three rounds. Most people have never asked the question even twice in a row about the same belief.",

"b2-lorenz-attractor":{type:"mechanism", title:"Hitting bedrock", x:2300, y:282,
  ess:"The floor: a fact that survives every 'how do I know?'",
  hook:"How do you know when to stop questioning?",
  story:"When the answer stops giving way. Bedrock is the claim that cannot be broken down further - true regardless of convention, opinion, or tradition. Not 'everyone agrees' (that's convention), not 'it's always been so' (that's tradition): true on its own.",
  mech:"Each round of decomposition either exposes a deeper assumption or fails to - and the failure is the signal. When 'how do I know that's true?' returns verification instead of another inherited layer, you've reached a first principle and the descent is over.",
  term:"Bedrock fact", def:"the irreducible, convention-independent claim where decomposition halts.",
  sowhat:"Beware false floors: 'industry standard', 'best practice', and 'obviously' all feel like bedrock and are exactly not.",
  explain:"the stop condition of the descent - and the imposters that end it too early.",
  builds:[["a3","the floor's existence"]], leads:[["b2-tension-random","now build on it"]], live:[]},

"b2-tension-random":{type:"mechanism", title:"Move 2: Reconstruct", x:2392, y:470,
  ess:"Given only what I know to be true - what would I actually build?",
  hook:"You've stripped a problem to bedrock. What stops you from just grabbing the conventional solution on the way back up?",
  story:"Only discipline. The second move is to build back up from those bedrock facts toward your problem - and not reach for the conventional solution. The governing question: given only what I know to be true, what would I actually build here?",
  mech:"'Only' is the operative word - the rebuild admits verified facts and nothing else, or the decomposition was theater. The two moves are inseparable: decompose without reconstructing and you've merely criticized; reconstruct without decomposing and you've merely redecorated the convention.",
  term:"Reconstruction", def:"building the answer up from bedrock alone, refusing to re-borrow on the way.",
  sowhat:"The re-borrowing urge is strongest right here - the conventional answer is familiar and defensible. Expect the pull; refuse it.",

"b2-principle":{type:"principle", title:"Strip down. Build up. Don't borrow.", x:1895, y:598,
  ess:"The whole method: strip to bedrock, rebuild without borrowing.",
  hook:"Could a practice this powerful really have just two moves?",
  story:"It has exactly two. Strip down to bedrock; build back up without borrowing. Everything else - the suspicion of the obvious, the verifying question, the strange results - is technique in service of those two moves.",
  mech:"The moves are jointly necessary: decomposition supplies true ground (otherwise you rebuild on sand), reconstruction supplies the new answer (otherwise you've only excavated). Two moves, one integrity condition - nothing unverified survives the round trip.",
  term:"First principles thinking", def:"going underneath borrowed conclusions to what's irreducibly true, and rebuilding understanding from there.",

"b3-kokura":{type:"story", title:"'I need a lot of capital'", x:271, y:962,
  ess:"A felt fact, examined: the capital assumption.",
  hook:"You want to start a business, and one thought arrives instantly: 'I need a lot of capital to get started.' Is that a fact?",
  story:"It feels like one. The analogical route - how most people think - goes: other businesses needed capital, therefore I do too. The first-principles route asks instead: how do I know I need capital? What is capital actually for? It buys assets, time, and people - do I need all of those to start?",
  mech:"Watch the frame shift mid-questioning: from 'how much capital do I need?' to 'what's the minimum true requirement to test whether this works?' The first question can only be answered with a number; the second can be answered with an action. That reframe is the drill doing its job.",
  term:"The capital example", def:"the worked case: an inherited 'I need funding' decomposed to its minimum true requirement.",
  sowhat:"Every field has its version of 'I need capital': the credential, the headcount, the permission. Name yours.",
  explain:"the method's canonical worked example, step by visible step.",
  builds:[["b1-laplace","analogical thinking, in the wild"],["b3-timeline","the question that cracked it"]], leads:[["b3-plan","what the stripping revealed"]], live:[["b2-logistic","drill it yourself"]]},

"b3-contingency":{type:"tension", title:"Feels like reality", x:601, y:1008,
  ess:"The obstacle isn't intelligence - it's that assumptions wear reality's clothes.",
  hook:"If the method is just two moves, why isn't everyone doing this?",
  story:"Because the obstacle isn't intelligence. Most assumptions are invisible: they don't feel like assumptions, they feel like reality. You can't strip what you can't see - and the seeing is the hard part.",
  mech:"Move one presupposes a target: 'question your assumptions' is useless while the assumptions are indistinguishable from facts. So the real bottleneck sits upstream of both moves - it's detection. Everything in this section is detection technique.",
  term:"The invisibility problem", def:"the gap between knowing you should question assumptions and being able to find them.",
  sowhat:"'I already question my assumptions' usually means 'I question the ones I can see.' The load-bearing ones are the others.",
  explain:"why smart people fail at this exactly as often as everyone else.",
  builds:[["a2","the axiom at work"]], leads:[["b3-timeline","the question that finds them"]], live:[]},

"b3-timeline":{type:"mechanism", title:"'How do I know that's true?'", x:312, y:1210,
  ess:"The working question - asked actually, not rhetorically.",
  hook:"What single question, asked sincerely, turns an invisible assumption into a visible one?",
  story:"How do I know that's true? Not rhetorically - actually. Did I verify it? Did someone credible verify it? Is it a law of physics, or is it just how things have always been done?",
  mech:"This is the question that does the detection work - it demands provenance: a real fact has a verification story; a disguised assumption has only a transmission story ('everyone knows', 'we've always'). Asking it non-rhetorically means requiring an answer - the moment you accept 'well, obviously', you've stopped doing the work.",
  term:"The verification question", def:"'How do I know that's true?' - the probe that sorts verified fact from inherited convention.",
  sowhat:"Three honest sub-questions to keep in your pocket: verified by me? verified by someone credible? physics, or habit? Most beliefs fail all three.",
  explain:"the one question that does the entire detection job - and how to ask it for real.",
  builds:[["b3-contingency","the problem it solves"]], leads:[["b3-kokura","the question, applied"]], live:[]},

"b3-plan":{type:"mechanism", title:"Not load-bearing", x:543, y:1326,
  ess:"The 'fact' was a convention - and the structure stood without it.",
  hook:"What did the capital assumption turn out to be, once stripped?",
  story:"A convention inherited from observing other businesses - not a fact about yours. Reasoning from what capital is actually for pointed somewhere different: maybe you need one paying customer, not funding. The assumption felt structural; it wasn't load-bearing.",
  mech:"'Load-bearing' is the useful test: remove the assumption and see whether the actual requirement - testing whether this works - still stands. Here it stood. Plenty of assumptions do turn out to be load-bearing when checked; the point isn't that assumptions are false, it's that you don't know which until you strip them.",
  term:"The load-bearing test", def:"checking whether a removed assumption was actually holding anything up.",
  sowhat:"The expensive assumptions are the non-load-bearing ones you obey anyway - years spent raising capital you never needed.",
  explain:"what 'stripping it down revealed it wasn't load-bearing' means in practice.",
  builds:[["b3-kokura","the case, concluded"]], leads:[["b3-principle","the general lesson"]], live:[]},

"b3-principle":{type:"principle", title:"Suspect the obvious", x:774, y:1152,
  ess:"The obvious is exactly where unexamined assumptions live.",
  hook:"Of all your beliefs, which are the least likely to have ever been examined?",

  mech:"The section in one chain: invisible assumptions (the axiom) surface as a feeling of obviousness (the tension), yield to the verification question (the tool), and sometimes turn out not to be load-bearing at all (the example). The binding posture: treat 'obviously' as a flag, not a conclusion.",
  term:"Suspicion of the obvious", def:"the discipline of flagging what feels self-evident as the first place to drill.",

  builds:[["b3-contingency","why the obvious hides them"],["b3-plan","proof the obvious can be hollow"]], leads:[["b4-ergodicity","what the practice builds"]], live:[]},

"b4-coinflip":{type:"simulation", title:"The travel test", sim:"travel", x:1583, y:979,

"b4-ergodicity":{type:"mechanism", title:"Where mental models come from", x:1901, y:945,
  ess:"First principles thinking is what generates mental models.",
  hook:"Everyone collects mental models these days. Where do the good ones actually come from?",
  story:"From this practice. When you reason from first principles in a domain and build back up, what you end up with is a model of how that domain actually works. The models aren't a separate thing to acquire - they're the residue of the reasoning.",
  mech:"The rebuild forces you to connect bedrock facts into working structure, and that structure is the model. Collected models skip the construction step - which is exactly the step that made them trustworthy for their builder.",
  term:"Model generation", def:"mental models as the output of first-principles reasoning in a domain.",
  sowhat:"Reading lists of '100 mental models' hands you conclusions again - the very thing the practice exists to go underneath.",
  explain:"why mental models are a product of this practice rather than a substitute for it.",
  builds:[["b2-principle","the method that generates them"]], leads:[["b4-domains","what makes these models different"]], live:[]},

"b4-domains":{type:"mechanism", title:"Causes, not conventions", x:2219, y:979,
  ess:"A rebuilt model is grounded in how the domain actually works.",
  hook:"Two people can hold the 'same' model of a domain. Why does it work in one head and misfire in the other?",
  story:"Because the grounding differs. A model built from first principles is anchored in causes - how the domain actually works - while a borrowed copy of it is anchored in conventions: what people around you say works.",
  mech:"Causes and conventions age differently. A cause holds as long as the underlying mechanism does; a convention holds as long as the crowd does. Two models with identical wording can therefore have entirely different lifespans.",
  term:"Causal grounding", def:"a model anchored in the domain's actual mechanics rather than its social consensus.",
  sowhat:"Quick self-test on any model you use: can you explain the mechanism beneath it, or only cite who swears by it?",
  explain:"the grounding difference that makes rebuilt models more durable than borrowed ones.",
  builds:[["b4-ergodicity","what the rebuild grounds"]], leads:[["b4-survive","the knowing-why difference"]], live:[]},

"b4-survive":{type:"mechanism", title:"Why, not just that", x:2438, y:1094,
  ess:"You know why your models are true - not just that they're true.",
  hook:"What's the practical difference between knowing a thing works and knowing why it works?",
  story:"Everything, under pressure. When the situation shifts, 'that it works' gives you nothing to reason with - while 'why it works' tells you whether it still applies, how to adapt it, and what breaks first.",
  mech:"Why-knowledge carries its own applicability conditions: you can check the premises against a new situation because you know what the premises are. That-knowledge has no premises attached - it can only be applied blind and judged by results.",
  term:"Why-knowledge", def:"understanding that includes the reasons - and therefore its own limits of application.",
  sowhat:"Interview yourself the way you'd interview a hire: for each tool you rely on, can you say why it works? The gaps are your fragile spots.",
  explain:"what 'you know why they're true, not just that they're true' buys you in practice.",
  builds:[["b4-domains","causes are the why"]], leads:[["b4-signal","what its absence costs"]], live:[]},

"b4-signal":{type:"mechanism", title:"Borrowed knowledge is fragile", x:1612, y:1181,
  ess:"It only works where situations resemble the place you got it.",
  hook:"Why does advice that worked brilliantly for someone else so often fail in your hands?",
  story:"Because borrowed knowledge is fragile: you can only use it in situations that closely resemble where you got it. The resemblance was doing the work all along - not your understanding.",
  mech:"A borrowed conclusion is a compressed answer with its reasoning discarded, so resemblance to the original context is the only applicability test left. As situations drift from the source, the conclusion keeps feeling true after it has stopped being true - fragility with no warning light.",
  term:"Fragile knowledge", def:"conclusions usable only near the context they were borrowed from.",
  sowhat:"Playbooks from other companies, tactics from other markets, habits from your last job - each carries an unlabeled resemblance requirement.",

"b4-danger":{type:"mechanism", title:"First-principles knowledge is robust", x:1959, y:1152,
  ess:"It applies anywhere the underlying facts still hold.",
  hook:"What would knowledge look like if it told you, by itself, where it could and couldn't be used?",
  story:"Like this. First-principles knowledge is robust - you can apply it anywhere the underlying facts still hold. Its condition of use isn't resemblance to a remembered context; it's a check you can actually run: do the facts beneath this still hold here?",
  mech:"Because the knowledge was built up from bedrock, its dependencies are explicit - you know which facts it stands on. That yields durability (it survives context drift) and checkability (you know which facts to re-check when the world shifts - the failure condition is explicit, not hidden).",
  term:"Robust knowledge", def:"understanding valid wherever its underlying facts hold - and knowingly invalid where they don't.",
  sowhat:"'Anywhere the facts still hold' is a real boundary, not a blank check - rebuilt models die too. The difference is you know exactly what to re-check.",
  explain:"where first-principles knowledge can travel - and the one condition on the ticket.",
  builds:[["b4-survive","why carries the conditions"]], leads:[["b4-process","the two modes, side by side"]], live:[["b4-coinflip","the travel test"]]},

"b4-process":{type:"mechanism", title:"The one-line version", x:1650, y:1330,
  ess:"Recall: see → recall → apply. First principles: see → question → find true → build.",
  hook:"Can the entire difference between the two modes of thinking fit in two lines?",
  story:"It can. Most thinking: see a problem → recall a solution → apply it. First principles thinking: see a problem → question everything about it → find what's actually true → build a solution from there.",
  mech:"Line one is retrieval - its output can only be something that already existed. Line two is construction - its output is bounded by what's true, not by what's been tried. Every contrast on this chart (fragile/robust, convention/cause, borrowed/built) is these two lines wearing different clothes.",
  term:"The one-line version", def:"recall-apply versus question-find-build: the two loops, compressed.",
  sowhat:"Memorize the second line. In the moment, the full practice compresses to one check: am I recalling right now, or building?",
  explain:"the whole chart, folded into a two-line comparison you can carry.",
  builds:[["b1-laplace","line one"],["b2-principle","line two"]], leads:[["b4-destination","the real difference between them"]], live:[]},

"b4-destination":{type:"mechanism", title:"Where you start", x:2330, y:1255,
  ess:"The difference isn't effort or IQ - it's the starting layer.",
  hook:"If both thinkers face the same problem with the same intelligence, what actually separates them?",
  story:"Where they start. Everyone else starts at the solution layer - the stock of existing answers. You go underneath it, find the ground, and build up fresh. Same problem, different floor.",
  mech:"Starting at the solution layer bounds your output by precedent; starting at the ground bounds it by truth. Nothing else about the two thinkers needs to differ - the starting layer alone produces the divergence.",
  term:"The starting layer", def:"solution layer versus ground: the choice that defines the mode of thought.",
  sowhat:"'Where am I starting from?' is a cheaper question than 'am I being rigorous?' - and it catches more.",
  explain:"the single variable that separates the two modes of thinking.",

"b4-explore":{type:"tension", title:"It will look strange", x:2470, y:1430,
  ess:"Ground-up answers often look wrong to everyone reasoning by convention.",
  hook:"You rebuilt from bedrock and your answer looks nothing like what anyone else does. Did you make a mistake?",
  story:"Maybe - or maybe it's working. What you build will often look strange to everyone else, because you're not constrained by their inherited assumptions. Strangeness is what escaping a shared frame looks like from inside the frame.",
  mech:"Conventional answers resemble each other because they're drawn from the same solution layer; an answer grown from bedrock has no reason to resemble them. So resemblance to consensus stops working as a correctness check - the check that remains is the one you built with: does every step trace to something true?",
  term:"The strangeness signal", def:"the expected divergence of ground-up answers from convention-shaped ones.",
  sowhat:"Expect the raised eyebrows before you present the answer - social friction is part of the method's price, and worth budgeting for.",
  explain:"why looking wrong to everyone can be evidence of the method working.",

"b4-fence":{type:"mechanism", title:"That's not a bug", x:2090, y:1430,
  ess:"Freedom from inherited constraints is the whole point.",
  hook:"If strange-looking answers are the price - what exactly did you buy?",
  story:"Freedom from constraints that were never real. The strangeness isn't a side effect to minimize - it's the whole point: it marks answers reachable only by someone not bound by the borrowed frame.",

let anim = null;
function apply(){
  world.style.transform = `translate(${cam.tx}px, ${cam.ty}px) scale(${cam.s})`;
  lod();
}
function readerW(){ return reader.classList.contains('open') ? (reader.getBoundingClientRect().width||430) : 0; }
function visW(){ return innerWidth - readerW(); }
function centerOn(cx, cy, s){
  cam.s = s;
  cam.tx = visW()/2 - cx*s;
  cam.ty = innerHeight/2 - cy*s;
  apply();
}
function flyTo(cx, cy, s, dur=700){
  if (anim) cancelAnimationFrame(anim);
  const s0=cam.s, cx0=(visW()/2-cam.tx)/s0, cy0=(innerHeight/2-cam.ty)/s0;
  const ls0=Math.log(s0), ls1=Math.log(s);
  const t0=performance.now();
  function step(t){
    let p=Math.min(1,(t-t0)/dur);
    p = p<.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2;
    centerOn(cx0+(cx-cx0)*p, cy0+(cy-cy0)*p, Math.exp(ls0+(ls1-ls0)*p));
    if (p<1) anim=requestAnimationFrame(step);
  }
  anim=requestAnimationFrame(step);
}
function overviewCam(fly=true){
  const cx=BC.x, cy=BC.y;
  const s = Math.min(visW()/(2*Math.max(cx,WW-cx)), innerHeight/(2*Math.max(cy,WH-cy)))*0.92;
  if (fly) flyTo(cx, cy, s, 800); else centerOn(cx, cy, s);
}
vp.addEventListener('wheel', e=>{
  e.preventDefault();
  if (anim) cancelAnimationFrame(anim);
  const f = Math.exp(-e.deltaY*0.0016);
  const s2 = Math.min(2.2, Math.max(0.06, cam.s*f));
  const wx=(e.clientX-cam.tx)/cam.s, wy=(e.clientY-cam.ty)/cam.s;
  cam.s=s2; cam.tx=e.clientX-wx*s2; cam.ty=e.clientY-wy*s2;
  apply();
}, {passive:false});
const ptrs = new Map();
let panStart=null, pinchStart=null, moved=0;
vp.addEventListener('pointerdown', e=>{
  if (e.target.closest('.tlabel')) return;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size===1){
    moved=0;
    panStart={mx:e.clientX, my:e.clientY, tx:cam.tx, ty:cam.ty};
    vp.classList.add('dragging');
  } else if (ptrs.size===2){
    const [p1,p2]=[...ptrs.values()];
    pinchStart={d:Math.hypot(p1.x-p2.x,p1.y-p2.y), s:cam.s,
      wx:((p1.x+p2.x)/2-cam.tx)/cam.s, wy:((p1.y+p2.y)/2-cam.ty)/cam.s};
    panStart=null;
  }
});
addEventListener('pointermove', e=>{
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size===1 && panStart){
    if (anim) cancelAnimationFrame(anim);
    moved += Math.abs(e.movementX||0)+Math.abs(e.movementY||0);
    cam.tx = panStart.tx + (e.clientX-panStart.mx);
    cam.ty = panStart.ty + (e.clientY-panStart.my);
    apply();
  } else if (ptrs.size===2 && pinchStart){
    if (anim) cancelAnimationFrame(anim);
    const [p1,p2]=[...ptrs.values()];
    const d=Math.hypot(p1.x-p2.x,p1.y-p2.y);
    const s2=Math.min(2.2, Math.max(0.06, pinchStart.s*d/pinchStart.d));
    const cx=(p1.x+p2.x)/2, cy=(p1.y+p2.y)/2;
    cam.s=s2; cam.tx=cx-pinchStart.wx*s2; cam.ty=cy-pinchStart.wy*s2;
    apply();
  }
});
function ptrUp(e){ ptrs.delete(e.pointerId);

function highlight(id){
  clearHighlight();
  const n = N[id];
  const nb = new Set([id]);
  const conns = [
    ...n.builds.map(([t])=>({t, lab:'builds on', into:true})),
    ...n.leads.map(([t])=>({t, lab:'leads to', into:false})),
    ...n.live.map(([t])=>({t, lab:'see it live', into:false}))
  ];
  conns.forEach(c=>nb.add(c.t));
  ALL.forEach(x=>{
    mkEls[x].classList.toggle('dimmed', !nb.has(x));
    mkEls[x].classList.toggle('neighbor', nb.has(x) && x!==id);
    mkEls[x].classList.toggle('focused', x===id);
  });
  const here = dotCenter(id);
  conns.forEach(c=>{
    const there = dotCenter(c.t);
    let from = c.into ? {...there} : {...here};
    let to   = c.into ? {...here} : {...there};
    {
      const ddx=to.x-from.x, ddy=to.y-from.y, LL=Math.hypot(ddx,ddy)||1;
      const ux=ddx/LL, uy=ddy/LL, off=30;
      from = {x:from.x+ux*off, y:from.y+uy*off};
      to   = {x:to.x-ux*off,   y:to.y-uy*off};
    }
    const dx=to.x-from.x, dy=to.y-from.y, dist=Math.hypot(dx,dy)||1;
    const cx=(from.x+to.x)/2 - dy/dist*dist*0.12, cy=(from.y+to.y)/2 + dx/dist*dist*0.12;
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',`M ${from.x} ${from.y} Q ${cx} ${cy} ${to.x} ${to.y}`);
    p.setAttribute('fill','none');
    p.setAttribute('class','lnk-flow'); p.setAttribute('stroke',`rgba(${RGB_AMBER},0.45)`);
    p.setAttribute('stroke-width','2.5');
    p.setAttribute('stroke-dasharray','9,8');
    p.setAttribute('class','tline');
    p.setAttribute('marker-end','url(#arr)');
    tsvg.appendChild(p);
    const lbl = document.createElement('div');
    lbl.className='tlabel';
    lbl.style.left = (.25*from.x+.5*cx+.25*to.x)+'px';
    lbl.style.top = (.25*from.y+.5*cy+.25*to.y)+'px';
    lbl.textContent = c.lab;
    lbl.addEventListener('click', e=>{ e.stopPropagation(); openIdea(c.t); });
    world.appendChild(lbl);
    tlabels.push(lbl);
  });
}
function clearHighlight(){
  ALL.forEach(x=>mkEls[x].classList.remove('dimmed','neighbor','focused'));
  [...tsvg.querySelectorAll('path')].forEach(p=>p.remove());
  tlabels.forEach(l=>l.remove()); tlabels.length=0;
}

/* ============================================================
   NAV - top-right cluster drives the default flow
   ============================================================ */
function syncNav(){
  const i = focusId ? TOUR.indexOf(focusId) : -1;
  document.getElementById('navcluster').classList.toggle('on', !!focusId);
  document.getElementById('navPrev').disabled = i===0;
  document.getElementById('navNext').disabled = i===TOUR.length-1;
}
function navStep(dir){
  const i = focusId ? TOUR.indexOf(focusId) : -1;
  if (i<0){ openIdea(TOUR[0]); return; }
  const j = i+dir;
  if (j>=0 && j<TOUR.length) openIdea(TOUR[j]);
}
document.getElementById('navPrev').onclick = ()=>navStep(-1);
document.getElementById('navNext').onclick = ()=>navStep(1);

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
function setActive(fig, btn){
  fig.querySelectorAll('.ghost').forEach(b=>{ if(b.dataset.d!==undefined||b.dataset.m!==undefined) b.classList.remove('active');});
  if (btn) btn.classList.add('active');
}
function simHTML(kind){
  const caps = {
    trace:"One ordinary belief, traced upstream. Every hop was transmission; none was verification.",
    drill:"The two moves on a live claim. Strip each unverified layer, hit bedrock, then build back up.",
    travel:"Two kinds of knowledge leaving home. Gray runs on resemblance; amber runs on knowing why."
  };
  const ctl = {
    trace:`<button class="ghost" data-a="trace">trace it back</button>
      <button class="ghost" data-a="reset">reset</button>`,
    drill:`<button class="ghost" data-a="ask">“how do I know that's true?”</button>
      <button class="ghost" data-a="build">build back up</button>
      <button class="ghost" data-a="reset">reset</button>`,
    travel:`<button class="ghost" data-a="run">run the test</button>
      <button class="ghost" data-a="facts">change the underlying facts</button>
      <button class="ghost" data-a="reset">reset</button>`
  };
  return `<figure class="frame" data-sim="${kind}">
    <canvas></canvas>
    <div class="controls">${ctl[kind]}</div>
    <figcaption>${caps[kind]}</figcaption>
  </figure>`;
}
const SIMS = {};

SIMS.trace = fig=>{
  const cv=fig.querySelector('canvas'); cv.width=700; cv.height=400;
  const ctx=cv.getContext('2d');
  const W=700,H=400;
  const nodes=[
    {x:565,y:150,l1:"your belief",l2:"“this is just how it's done”"},
    {x:415,y:210,l1:"the person you got it from",l2:"repeated what worked around them"},
    {x:265,y:150,l1:"the convention they inherited",l2:"“everyone in the field does this”"},
    {x:115,y:210,l1:"the original constraint",l2:"years ago - possibly gone"}
  ];
  let shown=1,anim=0,raf=null;
  function draw(){
    ctx.fillStyle=SUNK;ctx.fillRect(0,0,W,H);
    ctx.font='14px Inter, sans-serif';
    for(let i=0;i<shown-1;i++){
      const a=nodes[i],b=nodes[i+1];
      const t=(i===shown-2)?Math.min(1,anim):1;
      ctx.strokeStyle=FAINT;ctx.lineWidth=1.6;ctx.setLineDash([5,4]);
      ctx.beginPath();ctx.moveTo(a.x-26,a.y);
      ctx.lineTo(a.x-26+(b.x+26-(a.x-26))*t,a.y+(b.y-a.y)*t);ctx.stroke();ctx.setLineDash([]);
      if(t===1){ctx.fillStyle=GRAY;ctx.font='12px Inter, sans-serif';
        ctx.fillText("verified? no - passed along",(a.x+b.x)/2-58,(a.y+b.y)/2-10);
        ctx.font='14px Inter, sans-serif';}
    }
    for(let i=0;i<shown;i++){
      const n=nodes[i],cur=(i===shown-1);
      const t=(cur&&i>0)?Math.min(1,anim):1;
      ctx.globalAlpha=t;
      ctx.fillStyle= i===0?AMBER:GRAY;
      ctx.beginPath();ctx.arc(n.x,n.y,i===0?12:9,0,7);ctx.fill();
      ctx.fillStyle=INKC;ctx.font='600 13.5px Inter, sans-serif';
      ctx.fillText(n.l1,n.x-60,n.y+34);
      ctx.fillStyle=GRAY;ctx.font='12.5px Inter, sans-serif';
      ctx.fillText(n.l2,n.x-60,n.y+52);
      ctx.globalAlpha=1;
    }
    ctx.font='15px Inter, sans-serif';
    if(shown<4){ctx.fillStyle=GRAY;
      ctx.fillText(`hops traced: ${shown-1} of 3 - keep tracing`,16,H-20);}
    else{ctx.fillStyle=INKC;
      ctx.fillText("chain complete · verifications found along the way: 0",16,H-42);
      ctx.fillStyle=GRAY;ctx.font='13px Inter, sans-serif';
      ctx.fillText("certainty travelled the whole chain. verification never boarded.",16,H-20);}
  }
  function reveal(){
    if(shown>=4)return;
    shown++;anim=0;
    cancelAnimationFrame(raf);
    const tick=()=>{anim+=0.06;draw();if(anim<1)raf=requestAnimationFrame(tick);};
    raf=requestAnimationFrame(tick);
  }
  draw();
  fig.querySelectorAll('.ghost').forEach(b=>b.onclick=()=>{
    if(b.dataset.a==='trace')reveal();
    else{shown=1;anim=0;cancelAnimationFrame(raf);draw();}
  });
  return ()=>cancelAnimationFrame(raf);
};

SIMS.drill = fig=>{
  const cv=fig.querySelector('canvas'); cv.width=700; cv.height=460;
  const ctx=cv.getContext('2d');
  const W=700,H=460;
  const layers=[
    {t:"“I need a lot of capital to get started.”",s:"feels like a fact",kind:"claim"},
    {t:"how do I know? - other businesses needed capital",s:"an observation about them - convention, not fact",kind:"conv"},
    {t:"what is capital actually for? - it buys assets, time, and people",s:"function - closer to ground. do I need all of those to start?",kind:"func"},
    {t:"minimum true requirement: test whether anyone will pay",s:"bedrock - testable, independent of convention",kind:"rock"}
  ];
  let depth=0,built=false;
  function draw(){
    ctx.fillStyle=SUNK;ctx.fillRect(0,0,W,H);
    const y0=26,lh=86;
    for(let i=0;i<layers.length;i++){
      const y=y0+i*lh,vis=i<=depth;
      if(!vis){
        ctx.strokeStyle=BRD;ctx.setLineDash([4,5]);ctx.lineWidth=1;
        ctx.strokeRect(30,y,W-60,lh-14);ctx.setLineDash([]);
        ctx.fillStyle=FAINT;ctx.font='13px Inter, sans-serif';
        ctx.fillText("…something deeper? ask again.",46,y+40);
        continue;
      }
      const cur=(i===depth&&!built);
      ctx.fillStyle= cur?`rgba(${RGB_AMBER},0.08)`:`rgba(${RGB_INK},0.03)`;
      ctx.fillRect(30,y,W-60,lh-14);
      ctx.strokeStyle= cur?AMBER:(i===3?INKC:BRD);
      ctx.lineWidth= cur?2:1.2;
      ctx.strokeRect(30,y,W-60,lh-14);
      if(i===3){for(let hx=34;hx<W-34;hx+=14){
        ctx.strokeStyle=BRD;ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(hx,y+lh-16);ctx.lineTo(hx+7,y+lh-24);ctx.stroke();}}
      ctx.fillStyle= cur?INKC:(i<depth?GRAY:INKC);
      ctx.font='600 14.5px Inter, sans-serif';
      ctx.fillText(layers[i].t,46,y+28);
      ctx.fillStyle=GRAY;ctx.font='12.5px Inter, sans-serif';
      ctx.fillText(layers[i].s,46,y+50);
      if(i<depth){ctx.fillStyle=FAINT;ctx.font='12px Inter, sans-serif';
        ctx.fillText(" - stripped: unverified",W-190,y+28);}
    }
    ctx.font='14px Inter, sans-serif';
    if(built){
      ctx.fillStyle=`rgba(${RGB_AMBER},0.10)`;ctx.fillRect(30,H-64,W-60,44);
      ctx.strokeStyle=AMBER;ctx.lineWidth=2;ctx.strokeRect(30,H-64,W-60,44);
      ctx.fillStyle=INKC;ctx.font='600 15px Inter, sans-serif';
      ctx.fillText("rebuilt from bedrock: get one paying customer - not funding.",46,H-37);
    }else if(depth<3){
      ctx.fillStyle=GRAY;
      ctx.fillText(`layers stripped: ${depth} of 3 - keep asking`,30,H-30);
    }else{
      ctx.fillStyle=INKC;
      ctx.fillText("bedrock reached. now: given only what I know to be true, what would I actually build?",30,H-30);
    }
  }
  draw();
  fig.querySelectorAll('.ghost').forEach(b=>b.onclick=()=>{
    const a=b.dataset.a;
    if(a==='ask'&&depth<3&&!built)depth++;
    else if(a==='build'&&depth===3)built=true;
    else if(a==='reset'){depth=0;built=false;}
    draw();
  });
  return ()=>{};
};

SIMS.travel = fig=>{
  const cv=fig.querySelector('canvas'); cv.width=700; cv.height=430;
  const ctx=cv.getContext('2d');
  const W=700,H=430,NC=8;
  let prog=0,factsChanged=false,raf=null,running=false;
  const colX=i=>70+i*(W-120)/(NC-1);
  function draw(){
    ctx.fillStyle=SUNK;ctx.fillRect(0,0,W,H);
    ctx.font='13px Inter, sans-serif';ctx.fillStyle=GRAY;
    ctx.fillText("← closely resembles the origin",56,44);
    ctx.fillText("nothing like it →",W-160,44);
    for(let i=0;i<NC;i++){
      const x=colX(i);
      ctx.strokeStyle=BRD;ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(x,60);ctx.lineTo(x,320);ctx.stroke();
      ctx.fillStyle=FAINT;ctx.font='11.5px Inter, sans-serif';
      ctx.fillText(i===0?"home":(factsChanged&&i===NC-1?"facts changed":`situation ${i}`),x-24,336);
    }
    const row=(y,label,col)=>{
      ctx.fillStyle=col;ctx.font='600 13.5px Inter, sans-serif';
      ctx.fillText(label,56,y-24);};
    row(140,"borrowed rule - carried by resemblance",GRAY);
    row(260,"rebuilt model - carried by knowing why",AMBER);
    const seen=Math.floor(prog);
    for(let i=0;i<NC;i++){
      if(i>seen)continue;
      const x=colX(i);
      const bOK=i<=2, rOK=!(factsChanged&&i===NC-1);
      ctx.font='600 17px Inter, sans-serif';
      ctx.fillStyle=bOK?GRAY:FAINT;
      ctx.fillText(bOK?"✓":"✗",x-6,146);
      ctx.fillStyle=rOK?AMBER:FAINT;
      ctx.fillText(rOK?"✓":"✗",x-6,266);
      if(!bOK&&i===3){ctx.fillStyle=GRAY;ctx.font='11.5px Inter, sans-serif';
        ctx.fillText("resemblance gone - ",x-42,168);ctx.fillText("fails, silently",x-30,182);}
      if(!rOK){ctx.fillStyle=INKC;ctx.font='11.5px Inter, sans-serif';
        ctx.fillText("foundation moved - a",x-72,288);ctx.fillText("premise you knew to check",x-84,302);}
    }
    ctx.font='14px Inter, sans-serif';ctx.fillStyle=INKC;
    if(seen<NC-1&&running)ctx.fillText("travelling…",56,388);
    else if(seen>=NC-1){
      ctx.fillText(factsChanged?
        "when the underlying facts themselves change, the rebuilt model fails too - at a premise you could name.":
        "the borrowed rule died with the resemblance. the rebuilt model travelled the whole way.",56,388);
      ctx.fillStyle=GRAY;ctx.font='12.5px Inter, sans-serif';
      ctx.fillText("robust = valid anywhere the underlying facts still hold. that's the whole condition.",56,410);
    }else ctx.fillText("press “run the test” to carry both away from home.",56,388);
  }
  function run(){
    running=true;prog=0;cancelAnimationFrame(raf);
    const tick=()=>{prog+=0.045;draw();
      if(prog<NC-1)raf=requestAnimationFrame(tick);else{running=false;prog=NC-1;draw();}};
    raf=requestAnimationFrame(tick);
  }
  draw();
  fig.querySelectorAll('.ghost').forEach(b=>b.onclick=()=>{
    const a=b.dataset.a;
    if(a==='run')run();
    else if(a==='facts'){factsChanged=!factsChanged;setActive(fig,b);if(!running)draw();}
    else{factsChanged=false;prog=0;running=false;cancelAnimationFrame(raf);draw();}
  });
  return ()=>cancelAnimationFrame(raf);
};/* ============================================================
   BOOT
   ============================================================ */
