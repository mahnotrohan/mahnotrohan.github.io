/* Canvas backing store follows the device pixel ratio, so canvas text stays
   crisp in the ~570px reader column. Sims still draw in logical 700-wide units. */
const _DPR = Math.max(1, Math.min(2, (typeof devicePixelRatio === 'number' ? devicePixelRatio : 1) || 1));
function fitCanvas(cv, w, h){
  cv.width = Math.round(w*_DPR); cv.height = Math.round(h*_DPR);
  const ctx = cv.getContext('2d');
  if (ctx.setTransform) ctx.setTransform(_DPR,0,0,_DPR,0,0);
  return ctx;
}
const SIMS = {};

/* wrap a string to n chars, returning lines */
function wrapTxt(ctx, s, maxw){
  const words = s.split(' '); const out = []; let line = '';
  for (const w of words){
    const t = line ? line+' '+w : w;
    if (ctx.measureText(t).width > maxw && line){ out.push(line); line = w; } else line = t;
  }
  if (line) out.push(line);
  return out;
}

/* ---------- I · mirroring ---------------------------------------------- */
SIMS.mirror = fig=>{
  const cv=fig.querySelector('canvas');
  const W=700,H=430, ctx=fitCanvas(cv,W,H);
  const THEM = "Look, we've been burned before on a deal exactly like this one.";
  const R = {
    mirror:{you:"“Burned before?”", reveal:0.92,
      them:"Yeah — last year we signed with a vendor who promised the same integration timeline and it slipped two quarters. My board still brings it up. Honestly I'm the one who pushed for it.",
      note:"Three words and silence. They reworded, then volunteered the board, the timeline and their own exposure."},
    label:{you:"“It seems like you're the one carrying the risk on this.”", reveal:0.84,
      them:"That's right. If this goes the way the last one did, it's my name on it. I need something I can show them by March.",
      note:"A label got a ‘that's right’ and a deadline you did not know existed."},
    why:{you:"“Why would this be any different?”", reveal:0.22,
      them:"I didn't say it wouldn't be. I'm just telling you what happened.",
      note:"‘Why' is an accusation in any language. They defended instead of explaining."},
    solve:{you:"“We can add a penalty clause to cover that.”", reveal:0.14,
      them:"Sure, send it over and we'll take a look.",
      note:"You solved a problem you had not finished hearing. The conversation is over and you learned nothing."}
  };
  let pick=null;
  function draw(){
    ctx.fillStyle=SUNK; ctx.fillRect(0,0,W,H);
    ctx.textAlign='left';
    ctx.fillStyle=GRAY; ctx.font='11.5px Inter, sans-serif';
    ctx.fillText('THEM',30,28);
    ctx.fillStyle=INKC; ctx.font='15px Inter, sans-serif';
    wrapTxt(ctx,THEM,620).forEach((l,i)=>ctx.fillText(l,30,50+i*21));
    if(!pick){
      ctx.fillStyle=FAINT; ctx.font='13.5px Inter, sans-serif';
      ctx.fillText('Choose a reply below.',30,110);
      return;
    }
    const r=R[pick];
    ctx.fillStyle=AMBER; ctx.font='11.5px Inter, sans-serif'; ctx.fillText('YOU',30,102);
    ctx.fillStyle=AMBER; ctx.font='15px Inter, sans-serif';
    let y=124; wrapTxt(ctx,r.you,620).forEach(l=>{ctx.fillText(l,30,y); y+=21;});
    y+=16;
    ctx.fillStyle=GRAY; ctx.font='11.5px Inter, sans-serif'; ctx.fillText('THEM',30,y); y+=22;
    ctx.fillStyle=INKC; ctx.font='15px Inter, sans-serif';
    wrapTxt(ctx,r.them,620).forEach(l=>{ctx.fillText(l,30,y); y+=21;});
    /* reveal bar */
    const BY=340, BW=W-60;
    ctx.fillStyle=GRAY; ctx.font='11.5px Inter, sans-serif';
    ctx.fillText('how much they just told you',30,BY-8);
    ctx.strokeStyle=BRD; ctx.lineWidth=1; ctx.strokeRect(30,BY,BW,14);
    ctx.fillStyle=`rgba(${RGB_AMBER},0.42)`; ctx.fillRect(30,BY,BW*r.reveal,14);
    ctx.fillStyle=INKC; ctx.font='13.5px Inter, sans-serif';
    wrapTxt(ctx,r.note,BW).forEach((l,i)=>ctx.fillText(l,30,BY+38+i*19));
  }
  draw();
  fig.querySelectorAll('.ghost').forEach(b=>b.onclick=()=>{
    if(b.dataset.a==='reset'){ pick=null;
      fig.querySelectorAll('.ghost').forEach(x=>{ if(x.dataset.m) x.classList.remove('active'); });
    } else { setActive(fig,b); pick=b.dataset.m; }
    draw();});
  return ()=>{};
};

/* ---------- II · the summary ladder ----------------------------------- */
SIMS.ladder = fig=>{
  const cv=fig.querySelector('canvas');
  const W=700,H=430, ctx=fitCanvas(cv,W,H);
  const RUNGS=[
    ["Effective pause","Silence, used for emphasis, until the emotion drains out"],
    ["Minimal encouragers","“Yes.” “OK.” “Uh-huh.” “I see.”"],
    ["Mirroring","Repeat their critical one to three words, then wait"],
    ["Labeling","“It seems like…” — name the emotion, then go quiet"],
    ["Paraphrasing","Say their position back in your own words"],
    ["Summary","Paraphrase + label = summary. The whole world according to them"]
  ];
  let step=0, skipped=false;
  function draw(){
    ctx.fillStyle=SUNK; ctx.fillRect(0,0,W,H);
    ctx.textAlign='left';
    ctx.fillStyle=GRAY; ctx.font='11.5px Inter, sans-serif';
    ctx.fillText('THE SIX TOOLS, IN ORDER',30,26);
    RUNGS.forEach((r,i)=>{
      const y=52+i*44, done=!skipped && i<step;
      ctx.strokeStyle=done?AMBER:BRD; ctx.lineWidth=1.4;
      ctx.strokeRect(30,y,15,15);
      if(done){ ctx.strokeStyle=AMBER; ctx.lineWidth=2.2; ctx.beginPath();
        ctx.moveTo(33,y+8); ctx.lineTo(36.5,y+11.5); ctx.lineTo(42,y+3.5); ctx.stroke(); }
      ctx.fillStyle=done?INKC:GRAY; ctx.font='14.5px Inter, sans-serif';
      ctx.fillText(`${i+1}. ${r[0]}`,58,y+12);
      ctx.fillStyle=done?GRAY:FAINT; ctx.font='12.5px Inter, sans-serif';
      ctx.fillText(r[1],58,y+29);
    });
    const BY=326;
    ctx.fillStyle=GRAY; ctx.font='11.5px Inter, sans-serif'; ctx.fillText('trust',30,BY-8);
    ctx.strokeStyle=BRD; ctx.lineWidth=1; ctx.strokeRect(30,BY,W-60,13);
    const frac = skipped ? 0.18 : step/6;
    ctx.fillStyle=`rgba(${RGB_AMBER},0.42)`; ctx.fillRect(30,BY,(W-60)*frac,13);
    ctx.font='16px Inter, sans-serif';
    if(skipped){
      ctx.fillStyle=INKC; ctx.fillText('“You’re right.”',30,BY+42);
      ctx.fillStyle=GRAY; ctx.font='13px Inter, sans-serif';
      ctx.fillText('A happy smile, and they leave you alone for twenty-four hours. You have agreed to nothing.',30,BY+64);
    } else if(step>=6){
      ctx.fillStyle=AMBER; ctx.fillText('“That’s right.”',30,BY+42);
      ctx.fillStyle=GRAY; ctx.font='13px Inter, sans-serif';
      ctx.fillText('Invisible to them when it happens. To them it is a subtle epiphany — and now you can ask.',30,BY+64);
    } else {
      ctx.fillStyle=FAINT; ctx.font='13px Inter, sans-serif';
      ctx.fillText(`${6-step} tool${6-step===1?'':'s'} to go. The summary only works once the rest have run.`,30,BY+44);
    }
  }
  draw();
  fig.querySelectorAll('.ghost').forEach(b=>b.onclick=()=>{
    const a=b.dataset.a;
    if(a==='next'){ skipped=false; step=Math.min(6,step+1); }
    else if(a==='skip'){ skipped=true; }
    else { step=0; skipped=false; }
    draw();});
  return ()=>{};
};

/* ---------- III · anchoring ------------------------------------------- */
SIMS.anchor = fig=>{
  const cv=fig.querySelector('canvas');
  const W=700,H=400, ctx=fitCanvas(cv,W,H);
  const X0=54,X1=650,LY=150,MAXV=10000;
  const THEIRS=10000, TARGET=6000;
  let mine=9000;
  const px=v=>X0+(v/MAXV)*(X1-X0);
  const money=v=>'$'+Math.round(v).toLocaleString();
  function draw(){
    ctx.fillStyle=SUNK; ctx.fillRect(0,0,W,H);
    ctx.textAlign='left';
    ctx.fillStyle=GRAY; ctx.font='11.5px Inter, sans-serif';
    ctx.fillText('THEY ARE ASKING $10,000. YOU WANT TO PAY $6,000.',30,28);
    /* the line */
    ctx.strokeStyle=BRD; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(X0,LY); ctx.lineTo(X1,LY); ctx.stroke();
    const mark=(v,lab,col,up)=>{
      const x=px(v);
      ctx.strokeStyle=col; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(x,LY-(up?26:0)); ctx.lineTo(x,LY+(up?0:26)); ctx.stroke();
      ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,LY,5,0,7); ctx.fill();
      ctx.font='12.5px Inter, sans-serif';
      ctx.textAlign = x>W-130 ? 'right' : 'left';
      ctx.fillText(lab, x + (x>W-130?-8:8), LY+(up?-32:44));
      ctx.textAlign='left';
    };
    const mid=(mine+THEIRS)/2;
    /* target, faint */
    ctx.setLineDash([4,4]); ctx.strokeStyle=FAINT; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(px(TARGET),LY-40); ctx.lineTo(px(TARGET),LY+56); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=FAINT; ctx.font='11.5px Inter, sans-serif';
    ctx.fillText('your target',px(TARGET)+6,LY+72);
    mark(THEIRS,'their ask '+money(THEIRS),GRAY,true);
    mark(mine,'your opening '+money(mine),AMBER,false);
    /* the midpoint */
    const x=px(mid);
    ctx.fillStyle=`rgba(${RGB_INK},0.30)`; ctx.fillRect(px(Math.min(mine,THEIRS)),LY-9,Math.abs(px(THEIRS)-px(mine)),18);
    ctx.strokeStyle=INKC; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(x,LY-20); ctx.lineTo(x,LY+20); ctx.stroke();
    ctx.fillStyle=INKC; ctx.font='13.5px Inter, sans-serif';
    ctx.textAlign='center'; ctx.fillText('“split the difference” '+money(mid),Math.min(Math.max(x,110),W-110),LY-32);
    ctx.textAlign='left';
    /* readout */
    const gap=mid-TARGET;
    ctx.fillStyle=INKC; ctx.font='14px Inter, sans-serif';
    ctx.fillText(`Meeting in the middle costs you ${money(gap)} more than your target.`,30,258);
    ctx.fillStyle=GRAY; ctx.font='13px Inter, sans-serif';
    ctx.fillText('Their ask never moved. Only your opening did — and the midpoint followed it.',30,282);
    ctx.fillStyle=mine<=6500?AMBER:FAINT; ctx.font='13px Inter, sans-serif';
    ctx.fillText(mine<=6500
      ? 'At an extreme anchor the “fair” middle finally lands near what you wanted all along.'
      : 'Open near their number and the “fair” middle is simply their number, slightly discounted.',30,306);
    ctx.fillStyle=FAINT; ctx.font='12px Inter, sans-serif';
    ctx.fillText('Schematic. Voss’s own advice is to let them anchor first where you can.',30,336);
  }
  draw();
  const sl=fig.querySelector('input');
  sl.oninput=()=>{mine=parseFloat(sl.value);draw();};
  fig.querySelectorAll('.ghost').forEach(b=>b.onclick=()=>{
    mine = b.dataset.a==='target' ? TARGET : Math.round(TARGET*0.65);
    sl.value=mine; draw();});
  return ()=>{};
};

/* ---------- III · the Ackerman ladder --------------------------------- */
SIMS.ackerman = fig=>{
  const cv=fig.querySelector('canvas');
  const W=700,H=430, ctx=fitCanvas(cv,W,H);
  const PCT=[65,85,95,100];
  let target=60000, shown=0;
  const money=v=>'$'+Math.round(v).toLocaleString();
  /* precise, non-round final number */
  const odd=v=>{ const base=Math.round(v/1000)*1000; return base - 137 - (base/1000)%9; };
  function draw(){
    ctx.fillStyle=SUNK; ctx.fillRect(0,0,W,H);
    ctx.textAlign='left';
    ctx.fillStyle=GRAY; ctx.font='11.5px Inter, sans-serif';
    ctx.fillText(`YOUR TARGET: ${money(target)}`,30,26);
    const X0=30,BW=W-60,BY=52,RH=54;
    PCT.forEach((p,i)=>{
      const y=BY+i*RH, live=i<shown;
      const val = (i===3) ? odd(target) : target*p/100;
      ctx.strokeStyle=BRD; ctx.lineWidth=1; ctx.strokeRect(X0,y,BW,26);
      if(live){ ctx.fillStyle=`rgba(${RGB_AMBER},0.34)`; ctx.fillRect(X0,y,BW*p/100,26); }
      ctx.fillStyle=live?INKC:FAINT; ctx.font='14px Inter, sans-serif';
      ctx.fillText(`${p}%`,X0+8,y+18);
      ctx.fillText(live?money(val):'—',X0+62,y+18);
      if(live && i>0){
        const prev = target*PCT[i-1]/100;
        ctx.fillStyle=GRAY; ctx.font='12.5px Inter, sans-serif';
        ctx.fillText(`+${money(val-prev)}`,X0+190,y+18);
      }
      ctx.fillStyle=live?GRAY:FAINT; ctx.font='12.5px Inter, sans-serif';
      const notes=['extreme anchor — a slap that limits their thinking',
                   'first raise. Only after they counter.',
                   'second raise, half the size of the first',
                   'final. Non-round, plus a token non-cash item.'];
      ctx.fillText(notes[i],X0+8,y+42);
    });
    const FY=BY+4*RH+14;
    ctx.fillStyle=INKC; ctx.font='14px Inter, sans-serif';
    if(shown===0) ctx.fillText('Press “next offer”. Hold each number until they counter.',30,FY+14);
    else if(shown<4) ctx.fillText(`Increments so far: ${PCT.slice(1,shown).map((p,i)=>'+'+money(target*(p-PCT[i])/100)).join(', ')||'—'}`,30,FY+14);
    else {
      ctx.fillStyle=AMBER;
      ctx.fillText(`Final: ${money(odd(target))} + a non-monetary item they probably don’t want.`,30,FY+14);
      ctx.fillStyle=GRAY; ctx.font='13px Inter, sans-serif';
      ctx.fillText('The raises halved each time, so they feel they squeezed out the last drop.',30,FY+38);
      ctx.fillText('You arrived at the number you wanted before the conversation started.',30,FY+58);
    }
    if(shown>0 && shown<4){
      ctx.fillStyle=GRAY; ctx.font='13px Inter, sans-serif';
      ctx.fillText('Say no in a different way and wait. Do not raise until they move.',30,FY+38);
    }
  }
  draw();
  const sl=fig.querySelector('input');
  sl.oninput=()=>{target=parseFloat(sl.value); shown=0; draw();};
  fig.querySelectorAll('.ghost').forEach(b=>b.onclick=()=>{
    shown = b.dataset.a==='next' ? Math.min(4,shown+1) : 0; draw();});
  return ()=>{};
};

/* ---------- IV · four ways to say no ---------------------------------- */
SIMS.noladder = fig=>{
  const cv=fig.querySelector('canvas');
  const W=700,H=430, ctx=fitCanvas(cv,W,H);
  const STEPS=[
    ["“How am I supposed to do that?”",
     "Deferential. It hands them your constraints and asks for help.", 8200],
    ["“Your offer is very generous, I’m sorry, that just doesn’t work for me.”",
     "“Generous” nurtures them to live up to the word.", 7400],
    ["“I’m sorry but I’m afraid I just can’t do that.”",
     "An inability, not a refusal. It triggers their empathy.", 6800],
    ["“I’m sorry, no.”",
     "Downward inflection, tone of regard. Not “NO!”", 6400]
  ];
  let n=0;
  const money=v=>'$'+v.toLocaleString();
  function draw(){
    ctx.fillStyle=SUNK; ctx.fillRect(0,0,W,H);
    ctx.textAlign='left';
    ctx.fillStyle=GRAY; ctx.font='11.5px Inter, sans-serif';
    ctx.fillText('THEIR OPENING: $9,000. YOU HAVE NOT SAID THE WORD ONCE.',30,26);
    STEPS.forEach((s,i)=>{
      const y=54+i*72, live=i<n;
      ctx.fillStyle=live?AMBER:FAINT;
      ctx.beginPath(); ctx.arc(38,y+6,4,0,7); ctx.fill();
      ctx.fillStyle=live?INKC:FAINT; ctx.font='14.5px Inter, sans-serif';
      wrapTxt(ctx,s[0],560).forEach((l,k)=>ctx.fillText(l,54,y+11+k*20));
      ctx.fillStyle=live?GRAY:FAINT; ctx.font='12.5px Inter, sans-serif';
      ctx.fillText(s[1],54,y+(wrapTxt(ctx,s[0],560).length>1?51:31));
      if(live){
        ctx.fillStyle=AMBER; ctx.font='13.5px Inter, sans-serif';
        ctx.textAlign='right'; ctx.fillText(money(s[2]),W-30,y+11); ctx.textAlign='left';
      }
    });
    const FY=352;
    ctx.fillStyle=GRAY; ctx.font='11.5px Inter, sans-serif';
    ctx.fillText('how far their offer still sits above your target',30,FY-8);
    ctx.strokeStyle=BRD; ctx.lineWidth=1; ctx.strokeRect(30,FY,W-60,13);
    const start=9000, cur = n?STEPS[n-1][2]:start;
    ctx.fillStyle=`rgba(${RGB_AMBER},0.42)`;
    ctx.fillRect(30,FY,(W-60)*((cur-6000)/(start-6000)),13);
    ctx.fillStyle=INKC; ctx.font='14px Inter, sans-serif';
    ctx.fillText(n===0
      ? 'Press “refuse”. Watch who does the moving.'
      : (n<4 ? `They came down ${money(start-cur)} without you conceding anything.`
             : `Four refusals, ${money(start-cur)} of movement, and the word used once.`),30,FY+38);
    if(n>=4){ ctx.fillStyle=GRAY; ctx.font='13px Inter, sans-serif';
      ctx.fillText('The aim was never to argue. It was to get them bidding against themselves.',30,FY+60); }
  }
  draw();
  fig.querySelectorAll('.ghost').forEach(b=>b.onclick=()=>{
    n = b.dataset.a==='next' ? Math.min(4,n+1) : 0; draw();});
  return ()=>{};
};

/* ---------- IV · 7-38-55 --------------------------------------------- */
SIMS.tells = fig=>{
  const cv=fig.querySelector('canvas');
  const W=700,H=400, ctx=fitCanvas(cv,W,H);
  const CH=[["words",7,"“Yes, that works for us.”","“No, that doesn’t work.”"],
            ["tone of voice",38,"warm, unhesitating","flat, a beat too slow"],
            ["body and face",55,"open, leaning in","closed, eyes elsewhere"]];
  let v=[1,0,0];
  function draw(){
    ctx.fillStyle=SUNK; ctx.fillRect(0,0,W,H);
    ctx.textAlign='left';
    ctx.fillStyle=GRAY; ctx.font='11.5px Inter, sans-serif';
    ctx.fillText('WHAT EACH CHANNEL IS SAYING',30,26);
    const X0=30, BW=W-60;
    CH.forEach((c,i)=>{
      const y=50+i*72, yes=v[i]===1;
      ctx.fillStyle=INKC; ctx.font='14px Inter, sans-serif';
      ctx.fillText(`${c[0]} — ${c[1]}%`,X0,y+12);
      ctx.fillStyle=yes?AMBER:GRAY; ctx.font='13.5px Inter, sans-serif';
      ctx.textAlign='right'; ctx.fillText(yes?'says yes':'says no',W-30,y+12); ctx.textAlign='left';
      ctx.strokeStyle=BRD; ctx.lineWidth=1; ctx.strokeRect(X0,y+20,BW,16);
      ctx.fillStyle = yes ? `rgba(${RGB_AMBER},0.40)` : `rgba(${RGB_GRAY},0.40)`;
      ctx.fillRect(X0,y+20,BW*c[1]/100,16);
      ctx.fillStyle=GRAY; ctx.font='12.5px Inter, sans-serif';
      ctx.fillText(yes?c[2]:c[3],X0,y+52);
    });
    const score = v[0]*7 + v[1]*38 + v[2]*55;
    ctx.fillStyle=INKC; ctx.font='15px Inter, sans-serif';
    ctx.fillText(`The message reads ${score}% yes, ${100-score}% no.`,30,296);
    ctx.fillStyle=GRAY; ctx.font='13px Inter, sans-serif';
    let verdict;
    if(v[0]===1 && score<50) verdict='A counterfeit yes. Say the mismatch out loud: “I heard you say yes, but it seemed like there was hesitation in your voice.”';
    else if(score===100) verdict='All three channels agree. Now get it twice more, from different angles — the Rule of Three.';
    else if(score===0) verdict='A clean no. Useful: it is the start of the negotiation, not the end.';
    else verdict='The channels disagree. Voss’s move is to label the gap rather than accept the words.';
    wrapTxt(ctx,verdict,W-60).forEach((l,i)=>ctx.fillText(l,30,322+i*20));
    ctx.fillStyle=FAINT; ctx.font='12px Inter, sans-serif';
    ctx.fillText('Words carry 7%. If you are only hearing words, you are hearing almost none of it.',30,H-16);
  }
  draw();
  fig.querySelectorAll('.ghost').forEach(b=>b.onclick=()=>{
    const d=b.dataset;
    const idx = d.w!==undefined?0 : d.t!==undefined?1 : 2;
    const val = parseInt(d.w!==undefined?d.w : d.t!==undefined?d.t : d.b,10);
    v[idx]=val;
    const key = idx===0?'w' : idx===1?'t':'b';
    fig.querySelectorAll('.ghost').forEach(x=>{ if(x.dataset[key]!==undefined) x.classList.remove('active'); });
    b.classList.add('active');
    draw();});
  return ()=>{};
};
