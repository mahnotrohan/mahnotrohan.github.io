title:               Rohan Mahnot
include:             ['_pages']

url:                 "https://rohanmahnot.space"
baseurl:             ''

use_html_extension:  false

open_external_links_in_new_tab: true

embed_tweets: false

permalink:           pretty
relative_permalinks: false

sass:
  sass_dir:          _sass
  style:            :compressed

collections:
  notes:
    output: true
    permalink: /notes/:slug/
  letters:
    output: true
    permalink: /letters/:slug/

defaults:
  - scope:
      path: "**/*"
    values:
      layout: "default"
  - scope:
      path: "_notes/*.md"
    values:
      layout: "notes"
  # Notes In Transit and the letters behind it stay unlisted: reachable by
  # direct URL only, never crawled, indexed, or included in search/RSS.
  - scope:
      path: "_letters/*"
    values:
      noindex: true
      sitemap: false
